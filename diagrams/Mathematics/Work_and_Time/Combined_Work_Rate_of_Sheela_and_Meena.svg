<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\"><rect width=\"400\" height=\"400\" fill=\"white\"/><text x=\"200\" y=\"30\" text-anchor=\"middle\" font-size=\"16\" font-family=\"sans-serif\">Combined Work Rate of Sheela and Meena</text><line x1=\"60\" y1=\"340\" x2=\"360\" y2=\"340\" stroke=\"black\" stroke-width=\"2\"/><line x1=\"60\" y1=\"340\" x2=\"60\" y2=\"40\" stroke=\"black\" stroke-width=\"2\"/><line x1=\"60\" y1=\"340\" x2=\"60\" y2=\"345\" stroke=\"black\"/><text x=\"60\" y=\"360\" text-anchor=\"middle\" font-size=\"12\" font-family=\"sans-serif\">0</text><line x1=\"135\" y1=\"340\" x2=\"135\" y2=\"345\" stroke=\"black\"/><text x=\"135\" y=\"360\" text-anchor=\"middle\" font-size=\"12\" font-family=\"sans-serif\">10</text><line x1=\"210\" y1=\"340\" x2=\"210\" y2=\"345\" stroke=\"black\"/><text x=\"210\" y=\"360\" text-anchor=\"middle\" font-size=\"12\" font-family=\"sans-serif\">20</text><line x1=\"285\" y1=\"340\" x2=\"285\" y2=\"345\" stroke=\"black\"/><text x=\"285\" y=\"360\" text-anchor=\"middle\" font-size=\"12\" font-family=\"sans-serif\">30</text><line x1=\"360\" y1=\"340\" x2=\"360\" y2=\"345\" stroke=\"black\"/><text x=\"360\" y=\"360\" text-anchor=\"middle\" font-size=\"12\" font-family=\"sans-serif\">40</text><line x1=\"55\" y1=\"340\" x2=\"60\" y2=\"340\" stroke=\"black\"/><text x=\"45\" y=\"345\" text-anchor=\"end\" font-size=\"12\" font-family=\"sans-serif\">0</text><line x1=\"55\" y1=\"265\" x2=\"60\" y2=\"265\" stroke=\"black\"/><text x=\"45\" y=\"270\" text-anchor=\"end\" font-size=\"12\" font-family=\"sans-serif\">2</text><line x1=\"55\" y1=\"190\" x2=\"60\" y2=\"190\" stroke=\"black\"/><text x=\"45\" y=\"195\" text-anchor=\"end\" font-size=\"12\" font-family=\"sans-serif\">4</text><line x1=\"55\" y1=\"115\" x2=\"60\" y2=\"115\" stroke=\"black\"/><text x=\"45\" y=\"120\" text-anchor=\"end\" font-size=\"12\" font-family=\"sans-serif\">6</text><line x1=\"55\" y1=\"40\" x2=\"60\" y2=\"40\" stroke=\"black\"/><text x=\"45\" y=\"45\" text-anchor=\"end\" font-size=\"12\" font-family=\"sans-serif\">8</text><text x=\"210\" y=\"390\" text-anchor=\"middle\" font-size=\"14\" font-family=\"sans-serif\">Days</text><text x=\"20\" y=\"190\" text-anchor=\"middle\" font-size=\"14\" font-family=\"sans-serif\" transform=\"rotate(-90 20,190)\">Suits</text><line x1=\"60\" y1=\"340\" x2=\"180\" y2=\"40\" stroke=\"#1f77b4\" stroke-width=\"2\"/><text x=\"185\" y=\"45\" font-size=\"12\" font-family=\"sans-serif\" fill=\"#1f77b4\">Sheela: ½ suit/day</text><line x1=\"60\" y1=\"340\" x2=\"150\" y2=\"40\" stroke=\"#2ca02c\" stroke-width=\"2\"/><text x=\"155\" y=\"45\" font-size=\"12\" font-family=\"sans-serif\" fill=\"#2ca02c\">Meena: ⅔ suit/day</text><line x1=\"60\" y1=\"340\" x2=\"111\" y2=\"40\" stroke=\"#d62728\" stroke-width=\"2\"/><text x=\"116\" y=\"45\" font-size=\"12\" font-family=\"sans-serif\" fill=\"#d62728\">Combined: 7⁄6 suits/day</text><text x=\"60\" y=\"380\" font-size=\"12\" font-family=\"sans-serif\">30 suits ÷ (7⁄6 suits per day) = 35 days</text></svg>