
              <h3>1. Nature of Roots</h3>
              <p>For ax2 + bx + c = 0, the discriminant D = b2 - 4ac decides the roots:</p>
              <ul>
                <li>D > 0: Real and distinct roots.</li>
                <li>D = 0: Real and equal roots.</li>
                <li>D < 0: Complex conjugate roots.</li>
              </ul>
