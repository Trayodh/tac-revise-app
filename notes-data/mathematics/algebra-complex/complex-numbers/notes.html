
              <h3>1. Polar Form and Modulus</h3>
              <p>A complex number z = x + iy has a modulus |z| = sqrtx2 + y2.</p>
              <ul>
                <li>**Argument:** 	heta = 	an-1(y/x)</li>
                <li>**De Moivre's Theorem:** (cos 	heta + isin 	heta)n = cos n	heta + isin n	heta</li>
              </ul>
