<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <!-- Cell membrane -->
  <ellipse cx="200" cy="150" rx="180" ry="130" fill="#FFCCCC" stroke="#000" stroke-width="2"/>
  <!-- Cytoplasm (background of cell) -->
  <rect x="20" y="20" width="360" height="260" fill="none"/>
  <!-- Nucleus -->
  <circle cx="120" cy="120" r="50" fill="#ADD8E6" stroke="#000" stroke-width="2"/>
  <!-- Mitochondrion -->
  <ellipse cx="260" cy="180" rx="40" ry="20" fill="#F4A460" stroke="#000" stroke-width="2"/>
  <!-- Mitochondrial inner folds -->
  <path d="M240,180 q10,-10 20,0 q10,10 20,0" fill="none" stroke="#D2691E" stroke-width="2"/>
  <!-- Labels and pointers -->
  <!-- Nucleus label -->
  <line x1="30" y1="30" x2="80" y2="80" stroke="#000" stroke-width="1"/>
  <text x="30" y="30" font-family="sans-serif" font-size="14" fill="#000">Nucleus</text>
  <!-- Mitochondria label -->
  <line x1="340" y1="200" x2="300" y2="190" stroke="#000" stroke-width="1"/>
  <text x="340" y="200" font-family="sans-serif" font-size="14" fill="#000" text-anchor="end">Mitochondria</text>
  <!-- Cell membrane label -->
  <line x1="350" y1="20" x2="340" y2="40" stroke="#000" stroke-width="1"/>
  <text x="350" y="20" font-family="sans-serif" font-size="14" fill="#000" text-anchor="end">Cell Membrane</text>
  <!-- Cytoplasm label -->
  <line x1="250" y1="80" x2="200" y2="150" stroke="#000" stroke-width="1"/>
  <text x="250" y="80" font-family="sans-serif" font-size="14" fill="#000">Cytoplasm</text>
</svg>