<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#ffffff"/>
  
  <!-- Section titles -->
  <text x="100" y="30" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#333333">Ratio</text>
  <text x="300" y="30" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#333333">Proportion</text>
  <text x="500" y="30" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#333333">Average</text>
  
  <!-- Ratio illustration -->
  <g id="ratio">
    <!-- Bar for part A -->
    <rect x="70" y="80" width="120" height="120" fill="#4A90E2"/>
    <!-- Bar for part B -->
    <rect x="200" y="80" width="80" height="120" fill="#50E3C2"/>
    <!-- Labels -->
    <text x="130" y="210" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#333333" text-anchor="middle">A = 3</text>
    <text x="240" y="210" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#333333" text-anchor="middle">B = 2</text>
    <text x="150" y="250" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#333333" text-anchor="middle">Ratio 3:2</text>
  </g>
  
  <!-- Proportion illustration -->
  <g id="proportion">
    <!-- First fraction -->
    <rect x="260" y="80" width="80" height="120" fill="#F5A623"/>
    <rect x="260" y="200" width="80" height="120" fill="#F5A623"/>
    <!-- Second fraction -->
    <rect x="360" y="80" width="40" height="120" fill="#7ED321"/>
    <rect x="360" y="200" width="40" height="120" fill="#7ED321"/>
    <!-- Equality arrows -->
    <path d="M340 140 L360 140" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M340 260 L360 260" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Labels -->
    <text x="300" y="210" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333333" text-anchor="middle">a = 4</text>
    <text x="380" y="210" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333333" text-anchor="middle">c = 2</text>
    <text x="300" y="330" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#333333" text-anchor="middle">a/b = c/d</text>
  </g>
  
  <!-- Average illustration -->
  <g id="average">
    <!-- Data points -->
    <circle cx="470" cy="150" r="8" fill="#4A90E2"/>
    <circle cx="490" cy="180" r="8" fill="#4A90E2"/>
    <circle cx="510" cy="130" r="8" fill="#4A90E2"/>
    <circle cx="530" cy="170" r="8" fill="#4A90E2"/>
    <circle cx="550" cy="140" r="8" fill="#4A90E2"/>
    <!-- Mean line -->
    <line x1="460" y1="155" x2="560" y2="155" stroke="#FF0000" stroke-width="2"/>
    <text x="560" y="150" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#FF0000" text-anchor="start">Mean</text>
    <!-- Label -->
    <text x="520" y="250" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#333333" text-anchor="middle">Average of values</text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#333333"/>
    </marker>
  </defs>
</svg>