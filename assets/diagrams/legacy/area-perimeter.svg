<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="black"/>
    </marker>
    <style>
      .label {font-family:sans-serif;font-size:14px;fill:#333;}
    </style>
  </defs>

  <!-- Rectangle -->
  <rect x="50" y="50" width="200" height="120" fill="#4A90E2" stroke="#333" stroke-width="2"/>
  <!-- Rectangle dimensions -->
  <line x1="150" y1="45" x2="250" y2="45" stroke="black" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="200" y="38" class="label" text-anchor="middle">l</text>
  <line x1="45" y1="110" x2="45" y2="170" stroke="black" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="38" y="140" class="label" text-anchor="end">w</text>
  <!-- Rectangle formulas -->
  <text x="50" y="190" class="label">Rectangle Area = l × w</text>
  <text x="50" y="210" class="label">Perimeter = 2(l + w)</text>

  <!-- Circle -->
  <circle cx="400" cy="110" r="60" fill="#50E3C2" stroke="#333" stroke-width="2"/>
  <!-- Circle dimension -->
  <line x1="400" y1="110" x2="460" y2="110" stroke="black" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="430" y="100" class="label" text-anchor="middle">r</text>
  <!-- Circle formulas -->
  <text x="340" y="190" class="label">Circle Area = πr²</text>
  <text x="340" y="210" class="label">Circumference = 2πr</text>

  <!-- Triangle -->
  <polygon points="250,250 350,250 300,350" fill="#F5A623" stroke="#333" stroke-width="2"/>
  <!-- Triangle dimensions -->
  <line x1="250" y1="260" x2="350" y2="260" stroke="black" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="300" y="250" class="label" text-anchor="middle">b</text>
  <line x1="300" y1="350" x2="300" y2="260" stroke="black" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="310" y="305" class="label">h</text>
  <!-- Triangle formulas -->
  <text x="250" y="380" class="label">Triangle Area = ½ bh</text>
  <text x="250" y="400" class="label">Perimeter = a + b + c</text>
</svg>