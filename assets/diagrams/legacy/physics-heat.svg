<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Definitions for arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L10,3.5 Z" fill="black"/>
    </marker>
  </defs>

  <!-- Heat source (hot block) -->
  <rect x="50" y="150" width="100" height="100" fill="#e74c3c"/>
  <text x="50" y="130" font-family="sans-serif" font-size="14" fill="black">Heat Source (High T)</text>

  <!-- Heat sink (cold block) -->
  <rect x="450" y="150" width="100" height="100" fill="#3498db"/>
  <text x="450" y="130" font-family="sans-serif" font-size="14" fill="black">Heat Sink (Low T)</text>

  <!-- Conduction arrow -->
  <line x1="150" y1="200" x2="450" y2="200" stroke="black" stroke-width="2"
        marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="260" y="220" font-family="sans-serif" font-size="14" fill="black">Conduction</text>

  <!-- Convection region -->
  <rect x="200" y="100" width="200" height="200" fill="#95a5a6" opacity="0.2"/>
  <text x="300" y="180" text-anchor="middle" font-family="sans-serif" font-size="14" fill="black">Convection</text>

  <!-- Convection loop arrows -->
  <path d="M250,250 C260,200 340,200 350,250" fill="none" stroke="black" stroke-width="2"
        marker-end="url(#arrow)"/>
  <path d="M350,250 C340,300 260,300 250,250" fill="none" stroke="black" stroke-width="2"
        marker-end="url(#arrow)"/>

  <!-- Radiation wavy lines from hot block -->
  <path d="M80,150 Q90,130 100,150 T120,150" fill="none" stroke="#f1c40f" stroke-width="2"/>
  <path d="M90,140 Q100,120 110,140 T130,140" fill="none" stroke="#f1c40f" stroke-width="2"/>
  <text x="80" y="110" font-family="sans-serif" font-size="14" fill="black">Radiation</text>
</svg>