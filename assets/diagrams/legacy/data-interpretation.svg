<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Title -->
  <text x="300" y="30" font-family="Arial,Helvetica,sans-serif" font-size="20" text-anchor="middle" fill="#333">Data Interpretation: Tables, Bar &amp; Pie Charts</text>
  
  <!-- Table Section -->
  <text x="105" y="60" font-family="Arial,Helvetica,sans-serif" font-size="14" text-anchor="middle" fill="#333">Table</text>
  <rect x="30" y="70" width="150" height="180" fill="none" stroke="#555" stroke-width="1"/>
  <!-- Grid lines -->
  <line x1="80" y1="70" x2="80" y2="250" stroke="#555" stroke-width="0.5"/>
  <line x1="130" y1="70" x2="130" y2="250" stroke="#555" stroke-width="0.5"/>
  <line x1="30" y1="115" x2="180" y2="115" stroke="#555" stroke-width="0.5"/>
  <line x1="30" y1="160" x2="180" y2="160" stroke="#555" stroke-width="0.5"/>
  <line x1="30" y1="205" x2="180" y2="205" stroke="#555" stroke-width="0.5"/>
  <!-- Header -->
  <text x="55" y="100" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#000">Item</text>
  <text x="105" y="100" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#000">Count</text>
  <text x="155" y="100" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#000">Percent</text>
  <!-- Row 1 -->
  <text x="55" y="145" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#000">A</text>
  <text x="105" y="145" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#000">30</text>
  <text x="155" y="145" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#000">15%</text>
  <!-- Row 2 -->
  <text x="55" y="190" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#000">B</text>
  <text x="105" y="190" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#000">70</text>
  <text x="155" y="190" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#000">35%</text>
  <!-- Row 3 -->
  <text x="55" y="235" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#000">C</text>
  <text x="105" y="235" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#000">100</text>
  <text x="155" y="235" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#000">50%</text>
  
  <!-- Bar Chart Section -->
  <text x="300" y="60" font-family="Arial,Helvetica,sans-serif" font-size="14" text-anchor="middle" fill="#333">Bar Chart</text>
  <!-- Axes -->
  <line x1="210" y1="250" x2="390" y2="250" stroke="#555" stroke-width="1"/>
  <line x1="210" y1="70" x2="210" y2="250" stroke="#555" stroke-width="1"/>
  <!-- Y-axis ticks and labels -->
  <line x1="205" y1="250" x2="210" y2="250" stroke="#555" stroke-width="1"/>
  <text x="200" y="255" font-family="Arial,Helvetica,sans-serif" font-size="10" text-anchor="end" fill="#333">0</text>
  <line x1="205" y1="200" x2="210" y2="200" stroke="#555" stroke-width="1"/>
  <text x="200" y="205" font-family="Arial,Helvetica,sans-serif" font-size="10" text-anchor="end" fill="#333">50</text>
  <line x1="205" y1="150" x2="210" y2="150" stroke="#555" stroke-width="1"/>
  <text x="200" y="155" font-family="Arial,Helvetica,sans-serif" font-size="10" text-anchor="end" fill="#333">100</text>
  <line x1="205" y1="100" x2="210" y2="100" stroke="#555" stroke-width="1"/>
  <text x="200" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" text-anchor="end" fill="#333">150</text>
  <!-- Bars -->
  <rect x="230" y="170" width="40" height="80" fill="#4CAF50"/>
  <rect x="280" y="130" width="40" height="120" fill="#2196F3"/>
  <rect x="330" y="190" width="40" height="60" fill="#FF9800"/>
  <!-- Bar labels -->
  <text x="250" y="270" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" fill="#333">Q1</text>
  <text x="300" y="270" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" fill="#333">Q2</text>
  <text x="350" y="270" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" fill="#333">Q3</text>
  
  <!-- Pie Chart Section -->
  <text x="495" y="60" font-family="Arial,Helvetica,sans-serif" font-size="14" text-anchor="middle" fill="#333">Pie Chart</text>
  <!-- Slices -->
  <path d="M495,160 L575,160 A80,80 0 0,1 430.28,207.02 Z" fill="#4CAF50"/>
  <path d="M495,160 L430.28,207.02 A80,80 0 0,1 470.28,83.91 Z" fill="#2196F3"/>
  <path d="M495,160 L470.28,83.91 A80,80 0 0,1 559.72,112.98 Z" fill="#FF9800"/>
  <path d="M495,160 L559.72,112.98 A80,80 0 0,1 575,160 Z" fill="#9C27B0"/>
  <!-- Labels for slices -->
  <text x="525.9" y="255" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" fill="#333">Category A</text>
  <text x="399.9" y="129" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" fill="#333">Category B</text>
  <text x="525.9" y="65" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" fill="#333">Category C</text>
  <text x="590.1" y="129" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" fill="#333">Category D</text>
</svg>