<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: bold 24px sans-serif; fill:#333; }
    .section-title { font: bold 18px sans-serif; fill:#333; }
    .box { fill:#4A90E2; rx:5; ry:5; }
    .box-vic { fill:#50E3C2; rx:5; ry:5; }
    .label { font: 14px sans-serif; fill:#fff; text-anchor:middle; dominant-baseline:middle; }
    .arrow { fill:none; stroke:#555; stroke-width:2; marker-end:url(#arrowhead); }
  </style>

  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="40" class="title">Governor‑Generals &amp; Viceroys</text>

  <!-- Governor‑General column -->
  <text x="150" y="80" class="section-title">Governor‑General</text>
  <rect x="80" y="100" width="140" height="60" class="box"/>
  <text x="150" y="130" class="label">British North America</text>
  <rect x="80" y="180" width="140" height="60" class="box"/>
  <text x="150" y="210" class="label">Australia</text>
  <rect x="80" y="260" width="140" height="60" class="box"/>
  <text x="150" y="290" class="label">Canada</text>

  <!-- Viceroy column -->
  <text x="450" y="80" class="section-title">Viceroy</text>
  <rect x="380" y="100" width="140" height="60" class="box-vic"/>
  <text x="450" y="130" class="label">India (British Raj)</text>
  <rect x="380" y="180" width="140" height="60" class="box-vic"/>
  <text x="450" y="210" class="label">Ireland (1801‑1922)</text>
  <rect x="380" y="260" width="140" height="60" class="box-vic"/>
  <text x="450" y="290" class="label">Ceylon (Sri Lanka)</text>

  <!-- Connecting arrow showing historical relationship -->
  <path d="M220 130 C260 130 260 130 300 130" class="arrow"/>
  <path d="M300 130 C340 130 340 130 380 130" class="arrow"/>
  <text x="300" y="115" font-size="12px" fill="#555" text-anchor="middle">Evolution / Overlap</text>
</svg>