<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#333"/>
    </marker>
    <style>
      .label {font-family:sans-serif;font-size:14px;fill:#333;}
      .title {font-family:sans-serif;font-size:24px;fill:#222;font-weight:bold;}
    </style>
  </defs>

  <!-- Title -->
  <text x="300" y="40" text-anchor="middle" class="title">3D Solids: Surface Area &amp; Volume</text>

  <!-- Cube -->
  <polygon points="80,200 180,200 180,300 80,300" fill="#a0c4ff" stroke="#333" stroke-width="1"/>
  <polygon points="80,200 130,150 230,150 180,200" fill="#b0d4ff" stroke="#333" stroke-width="1"/>
  <polygon points="180,200 230,150 230,250 180,300" fill="#90b4ff" stroke="#333" stroke-width="1"/>
  <!-- Cube Labels -->
  <line x1="230" y1="150" x2="300" y2="120" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="310" y="115" class="label">Cube: SA = 6a²</text>
  <line x1="180" y1="300" x2="260" y2="340" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="270" y="345" class="label">Cube: V = a³</text>

  <!-- Cylinder -->
  <ellipse cx="300" cy="250" rx="60" ry="20" fill="#b5e48c" stroke="#333" stroke-width="1"/>
  <rect x="240" y="250" width="120" height="100" fill="#a5d47c" stroke="#333" stroke-width="1"/>
  <ellipse cx="300" cy="350" rx="60" ry="20" fill="#95c46c" stroke="#333" stroke-width="1"/>
  <!-- Cylinder Labels -->
  <line x1="360" y1="300" x2="420" y2="260" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="430" y="255" class="label">Cylinder: SA = 2πr(r+h)</text>
  <line x1="240" y1="300" x2="180" y2="340" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="150" y="345" class="label">Cylinder: V = πr²h</text>

  <!-- Sphere -->
  <circle cx="500" cy="250" r="70" fill="#ffb5a7" stroke="#333" stroke-width="1"/>
  <!-- Sphere Labels -->
  <line x1="570" y1="250" x2="580" y2="250" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="590" y="255" class="label">Sphere: SA = 4πr²</text>
  <line x1="500" y1="320" x2="500" y2="360" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="505" y="365" class="label">Sphere: V = 4/3πr³</text>
</svg>