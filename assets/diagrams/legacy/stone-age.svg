<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#F5F5F5"/>
  
  <!-- Title -->
  <text x="300" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#333">Stone Age Timeline</text>
  
  <!-- Timeline line -->
  <line x1="30" y1="200" x2="570" y2="200" stroke="#555" stroke-width="2"/>
  
  <!-- Paleolithic segment -->
  <rect x="30" y="220" width="180" height="80" fill="#8DA7BE"/>
  <text x="120" y="260" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fff">Paleolithic</text>
  <text x="120" y="280" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fff">(2.5 M–10 k yr BP)</text>
  <!-- Hand axe icon -->
  <path d="M120,150 L115,165 L125,165 Z M120,150 L120,140" fill="#555"/>
  <line x1="120" y1="165" x2="120" y2="220" stroke="#555" stroke-width="1"/>
  
  <!-- Mesolithic segment -->
  <rect x="220" y="220" width="180" height="80" fill="#A3C9A8"/>
  <text x="310" y="260" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fff">Mesolithic</text>
  <text x="310" y="280" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fff">(10 k–5 k yr BP)</text>
  <!-- Spear icon -->
  <line x1="310" y1="150" x2="310" y2="140" stroke="#555" stroke-width="2"/>
  <polygon points="310,140 305,150 315,150" fill="#555"/>
  <line x1="310" y1="150" x2="310" y2="220" stroke="#555" stroke-width="1"/>
  
  <!-- Neolithic segment -->
  <rect x="410" y="220" width="180" height="80" fill="#F2D0A4"/>
  <text x="500" y="260" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Neolithic</text>
  <text x="500" y="280" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">(5 k–2 k yr BP)</text>
  <!-- Pot icon -->
  <rect x="495" y="130" width="10" height="20" rx="2" fill="#555"/>
  <line x1="500" y1="150" x2="500" y2="220" stroke="#555" stroke-width="1"/>
  
  <!-- Legend connector lines (optional) -->
  <line x1="120" y1="200" x2="120" y2="150" stroke="#555" stroke-dasharray="2,2" stroke-width="1"/>
  <line x1="310" y1="200" x2="310" y2="150" stroke="#555" stroke-dasharray="2,2" stroke-width="1"/>
  <line x1="500" y1="200" x2="500" y2="150" stroke="#555" stroke-dasharray="2,2" stroke-width="1"/>
</svg>