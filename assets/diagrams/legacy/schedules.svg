<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <style>
    .title { font: bold 24px sans-serif; fill:#004d40; text-anchor:middle; }
    .box { fill:#e0f7fa; stroke:#006064; stroke-width:2; }
    .label { font: 14px sans-serif; fill:#004d40; text-anchor:middle; dominant-baseline:middle; }
  </style>
  <text x="300" y="30" class="title">Schedules of the Constitution</text>
  <!-- Row 1 -->
  <rect x="45" y="70" width="120" height="80" class="box"/>
  <text x="105" y="110" class="label">Schedule I</text>
  <rect x="175" y="70" width="120" height="80" class="box"/>
  <text x="235" y="110" class="label">Schedule II</text>
  <rect x="305" y="70" width="120" height="80" class="box"/>
  <text x="365" y="110" class="label">Schedule III</text>
  <rect x="435" y="70" width="120" height="80" class="box"/>
  <text x="495" y="110" class="label">Schedule IV</text>
  <!-- Row 2 -->
  <rect x="45" y="160" width="120" height="80" class="box"/>
  <text x="105" y="200" class="label">Schedule V</text>
  <rect x="175" y="160" width="120" height="80" class="box"/>
  <text x="235" y="200" class="label">Schedule VI</text>
  <rect x="305" y="160" width="120" height="80" class="box"/>
  <text x="365" y="200" class="label">Schedule VII</text>
  <rect x="435" y="160" width="120" height="80" class="box"/>
  <text x="495" y="200" class="label">Schedule VIII</text>
  <!-- Row 3 -->
  <rect x="45" y="250" width="120" height="80" class="box"/>
  <text x="105" y="290" class="label">Schedule IX</text>
  <rect x="175" y="250" width="120" height="80" class="box"/>
  <text x="235" y="290" class="label">Schedule X</text>
  <rect x="305" y="250" width="120" height="80" class="box"/>
  <text x="365" y="290" class="label">Schedule XI</text>
  <rect x="435" y="250" width="120" height="80" class="box"/>
  <text x="495" y="290" class="label">Schedule XII</text>
</svg>