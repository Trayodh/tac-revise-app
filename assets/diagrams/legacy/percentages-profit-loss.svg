<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <style>
    .title { font: bold 24px sans-serif; fill:#333; }
    .label { font: 14px sans-serif; fill:#333; }
    .percent { font: 12px sans-serif; fill:#fff; }
    .axis { stroke:#999; stroke-width:1; }
  </style>
  <!-- Title -->
  <text x="300" y="40" text-anchor="middle" class="title">Percentages, Profit &amp; Loss</text>
  <!-- Axes -->
  <line x1="80" y1="350" x2="520" y2="350" class="axis"/>
  <line x1="80" y1="350" x2="80" y2="50" class="axis"/>
  <!-- Cost Price Bar -->
  <rect x="130" y="200" width="100" height="150" fill="#4A90E2"/>
  <text x="180" y="370" text-anchor="middle" class="label">Cost Price (CP)</text>
  <text x="180" y="190" text-anchor="middle" class="percent" fill="#fff">100%</text>
  <!-- Selling Price Bar (Profit) -->
  <rect x="300" y="100" width="100" height="250" fill="#7ED321"/>
  <text x="350" y="370" text-anchor="middle" class="label">Selling Price (SP)</text>
  <text x="350" y="90" text-anchor="middle" class="percent" fill="#fff">133%</text>
  <!-- Profit Area -->
  <rect x="300" y="200" width="100" height="150" fill="#F5A623" opacity="0.8"/>
  <text x="350" y="275" text-anchor="middle" class="label" fill="#fff">Profit</text>
  <!-- Arrow indicating profit -->
  <path d="M250 275 L295 275" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#333"/>
    </marker>
  </defs>
  <!-- Percentage Scale -->
  <line x1="130" y1="350" x2="430" y2="350" stroke="#999" stroke-width="1"/>
  <text x="130" y="370" class="label" text-anchor="middle">0%</text>
  <text x="230" y="370" class="label" text-anchor="middle">50%</text>
  <text x="330" y="370" class="label" text-anchor="middle">100%</text>
  <text x="430" y="370" class="label" text-anchor="middle">150%</text>
  <!-- Explanation Box -->
  <rect x="460" y="80" width="120" height="200" fill="#EEE" stroke="#CCC"/>
  <text x="520" y="110" text-anchor="middle" class="label" fill="#333">Key</text>
  <rect x="470" y="130" width="20" height="20" fill="#4A90E2"/>
  <text x="500" y="145" class="label">Cost Price</text>
  <rect x="470" y="160" width="20" height="20" fill="#7ED321"/>
  <text x="500" y="175" class="label">Selling Price</text>
  <rect x="470" y="190" width="20" height="20" fill="#F5A623"/>
  <text x="500" y="205" class="label">Profit</text>
</svg>