<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title {font-family:sans-serif;font-size:24px;fill:#222;text-anchor:middle;}
    .label {font-family:sans-serif;font-size:14px;fill:#222;text-anchor:middle;}
    .inst-label {font-family:sans-serif;font-size:12px;fill:#fff;text-anchor:middle;}
    .line {stroke:#555;stroke-width:2;}
  </style>
  <!-- Title -->
  <text x="300" y="40" class="title">International Institutions</text>
  <!-- Globe -->
  <circle cx="300" cy="180" r="80" fill="#4A90E2"/>
  <!-- Simplified continents -->
  <path d="M260,150 C270,130 310,130 320,150 C340,170 340,210 320,230 C310,250 270,250 260,230 C240,210 240,170 260,150 Z" fill="#fff" opacity="0.6"/>
  <!-- Institutions -->
  <!-- UN -->
  <rect x="80" y="280" width="80" height="50" fill="#6C9"/>
  <text x="120" y="310" class="inst-label">UN</text>
  <line x1="120" y1="280" x2="300" y2="200" class="line"/>
  <!-- WTO -->
  <rect x="200" y="280" width="80" height="50" fill="#9C6"/>
  <text x="240" y="310" class="inst-label">WTO</text>
  <line x1="240" y1="280" x2="300" y2="200" class="line"/>
  <!-- IMF -->
  <rect x="320" y="280" width="80" height="50" fill="#C96"/>
  <text x="360" y="310" class="inst-label">IMF</text>
  <line x1="360" y1="280" x2="300" y2="200" class="line"/>
  <!-- World Bank -->
  <rect x="440" y="280" width="80" height="50" fill="#96C"/>
  <text x="480" y="310" class="inst-label">World Bank</text>
  <line x1="480" y1="280" x2="300" y2="200" class="line"/>
  <!-- Labels for connections -->
  <text x="210" y="230" class="label">Global Governance</text>
  <text x="300" y="150" class="label">International Cooperation</text>
</svg>