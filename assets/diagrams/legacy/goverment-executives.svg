<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Definitions for arrowheads -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
            refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#555"/>
    </marker>
  </defs>

  <!-- Prime Minister Box -->
  <rect x="200" y="50" width="200" height="80" fill="#4A90E2" rx="8" ry="8"/>
  <text x="300" y="95" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">
    Prime Minister (PM)
  </text>

  <!-- Governor Box -->
  <rect x="200" y="180" width="200" height="80" fill="#7ED321" rx="8" ry="8"/>
  <text x="300" y="225" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">
    Governor
  </text>

  <!-- Chief Minister Box -->
  <rect x="200" y="300" width="200" height="80" fill="#F5A623" rx="8" ry="8"/>
  <text x="300" y="345" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">
    Chief Minister (CM)
  </text>

  <!-- Arrow from PM to Governor -->
  <path d="M300,130 V180" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Arrow from Governor to CM -->
  <path d="M300,260 V300" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Optional Title -->
  <text x="300" y="20" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#333333" text-anchor="middle">
    Executives: PM, Governor &amp; CM
  </text>
</svg>