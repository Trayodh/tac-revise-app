<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#f9f9f9"/>
  
  <!-- Title -->
  <text x="300" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#333">Post‑Independence Consolidation</text>
  
  <!-- Central Nation block -->
  <rect x="250" y="150" width="100" height="80" fill="#4a90e2" rx="5" ry="5"/>
  <text x="300" y="190" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">Nation</text>
  
  <!-- Political Integration pillar -->
  <rect x="80" y="120" width="120" height="60" fill="#7ed321" rx="5" ry="5"/>
  <text x="140" y="150" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fff">Political Integration</text>
  <!-- Arrow to Nation -->
  <polygon points="200,150 230,150 230,140 260,160 230,180 230,170 200,170" fill="#7ed321"/>
  
  <!-- Economic Development pillar -->
  <rect x="400" y="120" width="120" height="60" fill="#f5a623" rx="5" ry="5"/>
  <text x="460" y="150" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fff">Economic Development</text>
  <!-- Arrow to Nation -->
  <polygon points="400,150 370,150 370,140 340,160 370,180 370,170 400,170" fill="#f5a623"/>
  
  <!-- Social Cohesion pillar -->
  <rect x="250" y="260" width="100" height="60" fill="#d0021b" rx="5" ry="5"/>
  <text x="300" y="295" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fff">Social Cohesion</text>
  <!-- Arrow to Nation -->
  <polygon points="300,230 300,260 310,260 300,290 290,260 300,260" fill="#d0021b"/>
  
  <!-- Timeline -->
  <line x1="100" y1="350" x2="500" y2="350" stroke="#999" stroke-width="2"/>
  <text x="100" y="370" font-family="sans-serif" font-size="12" fill="#555">1947</text>
  <text x="200" y="370" font-family="sans-serif" font-size="12" fill="#555">1950</text>
  <text x="300" y="370" font-family="sans-serif" font-size="12" fill="#555">1955</text>
  <text x="400" y="370" font-family="sans-serif" font-size="12" fill="#555">1960</text>
  <text x="500" y="370" font-family="sans-serif" font-size="12" fill="#555">1965</text>
  <text x="300" y="340" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Key Milestones</text>
</svg>