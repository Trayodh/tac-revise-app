<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f5f5f5"/>
  
  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#333"/>
    </marker>
    <style>
      .label {font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#333;}
      .circle-label {font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#fff;font-weight:bold;}
    </style>
  </defs>
  
  <!-- Circles -->
  <circle cx="150" cy="120" r="60" fill="#4a90e2"/>
  <circle cx="450" cy="120" r="60" fill="#f5a623"/>
  <circle cx="300" cy="280" r="60" fill="#7ed321"/>
  
  <!-- Circle Text -->
  <text x="150" y="125" text-anchor="middle" class="circle-label">Distance (d)</text>
  <text x="450" y="125" text-anchor="middle" class="circle-label">Speed (s)</text>
  <text x="300" y="285" text-anchor="middle" class="circle-label">Time (t)</text>
  
  <!-- Arrows -->
  <!-- Distance → Speed -->
  <path d="M210,120 L390,120" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="300" y="105" text-anchor="middle" class="label">÷ t</text>
  
  <!-- Speed → Time -->
  <path d="M470,150 C470,210 340,260 320,260" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="420" y="210" text-anchor="middle" class="label">÷ d</text>
  
  <!-- Time → Distance -->
  <path d="M260,340 C200,300 140,180 140,180" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="200" y="300" text-anchor="middle" class="label">× s</text>
  
  <!-- Formula annotations -->
  <text x="300" y="70" text-anchor="middle" class="label">s = d ÷ t</text>
  <text x="500" y="250" text-anchor="middle" class="label">t = d ÷ s</text>
  <text x="100" y="250" text-anchor="middle" class="label">d = s × t</text>
</svg>