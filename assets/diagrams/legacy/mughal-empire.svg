<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#f5f5dc"/>
  <polygon points="150,100 450,100 500,200 400,300 200,300 150,200" fill="#4a90e2" opacity="0.8"/>
  <text x="300" y="30" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#333">Mughal Empire (1526–1857)</text>
  
  <!-- Delhi -->
  <circle cx="300" cy="180" r="6" fill="#e67e22"/>
  <line x1="300" y1="180" x2="310" y2="150" stroke="#333" stroke-width="1"/>
  <text x="310" y="145" font-family="sans-serif" font-size="12" fill="#333">Delhi (capital)</text>
  
  <!-- Agra -->
  <circle cx="340" cy="210" r="6" fill="#e67e22"/>
  <line x1="340" y1="210" x2="360" y2="240" stroke="#333" stroke-width="1"/>
  <text x="360" y="235" font-family="sans-serif" font-size="12" fill="#333">Agra (Mughal architecture)</text>
  
  <!-- Lahore -->
  <circle cx="200" cy="150" r="6" fill="#e67e22"/>
  <line x1="200" y1="150" x2="180" y2="130" stroke="#333" stroke-width="1"/>
  <text x="180" y="125" font-family="sans-serif" font-size="12" fill="#333">Lahore (early capital)</text>
  
  <!-- Jaipur -->
  <circle cx="260" cy="230" r="6" fill="#e67e22"/>
  <line x1="260" y1="230" x2="260" y2="260" stroke="#333" stroke-width="1"/>
  <text x="260" y="275" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#333">Jaipur (later annexed)</text>
  
  <!-- Varanasi -->
  <circle cx="380" cy="180" r="6" fill="#e67e22"/>
  <line x1="380" y1="180" x2="400" y2="150" stroke="#333" stroke-width="1"/>
  <text x="400" y="145" font-family="sans-serif" font-size="12" fill="#333">Varanasi (cultural hub)</text>
  
  <!-- Peak under Akbar label -->
  <line x1="320" y1="260" x2="340" y2="200" stroke="#333" stroke-width="1"/>
  <text x="320" y="275" font-family="sans-serif" font-size="12" fill="#333">Peak under Akbar (1556–1605)</text>
  
  <!-- Timeline -->
  <line x1="50" y1="350" x2="550" y2="350" stroke="#333" stroke-width="2"/>
  <circle cx="100" cy="350" r="4" fill="#333"/>
  <circle cx="200" cy="350" r="4" fill="#333"/>
  <circle cx="300" cy="350" r="4" fill="#333"/>
  <circle cx="400" cy="350" r="4" fill="#333"/>
  <circle cx="500" cy="350" r="4" fill="#333"/>
  <text x="100" y="340" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#333">1526</text>
  <text x="200" y="340" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#333">1556</text>
  <text x="300" y="340" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#333">1605</text>
  <text x="400" y="340" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#333">1658</text>
  <text x="500" y="340" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#333">1857</text>
</svg>