<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 Z" fill="#008080"/>
    </marker>
  </defs>
  <!-- Battery -->
  <rect x="50" y="180" width="20" height="40" fill="#d32f2f"/>
  <rect x="80" y="190" width="10" height="20" fill="#212121"/>
  <text x="45" y="160" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#212121">Battery</text>
  <!-- Wire from battery to switch -->
  <line x1="70" y1="200" x2="130" y2="200" stroke="#212121" stroke-width="2"/>
  <!-- Switch -->
  <line x1="130" y1="200" x2="150" y2="180" stroke="#212121" stroke-width="2"/>
  <line x1="150" y1="180" x2="170" y2="200" stroke="#212121" stroke-width="2"/>
  <line x1="170" y1="200" x2="190" y2="200" stroke="#212121" stroke-width="2"/>
  <text x="140" y="160" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#212121">Switch</text>
  <!-- Resistor -->
  <path d="M190,200 L200,190 L210,210 L220,190 L230,210 L240,190 L250,200" fill="none" stroke="#ff9800" stroke-width="2"/>
  <text x="210" y="160" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#212121">Resistor</text>
  <!-- Wire to coil -->
  <line x1="250" y1="200" x2="340" y2="200" stroke="#212121" stroke-width="2"/>
  <!-- Coil (Electromagnet) -->
  <g id="coil">
    <circle cx="380" cy="200" r="30" fill="none" stroke="#1976d2" stroke-width="2"/>
    <circle cx="380" cy="200" r="20" fill="none" stroke="#1976d2" stroke-width="2"/>
    <circle cx="380" cy="200" r="10" fill="none" stroke="#1976d2" stroke-width="2"/>
  </g>
  <text x="340" y="160" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#212121">Coil (Electromagnet)</text>
  <!-- Wire back to battery -->
  <line x1="410" y1="200" x2="410" y2="120" stroke="#212121" stroke-width="2"/>
  <line x1="410" y1="120" x2="70" y2="120" stroke="#212121" stroke-width="2"/>
  <line x1="70" y1="120" x2="70" y2="180" stroke="#212121" stroke-width="2"/>
  <!-- Current direction arrow -->
  <path d="M300,190 L300,150" stroke="#008080" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="310" y="170" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#008080">Current</text>
  <!-- Magnetic field lines around coil -->
  <path d="M350,200 C340,150 420,150 410,200" fill="none" stroke="#008080" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M350,200 C340,250 420,250 410,200" fill="none" stroke="#008080" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="210" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#212121">Magnetic Field</text>
</svg>