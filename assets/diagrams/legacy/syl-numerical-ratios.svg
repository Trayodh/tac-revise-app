<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#f9f9f9"/>
  
  <!-- Ratio illustration -->
  <g id="ratio">
    <rect x="70" y="150" width="80" height="80" fill="#4A90E2"/>
    <rect x="150" y="150" width="120" height="80" fill="#50E3C2"/>
    <text x="70" y="260" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#333">2</text>
    <text x="150" y="260" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#333">3</text>
    <text x="70" y="140" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#000">Ratio 2 : 3</text>
  </g>
  
  <!-- Proportion illustration -->
  <g id="proportion" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#333">
    <!-- First fraction a/b -->
    <rect x="260" y="150" width="60" height="30" fill="#F5A623"/>
    <text x="290" y="170" text-anchor="middle" fill="#fff">a</text>
    <rect x="260" y="190" width="100" height="30" fill="#F5A623"/>
    <text x="310" y="210" text-anchor="middle" fill="#fff">b</text>
    <!-- Equality sign -->
    <text x="380" y="190" font-size="24" text-anchor="middle" fill="#000">=</text>
    <!-- Second fraction c/d -->
    <rect x="420" y="150" width="60" height="30" fill="#D0021B"/>
    <text x="450" y="170" text-anchor="middle" fill="#fff">c</text>
    <rect x="420" y="190" width="100" height="30" fill="#D0021B"/>
    <text x="470" y="210" text-anchor="middle" fill="#fff">d</text>
    <text x="260" y="140" font-size="18" fill="#000">Proportion a/b = c/d</text>
  </g>
  
  <!-- Percentage (pie) illustration -->
  <g id="percentage">
    <circle cx="500" cy="200" r="80" fill="#e0e0e0"/>
    <path d="M500,200 L500,120 A80,80 0 1 1 420,200 Z" fill="#4A90E2"/>
    <text x="500" y="300" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#000" text-anchor="middle">75 % = 3⁄4</text>
    <text x="500" y="140" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#fff" text-anchor="middle">75 %</text>
  </g>
</svg>