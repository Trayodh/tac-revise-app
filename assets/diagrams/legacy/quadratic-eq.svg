<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="white"/>
  
  <!-- Definitions for arrowheads -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="black"/>
    </marker>
  </defs>
  
  <!-- Axes -->
  <line x1="0" y1="200" x2="600" y2="200" stroke="black" stroke-width="2"/>
  <line x1="300" y1="0" x2="300" y2="400" stroke="black" stroke-width="2"/>
  
  <!-- Parabola path -->
  <path d="
    M120,-10
    L150,72.5
    L180,140
    L210,192.5
    L240,230
    L270,252.5
    L300,260
    L330,252.5
    L360,230
    L390,192.5
    L420,140
    L450,72.5
    L480,-10
  " fill="none" stroke="#1f77b4" stroke-width="3"/>
  
  <!-- Vertex -->
  <circle cx="300" cy="260" r="5" fill="#d62728"/>
  
  <!-- Roots -->
  <circle cx="215" cy="200" r="5" fill="#2ca02c"/>
  <circle cx="385" cy="200" r="5" fill="#2ca02c"/>
  
  <!-- Labels -->
  <text x="130" y="50" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="black">y = 0.25x² − 2</text>
  
  <text x="310" y="275" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#d62728">Vertex (0, −2)</text>
  <line x1="310" y1="270" x2="300" y2="260" stroke="#d62728" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <text x="190" y="190" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#2ca02c">Root (−√8, 0)</text>
  <line x1="200" y1="185" x2="215" y2="200" stroke="#2ca02c" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <text x="410" y="190" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#2ca02c">Root (√8, 0)</text>
  <line x1="400" y1="185" x2="385" y2="200" stroke="#2ca02c" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <text x="310" y="120" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="black">Axis of symmetry (x = 0)</text>
  <line x1="310" y1="115" x2="300" y2="200" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>