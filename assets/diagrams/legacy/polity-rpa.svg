<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for arrowhead -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#ff7f0e"/>
    </marker>
  </defs>

  <!-- Representation of People Act (document) -->
  <g id="document">
    <rect x="80" y="80" width="150" height="200" fill="#a0c4ff" stroke="#5a9bd4" stroke-width="2"/>
    <!-- folded corner -->
    <path d="M210,80 L210,110 L240,110 L240,80 Z" fill="#a0c4ff" stroke="#5a9bd4" stroke-width="2"/>
    <line x1="210" y1="80" x2="240" y2="110" stroke="#5a9bd4" stroke-width="2"/>
  </g>

  <!-- Election Commission (building) -->
  <g id="building">
    <rect x="370" y="80" width="150" height="200" fill="#c0c0c0" stroke="#7f7f7f" stroke-width="2"/>
    <!-- columns -->
    <line x1="395" y1="80" x2="395" y2="280" stroke="#7f7f7f" stroke-width="2"/>
    <line x1="425" y1="80" x2="425" y2="280" stroke="#7f7f7f" stroke-width="2"/>
    <line x1="455" y1="80" x2="455" y2="280" stroke="#7f7f7f" stroke-width="2"/>
    <line x1="485" y1="80" x2="485" y2="280" stroke="#7f7f7f" stroke-width="2"/>
  </g>

  <!-- Arrow indicating regulation -->
  <line x1="230" y1="180" x2="370" y2="180" stroke="#ff7f0e" stroke-width="3" marker-end="url(#arrowhead)"/>

  <!-- Labels -->
  <text x="155" y="55" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#333" text-anchor="middle">Representation of People Act</text>
  <text x="445" y="55" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#333" text-anchor="middle">Election Commission</text>
  <text x="300" y="170" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ff7f0e" text-anchor="middle">Regulates</text>
</svg>