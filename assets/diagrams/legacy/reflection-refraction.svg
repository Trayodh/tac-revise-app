<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for arrowheads -->
  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#1e90ff"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#32cd32"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#ff4500"/>
    </marker>
    <marker id="arrowBlack" markerWidth="8" markerHeight="8" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#000"/>
    </marker>
  </defs>

  <!-- Reflection & Refraction Section -->
  <g id="refraction">
    <!-- Interface line -->
    <line x1="250" y1="50" x2="250" y2="350" stroke="#555" stroke-width="2"/>
    <!-- Normal (dashed) -->
    <line x1="250" y1="150" x2="250" y2="250" stroke="#888" stroke-width="1" stroke-dasharray="4 2"/>
    <!-- Incident ray -->
    <line x1="100" y1="150" x2="250" y2="150" stroke="#1e90ff" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <!-- Reflected ray -->
    <line x1="250" y1="150" x2="400" y2="100" stroke="#32cd32" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <!-- Refracted ray -->
    <line x1="250" y1="150" x2="400" y2="250" stroke="#ff4500" stroke-width="2" marker-end="url(#arrowRed)"/>
    <!-- Labels -->
    <text x="120" y="140" font-family="sans-serif" font-size="14" fill="#1e90ff">Incident ray</text>
    <text x="410" y="90" font-family="sans-serif" font-size="14" fill="#32cd32">Reflected ray</text>
    <text x="410" y="260" font-family="sans-serif" font-size="14" fill="#ff4500">Refracted ray</text>
    <text x="260" y="130" font-family="sans-serif" font-size="12" fill="#000">Normal</text>
    <text x="260" y="70" font-family="sans-serif" font-size="12" fill="#000">Medium 1 (n₁)</text>
    <text x="260" y="320" font-family="sans-serif" font-size="12" fill="#000">Medium 2 (n₂)</text>
  </g>

  <!-- Lens Section -->
  <g id="lens">
    <!-- Principal axis -->
    <line x1="400" y1="200" x2="600" y2="200" stroke="#555" stroke-width="1"/>
    <!-- Lens shape -->
    <path d="M460,100 Q500,0 540,100 L540,300 Q500,400 460,300 Z" fill="#add8e6" stroke="#000" stroke-width="2"/>
    <!-- Focal points -->
    <circle cx="470" cy="200" r="3" fill="#000"/>
    <circle cx="530" cy="200" r="3" fill="#000"/>
    <text x="465" y="190" font-family="sans-serif" font-size="12" fill="#000">F</text>
    <text x="525" y="190" font-family="sans-serif" font-size="12" fill="#000">F</text>
    <!-- Object arrow -->
    <line x1="380" y1="150" x2="380" y2="250" stroke="#000" stroke-width="2" marker-end="url(#arrowBlack)"/>
    <line x1="380" y1="150" x2="380" y2="250" stroke="#000" stroke-width="2" marker-start="url(#arrowBlack)"/>
    <text x="350" y="140" font-family="sans-serif" font-size="14" fill="#000">Object</text>
    <!-- Image arrow (inverted) -->
    <line x1="560" y1="250" x2="560" y2="150" stroke="#000" stroke-width="2" marker-end="url(#arrowBlack)"/>
    <line x1="560" y1="250" x2="560" y2="150" stroke="#000" stroke-width="2" marker-start="url(#arrowBlack)"/>
    <text x="570" y="140" font-family="sans-serif" font-size="14" fill="#000">Image</text>
    <!-- Ray 1: parallel then through focal point -->
    <line x1="380" y1="200" x2="460" y2="200" stroke="#1e90ff" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <line x1="540" y1="200" x2="620" y2="260" stroke="#1e90ff" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <!-- Ray 2: through focal point then parallel -->
    <line x1="380" y1="250" x2="460" y2="250" stroke="#ff4500" stroke-width="2" marker-end="url(#arrowRed)"/>
    <line x1="540" y1="250" x2="620" y2="250" stroke="#ff4500" stroke-width="2" marker-end="url(#arrowRed)"/>
    <!-- Labels for rays -->
    <text x="420" y="190" font-family="sans-serif" font-size="12" fill="#1e90ff">Ray 1</text>
    <text x="420" y="260" font-family="sans-serif" font-size="12" fill="#ff4500">Ray 2</text>
    <!-- Lens label -->
    <text x="470" y="80" font-family="sans-serif" font-size="14" fill="#000">Convex Lens</text>
    <!-- Principal axis label -->
    <text x="410" y="190" font-family="sans-serif" font-size="12" fill="#555">Principal axis</text>
  </g>
</svg>