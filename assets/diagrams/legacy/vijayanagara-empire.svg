<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#f5f5f5"/>
  
  <!-- Empire territory -->
  <rect x="150" y="80" width="300" height="200" fill="#c19a6b" stroke="#8b4513" stroke-width="2"/>
  
  <!-- Virupaksha Temple (simplified) -->
  <rect x="260" y="200" width="40" height="40" fill="#d4af37"/>
  <polygon points="260,200 300,200 280,180" fill="#b8860b"/>
  
  <!-- Stone Chariot (simplified) -->
  <rect x="340" y="250" width="60" height="30" fill="#a9a9a9"/>
  <circle cx="350" cy="280" r="5" fill="#555555"/>
  <circle cx="390" cy="280" r="5" fill="#555555"/>
  
  <!-- Timeline -->
  <line x1="100" y1="350" x2="500" y2="350" stroke="#333" stroke-width="2"/>
  <line x1="100" y1="345" x2="100" y2="355" stroke="#333" stroke-width="2"/>
  <line x1="312" y1="345" x2="312" y2="355" stroke="#333" stroke-width="2"/>
  <line x1="500" y1="345" x2="500" y2="355" stroke="#333" stroke-width="2"/>
  <text x="95" y="370" font-family="sans-serif" font-size="12" fill="#333">1336</text>
  <text x="300" y="370" font-family="sans-serif" font-size="12" fill="#333">1500</text>
  <text x="495" y="370" font-family="sans-serif" font-size="12" fill="#333">1646</text>
  
  <!-- Labels and connectors -->
  <!-- Empire label -->
  <text x="300" y="60" font-family="sans-serif" font-size="16" fill="#222" text-anchor="middle">Vijayanagara Empire (1336‑1646)</text>
  <line x1="300" y1="70" x2="300" y2="80" stroke="#222" stroke-width="1"/>
  
  <!-- Capital label -->
  <text x="280" y="170" font-family="sans-serif" font-size="14" fill="#222">Capital: Hampi</text>
  <line x1="280" y1="180" x2="280" y2="200" stroke="#222" stroke-width="1"/>
  
  <!-- Temple label -->
  <text x="280" y="240" font-family="sans-serif" font-size="12" fill="#222">Virupaksha Temple</text>
  <line x1="280" y1="240" x2="280" y2="240" stroke="none"/>
  
  <!-- Stone Chariot label -->
  <text x="370" y="300" font-family="sans-serif" font-size="12" fill="#222">Stone Chariot</text>
  <line x1="370" y1="280" x2="370" y2="285" stroke="#222" stroke-width="1"/>
  
  <!-- Peak label -->
  <text x="460" y="120" font-family="sans-serif" font-size="12" fill="#222" text-anchor="end">Peak under Krishnadevaraya (c. 1509‑1529)</text>
  <line x1="460" y1="130" x2="450" y2="150" stroke="#222" stroke-width="1"/>
  
  <!-- Decline label -->
  <text x="180" y="300" font-family="sans-serif" font-size="12" fill="#222">Battle of Talikota (1565) – Decline</text>
  <line x1="180" y1="280" x2="190" y2="260" stroke="#222" stroke-width="1"/>
</svg>