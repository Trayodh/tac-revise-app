<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Definitions for arrowheads -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
            refX="0" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="black"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="50" y1="200" x2="550" y2="200" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="300" y1="350" x2="300" y2="50" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Axis labels -->
  <text x="560" y="205" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="black">Re</text>
  <text x="310" y="45" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="black">Im</text>

  <!-- Complex number vector -->
  <line x1="300" y1="200" x2="450" y2="120" stroke="#1E90FF" stroke-width="3"/>

  <!-- Point representing a+bi -->
  <circle cx="450" cy="120" r="5" fill="#FF4500"/>

  <!-- Modulus circle -->
  <circle cx="300" cy="200" r="170" fill="none" stroke="#32CD32" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Angle arc -->
  <path d="M300,200 L470,200 A170,170 0 0,1 450,120 Z"
        fill="rgba(255,165,0,0.3)" stroke="none"/>
  <path d="M300,200 L470,200 A170,170 0 0,1 450,120"
        fill="none" stroke="#FFA500" stroke-width="2"/>

  <!-- Labels for components -->
  <text x="460" y="115" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#FF4500">z = a + bi</text>
  <text x="460" y="135" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#FF4500">a = 150</text>
  <text x="440" y="190" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#FF4500">b = 80</text>
  <text x="380" y="260" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#32CD32">|z| = √(a²+b²)</text>
  <text x="340" y="210" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#FFA500">θ</text>
</svg>