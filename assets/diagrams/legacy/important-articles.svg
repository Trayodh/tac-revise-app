<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="300" y="50" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#333">High‑Yield Special Articles Cheat Sheet</text>
  
  <!-- Arrow lines from title to boxes -->
  <line x1="300" y1="60" x2="180" y2="110" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="60" x2="420" y2="110" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="60" x2="180" y2="270" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="60" x2="420" y2="270" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888"/>
    </marker>
  </defs>
  
  <!-- Box 1: Article Types -->
  <rect x="50" y="100" width="260" height="140" fill="#f0f8ff" stroke="#bbb" stroke-width="1"/>
  <circle cx="70" cy="120" r="12" fill="#4a90e2"/>
  <text x="70" y="124" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#fff">1</text>
  <text x="100" y="125" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#333">Article Types</text>
  <text x="70" y="155" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#555">• Review</text>
  <text x="70" y="175" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#555">• Original Research</text>
  <text x="70" y="195" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#555">• Meta‑analysis</text>
  
  <!-- Box 2: Key Concepts -->
  <rect x="290" y="100" width="260" height="140" fill="#e6ffe6" stroke="#bbb" stroke-width="1"/>
  <circle cx="310" cy="120" r="12" fill="#7ed321"/>
  <text x="310" y="124" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#fff">2</text>
  <text x="340" y="125" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#333">Key Concepts</text>
  <text x="310" y="155" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#555">• Hypothesis</text>
  <text x="310" y="175" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#555">• Methodology</text>
  <text x="310" y="195" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#555">• Results Interpretation</text>
  
  <!-- Box 3: Formulas -->
  <rect x="50" y="260" width="260" height="120" fill="#fff0e6" stroke="#bbb" stroke-width="1"/>
  <circle cx="70" cy="280" r="12" fill="#f5a623"/>
  <text x="70" y="284" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#fff">3</text>
  <text x="100" y="285" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#333">Formulas</text>
  <text x="70" y="315" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#555">• n = (Z²·p·(1‑p))/E²</text>
  <text x="70" y="335" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#555">• t = (X̄‑μ)/(s/√n)</text>
  
  <!-- Box 4: Quick Examples -->
  <rect x="290" y="260" width="260" height="120" fill="#ffe6f2" stroke="#bbb" stroke-width="1"/>
  <circle cx="310" cy="280" r="12" fill="#d0021b"/>
  <text x="310" y="284" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#fff">4</text>
  <text x="340" y="285" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#333">Quick Examples</text>
  <text x="310" y="315" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#555">• Sample size calc</text>
  <text x="310" y="335" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#555">• Effect size interpretation</text>
</svg>