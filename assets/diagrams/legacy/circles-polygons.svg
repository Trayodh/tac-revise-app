<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Definitions for arrowheads -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#000"/>
    </marker>
  </defs>

  <!-- Circumscribed Square -->
  <rect x="150" y="50" width="300" height="300" fill="none" stroke="#2ca02c" stroke-width="2"/>
  <text x="300" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2ca02c">Circumscribed Square</text>

  <!-- Circle -->
  <circle cx="300" cy="200" r="150" fill="none" stroke="#ff7f0e" stroke-width="2"/>
  <text x="300" y="380" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#ff7f0e">Circle (radius r)</text>

  <!-- Inscribed Hexagon -->
  <polygon points="450,200 375,329.9 225,329.9 150,200 225,70.1 375,70.1"
           fill="none" stroke="#1f77b4" stroke-width="2"/>
  <text x="300" y="350" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1f77b4">Inscribed Hexagon</text>

  <!-- Radius line -->
  <line x1="300" y1="200" x2="450" y2="200" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="380" y="190" font-family="sans-serif" font-size="14" fill="#000">Radius r</text>

  <!-- Diameter line -->
  <line x1="150" y1="200" x2="450" y2="200" stroke="#000" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="300" y="215" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#000">Diameter 2r</text>
</svg>