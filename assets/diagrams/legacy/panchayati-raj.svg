<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,10 L10,5 z" fill="#333"/>
    </marker>
    <style>
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #fff; dominant-baseline: middle; text-anchor: middle; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 20px; fill: #333; text-anchor: middle; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="300" y="10" class="title">Local Self‑Government &amp; Panchayati Raj</text>
  
  <!-- Central Government -->
  <rect x="200" y="30" width="200" height="40" fill="#607D8B" stroke="#333" stroke-width="1"/>
  <text x="300" y="50" class="label">Central Government</text>
  
  <!-- State Government -->
  <rect x="200" y="90" width="200" height="40" fill="#9C27B0" stroke="#333" stroke-width="1"/>
  <text x="300" y="110" class="label">State Government</text>
  
  <!-- Zila Parishad (District) -->
  <rect x="200" y="150" width="200" height="40" fill="#FF9800" stroke="#333" stroke-width="1"/>
  <text x="300" y="170" class="label">Zila Parishad (District)</text>
  
  <!-- Panchayat Samiti (Block) -->
  <rect x="200" y="210" width="200" height="40" fill="#2196F3" stroke="#333" stroke-width="1"/>
  <text x="300" y="230" class="label">Panchayat Samiti (Block)</text>
  
  <!-- Gram Panchayat (Village) -->
  <rect x="200" y="270" width="200" height="40" fill="#4CAF50" stroke="#333" stroke-width="1"/>
  <text x="300" y="290" class="label">Gram Panchayat (Village)</text>
  
  <!-- Arrows -->
  <line x1="300" y1="70" x2="300" y2="90" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="130" x2="300" y2="150" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="190" x2="300" y2="210" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="250" x2="300" y2="270" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Side note -->
  <text x="520" y="350" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333">Three‑tier system</text>
</svg>