<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#f9f9f9"/>
  
  <!-- Matrix A label -->
  <text x="50" y="55" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#333">Matrix A (3×3)</text>
  
  <!-- 3x3 Matrix Grid -->
  <g id="matrix3x3" transform="translate(50,80)">
    <!-- Cells -->
    <rect x="0" y="0" width="120" height="120" fill="none" stroke="#555" stroke-width="2"/>
    <line x1="40" y1="0" x2="40" y2="120" stroke="#555" stroke-width="1"/>
    <line x1="80" y1="0" x2="80" y2="120" stroke="#555" stroke-width="1"/>
    <line x1="0" y1="40" x2="120" y2="40" stroke="#555" stroke-width="1"/>
    <line x1="0" y1="80" x2="120" y2="80" stroke="#555" stroke-width="1"/>
    <!-- Numbers -->
    <text x="20" y="30" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#000">a₁₁</text>
    <text x="60" y="30" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#000">a₁₂</text>
    <text x="100" y="30" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#000">a₁₃</text>
    <text x="20" y="70" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#000">a₂₁</text>
    <text x="60" y="70" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#000">a₂₂</text>
    <text x="100" y="70" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#000">a₂₃</text>
    <text x="20" y="110" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#000">a₃₁</text>
    <text x="60" y="110" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#000">a₃₂</text>
    <text x="100" y="110" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#000">a₃₃</text>
  </g>
  
  <!-- Arrow from Matrix A to Determinant illustration -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>
  <path d="M170,140 C250,140 300,180 340,180" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Determinant illustration label -->
  <text x="350" y="55" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#333">Determinant of a 2×2 matrix</text>
  
  <!-- 2x2 Matrix Grid -->
  <g id="matrix2x2" transform="translate(350,120)">
    <rect x="0" y="0" width="120" height="120" fill="none" stroke="#555" stroke-width="2"/>
    <line x1="60" y1="0" x2="60" y2="120" stroke="#555" stroke-width="1"/>
    <line x1="0" y1="60" x2="120" y2="60" stroke="#555" stroke-width="1"/>
    <text x="20" y="40" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#000">a</text>
    <text x="80" y="40" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#000">b</text>
    <text x="20" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#000">c</text>
    <text x="80" y="100" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#000">d</text>
  </g>
  
  <!-- Parallelogram representing determinant (area) -->
  <g transform="translate(500,150)">
    <path d="M0,0 L80,0 L110,60 L30,60 Z" fill="#6abf69" fill-opacity="0.4" stroke="#3a8b3a" stroke-width="2"/>
    <!-- Vectors a and b -->
    <line x1="0" y1="0" x2="80" y2="0" stroke="#3a8b3a" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="80" y1="0" x2="110" y2="60" stroke="#3a8b3a" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="0" y1="0" x2="30" y2="60" stroke="#3a8b3a" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="30" y1="60" x2="110" y2="60" stroke="#3a8b3a" stroke-width="2" marker-end="url(#arrowhead)"/>
    <!-- Labels for vectors -->
    <text x="40" y="-5" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333">a</text>
    <text x="95" y="30" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333">b</text>
    <text x="10" y="70" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333">c</text>
    <text x="80" y="75" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333">d</text>
  </g>
  
  <!-- Determinant formula label -->
  <text x="350" y="300" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#333">det = a·d − b·c</text>
</svg>