<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="#ffffff"/>
  <!-- Central container -->
  <rect x="150" y="100" width="300" height="200" fill="#f0f0f0" stroke="#cccccc" stroke-width="2" rx="8" ry="8"/>
  <!-- Supreme Court block -->
  <rect x="170" y="130" width="120" height="140" fill="#4A90E2" rx="6" ry="6"/>
  <!-- High Courts block -->
  <rect x="310" y="130" width="120" height="140" fill="#50E3C2" rx="6" ry="6"/>
  <!-- Labels -->
  <text x="230" y="210" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">Supreme Court (SC)</text>
  <text x="370" y="210" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">High Courts (HC)</text>
  <text x="300" y="80" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#333333" text-anchor="middle">Integrated Judiciary</text>
  <!-- Integration arrow -->
  <line x1="290" y1="200" x2="310" y2="200" stroke="#333333" stroke-width="2" marker-start="url(#arrowhead)" marker-end="url(#arrowhead)"/>
  <text x="300" y="190" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333333" text-anchor="middle">Integration</text>
  <!-- Optional arrows from central to blocks -->
  <line x1="210" y1="200" x2="170" y2="200" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="390" y1="200" x2="430" y2="200" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>