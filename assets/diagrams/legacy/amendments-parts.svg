<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L10,3.5 Z" fill="#333"/>
    </marker>
  </defs>
  <!-- Main Constitution block -->
  <rect x="150" y="50" width="300" height="200" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
  <!-- Division lines -->
  <line x1="250" y1="50" x2="250" y2="250" stroke="#333" stroke-width="1"/>
  <line x1="350" y1="50" x2="350" y2="250" stroke="#333" stroke-width="1"/>
  <!-- Labels inside Constitution -->
  <text x="300" y="70" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#000">Constitution</text>
  <text x="200" y="80" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#000">Parts</text>
  <text x="300" y="80" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#000">Amendments</text>
  <text x="400" y="80" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#000">Schedules</text>
  <!-- External boxes -->
  <rect x="50" y="80" width="80" height="80" fill="#cce5ff" stroke="#333" stroke-width="1"/>
  <text x="90" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#000">Part I, II, …</text>
  <rect x="260" y="270" width="80" height="80" fill="#d4edda" stroke="#333" stroke-width="1"/>
  <text x="300" y="310" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#000">Amendment 1, 2, …</text>
  <rect x="470" y="80" width="80" height="80" fill="#ffe5cc" stroke="#333" stroke-width="1"/>
  <text x="510" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#000">Schedule 1, 2, …</text>
  <!-- Arrows -->
  <line x1="200" y1="150" x2="130" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="150" x2="300" y2="260" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="150" x2="470" y2="80" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
</svg>