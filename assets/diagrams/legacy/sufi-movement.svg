<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#ffffff"/>
  <style>
    .title { font: bold 24px sans-serif; fill:#333333; text-anchor:middle; }
    .label { font: 14px sans-serif; fill:#333333; }
    .date { font: 12px sans-serif; fill:#555555; text-anchor:middle; }
    .line { stroke:#777777; stroke-width:2; }
    .circle { fill:#4CAF50; stroke:#2E7D32; stroke-width:1; }
    .tick { stroke:#777777; stroke-width:1; }
  </style>
  
  <text x="300" y="40" class="title">History of the Sufi Movement</text>
  
  <!-- Timeline line -->
  <line x1="100" y1="200" x2="500" y2="200" class="line"/>
  
  <!-- Ticks and circles -->
  <!-- 8th Century -->
  <line x1="120" y1="190" x2="120" y2="210" class="tick"/>
  <circle cx="120" cy="200" r="12" class="circle"/>
  <text x="120" y="180" class="date">8th c.</text>
  <text x="120" y="230" class="label">Origins (Islamic mysticism)</text>
  
  <!-- 12th Century -->
  <line x1="200" y1="190" x2="200" y2="210" class="tick"/>
  <circle cx="200" cy="200" r="12" class="circle"/>
  <text x="200" y="180" class="date">12th c.</text>
  <text x="200" y="230" class="label">Qadiriyya order founded</text>
  
  <!-- 13th Century -->
  <line x1="260" y1="190" x2="260" y2="210" class="tick"/>
  <circle cx="260" cy="200" r="12" class="circle"/>
  <text x="260" y="180" class="date">13th c.</text>
  <text x="260" y="230" class="label">Chishti order spreads in India</text>
  
  <!-- 14th Century -->
  <line x1="320" y1="190" x2="320" y2="210" class="tick"/>
  <circle cx="320" cy="200" r="12" class="circle"/>
  <text x="320" y="180" class="date">14th c.</text>
  <text x="320" y="230" class="label">Naqshbandi order emerges</text>
  
  <!-- 16th Century -->
  <line x1="400" y1="190" x2="400" y2="210" class="tick"/>
  <circle cx="400" cy="200" r="12" class="circle"/>
  <text x="400" y="180" class="date">16th c.</text>
  <text x="400" y="230" class="label">Spread to Sub‑Saharan Africa</text>
  
  <!-- 18th Century -->
  <line x1="480" y1="190" x2="480" y2="210" class="tick"/>
  <circle cx="480" cy="200" r="12" class="circle"/>
  <text x="480" y="180" class="date">18th c.</text>
  <text x="480" y="230" class="label">Modern revival & reform</text>
</svg>