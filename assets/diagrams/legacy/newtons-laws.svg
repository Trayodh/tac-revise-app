<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="#f9f9f9"/>
  
  <!-- Law 1 -->
  <g id="law1">
    <rect x="20" y="20" width="180" height="360" fill="#e6f7ff" stroke="#cccccc" stroke-width="1"/>
    <text x="110" y="45" font-family="sans-serif" font-size="14" fill="#333333" text-anchor="middle">Law 1: Inertia</text>
    <!-- Object -->
    <rect x="90" y="150" width="40" height="40" fill="#d0021b"/>
    <!-- Forces -->
    <line x1="70" y1="170" x2="90" y2="170" stroke="#4a90e2" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="55" y="165" font-family="sans-serif" font-size="12" fill="#333333">F₁</text>
    <line x1="130" y1="170" x2="150" y2="170" stroke="#4a90e2" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="165" y="165" font-family="sans-serif" font-size="12" fill="#333333">F₂</text>
    <!-- Caption -->
    <text x="110" y="260" font-family="sans-serif" font-size="12" fill="#333333" text-anchor="middle">Net force = 0 → no acceleration</text>
  </g>
  
  <!-- Law 2 -->
  <g id="law2">
    <rect x="210" y="20" width="180" height="360" fill="#e6ffed" stroke="#cccccc" stroke-width="1"/>
    <text x="300" y="45" font-family="sans-serif" font-size="14" fill="#333333" text-anchor="middle">Law 2: F = ma</text>
    <!-- Object -->
    <rect x="270" y="150" width="40" height="40" fill="#d0021b"/>
    <!-- Net Force -->
    <line x1="290" y1="150" x2="290" y2="100" stroke="#4a90e2" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="295" y="130" font-family="sans-serif" font-size="12" fill="#333333">F</text>
    <!-- Acceleration -->
    <line x1="290" y1="190" x2="290" y2="240" stroke="#7ed321" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="295" y="215" font-family="sans-serif" font-size="12" fill="#333333">a</text>
    <!-- Equation -->
    <text x="300" y="300" font-family="sans-serif" font-size="12" fill="#333333" text-anchor="middle">F = m·a</text>
  </g>
  
  <!-- Law 3 -->
  <g id="law3">
    <rect x="400" y="20" width="180" height="360" fill="#fff4e6" stroke="#cccccc" stroke-width="1"/>
    <text x="490" y="45" font-family="sans-serif" font-size="14" fill="#333333" text-anchor="middle">Law 3: Action = Reaction</text>
    <!-- Object A -->
    <rect x="440" y="150" width="40" height="40" fill="#d0021b"/>
    <!-- Object B -->
    <rect x="520" y="150" width="40" height="40" fill="#d0021b"/>
    <!-- Force from A to B -->
    <line x1="480" y1="170" x2="520" y2="170" stroke="#4a90e2" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="500" y="165" font-family="sans-serif" font-size="12" fill="#333333">F_AB</text>
    <!-- Force from B to A -->
    <line x1="560" y1="170" x2="520" y2="170" stroke="#4a90e2" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="540" y="165" font-family="sans-serif" font-size="12" fill="#333333">F_BA</text>
    <!-- Caption -->
    <text x="490" y="260" font-family="sans-serif" font-size="12" fill="#333333" text-anchor="middle">Equal & opposite forces</text>
  </g>
</svg>