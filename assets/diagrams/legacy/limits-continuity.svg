<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for arrowheads -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="black"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="50" y1="200" x2="550" y2="200" stroke="black" stroke-width="2"/>
  <line x1="300" y1="50" x2="300" y2="350" stroke="black" stroke-width="2"/>
  <!-- Arrowheads for axes -->
  <line x1="545" y1="200" x2="550" y2="200" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="55" x2="300" y2="50" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Function f(x) = (x^2-1)/(x-1) = x+1 with a hole at x=1 -->
  <!-- Left segment -->
  <path d="M100,350 L300,150 L345,105" stroke="steelblue" stroke-width="3" fill="none"/>
  <!-- Right segment -->
  <path d="M355,95 L500,25" stroke="steelblue" stroke-width="3" fill="none"/>
  <!-- Hole (open circle) -->
  <circle cx="350" cy="100" r="6" fill="none" stroke="crimson" stroke-width="2"/>
  <!-- Label for hole -->
  <text x="360" y="85" font-family="sans-serif" font-size="14" fill="crimson">Hole (discontinuity)</text>
  <line x1="350" y1="100" x2="380" y2="90" stroke="crimson" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Limit annotation -->
  <text x="320" y="120" font-family="sans-serif" font-size="14" fill="steelblue">lim₍ₓ→₁₎ f(x) = 2</text>
  <line x1="350" y1="100" x2="340" y2="130" stroke="steelblue" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Continuous function h(x)=sin(x) -->
  <path d="M143,200 C221.5,250 378.5,150 457,200" stroke="seagreen" stroke-width="3" fill="none"/>
  <!-- Label for continuous function -->
  <text x="460" y="210" font-family="sans-serif" font-size="14" fill="seagreen">Continuous function h(x)=sin(x)</text>
  <line x1="457" y1="200" x2="470" y2="210" stroke="seagreen" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Tick marks -->
  <g stroke="black" stroke-width="1">
    <!-- X-axis ticks -->
    <line x1="300" y1="195" x2="300" y2="205"/>
    <line x1="250" y1="195" x2="250" y2="205"/>
    <line x1="350" y1="195" x2="350" y2="205"/>
    <line x1="200" y1="195" x2="200" y2="205"/>
    <line x1="400" y1="195" x2="400" y2="205"/>
    <!-- Y-axis ticks -->
    <line x1="295" y1="200" x2="305" y2="200"/>
    <line x1="295" y1="150" x2="305" y2="150"/>
    <line x1="295" y1="250" x2="305" y2="250"/>
  </g>

  <!-- Axis labels -->
  <text x="560" y="195" font-family="sans-serif" font-size="14">x</text>
  <text x="305" y="45" font-family="sans-serif" font-size="14">y</text>
</svg>