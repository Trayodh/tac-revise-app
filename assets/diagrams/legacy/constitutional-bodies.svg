<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <style>
    .title { font: bold 24px sans-serif; fill:#333; }
    .group-title { font: bold 16px sans-serif; fill:#fff; }
    .body-label { font: 14px sans-serif; fill:#fff; }
    .connector-label { font: 12px sans-serif; fill:#333; }
  </style>
  <!-- Title -->
  <text x="300" y="40" class="title" text-anchor="middle">Constitutional &amp; Non-Constitutional Bodies</text>
  
  <!-- Constitutional Bodies Group -->
  <rect x="80" y="60" width="200" height="270" fill="#E0F0FF" stroke="#4A90E2" stroke-width="2" rx="8"/>
  <rect x="80" y="60" width="200" height="30" fill="#4A90E2"/>
  <text x="180" y="80" class="group-title" dominant-baseline="middle" text-anchor="middle">Constitutional Bodies</text>
  
  <rect x="100" y="110" width="180" height="50" fill="#4A90E2" rx="6"/>
  <text x="190" y="135" class="body-label" dominant-baseline="middle" text-anchor="middle">Parliament</text>
  
  <rect x="100" y="180" width="180" height="50" fill="#4A90E2" rx="6"/>
  <text x="190" y="205" class="body-label" dominant-baseline="middle" text-anchor="middle">Supreme Court</text>
  
  <rect x="100" y="250" width="180" height="50" fill="#4A90E2" rx="6"/>
  <text x="190" y="275" class="body-label" dominant-baseline="middle" text-anchor="middle">Election Commission</text>
  
  <!-- Non-Constitutional Bodies Group -->
  <rect x="320" y="60" width="200" height="270" fill="#FFF4E0" stroke="#F5A623" stroke-width="2" rx="8"/>
  <rect x="320" y="60" width="200" height="30" fill="#F5A623"/>
  <text x="420" y="80" class="group-title" dominant-baseline="middle" text-anchor="middle">Non-Constitutional Bodies</text>
  
  <rect x="340" y="110" width="180" height="50" fill="#F5A623" rx="6"/>
  <text x="430" y="135" class="body-label" dominant-baseline="middle" text-anchor="middle">Advisory Council</text>
  
  <rect x="340" y="180" width="180" height="50" fill="#F5A623" rx="6"/>
  <text x="430" y="205" class="body-label" dominant-baseline="middle" text-anchor="middle">Statutory Bodies</text>
  
  <rect x="340" y="250" width="180" height="50" fill="#F5A623" rx="6"/>
  <text x="430" y="275" class="body-label" dominant-baseline="middle" text-anchor="middle">NGOs / Civil Society</text>
  
  <!-- Connector Arrow -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="5" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#333"/>
    </marker>
  </defs>
  <line x1="280" y1="210" x2="340" y2="210" stroke="#333" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="310" y="200" class="connector-label" text-anchor="middle">Interaction / Overlap</text>
</svg>