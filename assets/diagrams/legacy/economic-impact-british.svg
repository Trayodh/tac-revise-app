<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#555"/>
    </marker>
  </defs>
  <!-- Title -->
  <text x="300" y="40" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#333">Economic Impact of British Rule</text>
  <!-- Timeline -->
  <line x1="50" y1="350" x2="550" y2="350" stroke="#555" stroke-width="2"/>
  <!-- Markers for key years -->
  <circle cx="150" cy="350" r="6" fill="#333"/>
  <circle cx="300" cy="350" r="6" fill="#333"/>
  <circle cx="450" cy="350" r="6" fill="#333"/>
  <!-- Year labels -->
  <text x="150" y="370" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333">1750</text>
  <text x="300" y="370" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333">1850</text>
  <text x="450" y="370" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333">1900</text>
  <!-- Arrows from timeline to impact boxes -->
  <line x1="150" y1="350" x2="160" y2="200" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="350" x2="320" y2="130" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="350" x2="480" y2="170" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Impact boxes -->
  <rect x="100" y="200" width="120" height="120" fill="#4A90E2"/>
  <rect x="260" y="130" width="120" height="190" fill="#50E3C2"/>
  <rect x="420" y="170" width="120" height="150" fill="#F5A623"/>
  <!-- Labels inside boxes -->
  <text x="160" y="230" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#fff">Trade Expansion</text>
  <text x="320" y="160" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#fff">Railway Infrastructure</text>
  <text x="480" y="200" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#fff">Tax Revenue</text>
  <!-- Brief description captions -->
  <text x="300" y="300" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333">Increased exports, railway construction, and fiscal reforms under British administration.</text>
</svg>