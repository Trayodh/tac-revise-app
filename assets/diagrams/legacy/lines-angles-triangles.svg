<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="black"/>
    </marker>
  </defs>

  <!-- Triangle -->
  <polygon points="150,300 450,300 300,100" fill="#a0c4ff" stroke="black" stroke-width="2"/>

  <!-- Vertex labels -->
  <text x="140" y="315" font-family="sans-serif" font-size="16" fill="black">A</text>
  <text x="460" y="315" font-family="sans-serif" font-size="16" fill="black">B</text>
  <text x="310" y="95" font-family="sans-serif" font-size="16" fill="black">C</text>

  <!-- Angle arcs -->
  <path d="M180,300 A30,30 0 0 1 168,276" fill="none" stroke="#ff7f0e" stroke-width="2"/>
  <path d="M420,300 A30,30 0 0 1 432,276" fill="none" stroke="#ff7f0e" stroke-width="2"/>
  <path d="M282,124 A30,30 0 0 1 318,124" fill="none" stroke="#ff7f0e" stroke-width="2"/>

  <!-- Angle labels -->
  <text x="170" y="285" font-family="sans-serif" font-size="18" fill="#ff7f0e">α</text>
  <text x="430" y="285" font-family="sans-serif" font-size="18" fill="#ff7f0e">β</text>
  <text x="300" y="130" font-family="sans-serif" font-size="18" fill="#ff7f0e">γ</text>

  <!-- Extended line ℓ -->
  <line x1="50" y1="300" x2="150" y2="300" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="80" y="285" font-family="sans-serif" font-size="16" fill="black">Line ℓ</text>

  <!-- Transversal line t -->
  <line x1="200" y1="50" x2="500" y2="350" stroke="#2ca02c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="210" y="70" font-family="sans-serif" font-size="16" fill="#2ca02c">Transversal t</text>
</svg>