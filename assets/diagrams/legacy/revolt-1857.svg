<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 Z" fill="#333"/>
    </marker>
    <style>
      .title { font: bold 24px sans-serif; fill:#333; }
      .city { font: 14px sans-serif; fill:#333; }
      .label { font: 12px sans-serif; fill:#333; }
    </style>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="#f5f5f5"/>
  <!-- Simplified map outline -->
  <path d="M150,80 L450,80 L470,120 L470,300 L150,300 Z" fill="#e0e0e0" stroke="#777" stroke-width="2"/>
  <!-- Title -->
  <text x="300" y="40" text-anchor="middle" class="title">Revolt of 1857</text>
  <!-- Cities -->
  <circle cx="300" cy="120" r="8" fill="#c0392b"/>
  <circle cx="340" cy="150" r="8" fill="#c0392b"/>
  <circle cx="320" cy="200" r="8" fill="#c0392b"/>
  <circle cx="380" cy="210" r="8" fill="#c0392b"/>
  <circle cx="260" cy="210" r="8" fill="#c0392b"/>
  <!-- City Labels -->
  <text x="300" y="115" text-anchor="middle" dy="-12" class="city">Delhi</text>
  <text x="340" y="145" text-anchor="middle" dy="-12" class="city">Meerut</text>
  <text x="320" y="195" text-anchor="middle" dy="-12" class="city">Kanpur</text>
  <text x="380" y="205" text-anchor="middle" dy="-12" class="city">Lucknow</text>
  <text x="260" y="205" text-anchor="middle" dy="-12" class="city">Jhansi</text>
  <!-- Arrows showing spread -->
  <line x1="300" y1="120" x2="340" y2="150" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="150" x2="320" y2="200" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="200" x2="380" y2="210" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="200" x2="260" y2="210" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="120" x2="320" y2="200" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Arrow Labels -->
  <text x="320" y="135" class="label">Spread</text>
  <text x="330" y="175" class="label">Spread</text>
  <text x="350" y="205" class="label">Spread</text>
  <text x="290" y="205" class="label">Spread</text>
  <text x="310" y="160" class="label">Spread</text>
</svg>