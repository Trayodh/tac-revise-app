<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#555"/>
    </marker>
    <style>
      .central { fill:#4A90E2; stroke:#2C5AA0; stroke-width:2; }
      .rect { fill:#F5A623; stroke:#D4880D; stroke-width:1; }
      .rect2 { fill:#7ED321; stroke:#5AA70D; stroke-width:1; }
      .rect3 { fill:#BD10E0; stroke:#9B0CBF; stroke-width:1; }
      .rect4 { fill:#50E3C2; stroke:#3CB9A1; stroke-width:1; }
      .rect5 { fill:#FFCE00; stroke:#D4B000; stroke-width:1; }
      .rect6 { fill:#FF6F61; stroke:#D95A4F; stroke-width:1; }
      .label { font-family:Arial,Helvetica,sans-serif; font-size:12px; fill:#000; text-anchor:middle; }
      .title { font-family:Arial,Helvetica,sans-serif; font-size:14px; fill:#fff; text-anchor:middle; font-weight:bold; }
    </style>
  </defs>

  <!-- Central Circle -->
  <circle cx="300" cy="200" r="50" class="central"/>
  <text x="300" y="195" class="title">Fundamental Rights</text>
  <text x="300" y="215" class="title">Art 12‑35</text>

  <!-- Rectangles -->
  <!-- Equality -->
  <rect x="230" y="30" width="140" height="40" class="rect"/>
  <text x="300" y="48" class="label">
    <tspan x="300">Right to Equality</tspan>
    <tspan x="300" dy="1.2em">Art 14‑18</tspan>
  </text>

  <!-- Remedies -->
  <rect x="410" y="30" width="140" height="40" class="rect2"/>
  <text x="480" y="48" class="label">
    <tspan x="480">Right to Constitutional Remedies</tspan>
    <tspan x="480" dy="1.2em">Art 32</tspan>
  </text>

  <!-- Freedom -->
  <rect x="410" y="180" width="140" height="40" class="rect3"/>
  <text x="480" y="198" class="label">
    <tspan x="480">Right to Freedom</tspan>
    <tspan x="480" dy="1.2em">Art 19‑22</tspan>
  </text>

  <!-- Exploitation -->
  <rect x="230" y="340" width="140" height="40" class="rect4"/>
  <text x="300" y="358" class="label">
    <tspan x="300">Right against Exploitation</tspan>
    <tspan x="300" dy="1.2em">Art 23‑24</tspan>
  </text>

  <!-- Religion -->
  <rect x="30" y="180" width="140" height="40" class="rect5"/>
  <text x="100" y="198" class="label">
    <tspan x="100">Right to Freedom of Religion</tspan>
    <tspan x="100" dy="1.2em">Art 25‑28</tspan>
  </text>

  <!-- Cultural & Educational -->
  <rect x="30" y="30" width="140" height="40" class="rect6"/>
  <text x="100" y="48" class="label">
    <tspan x="100">Cultural &amp; Educational Rights</tspan>
    <tspan x="100" dy="1.2em">Art 29‑30</tspan>
  </text>

  <!-- Arrows -->
  <line x1="300" y1="200" x2="300" y2="50" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="200" x2="480" y2="50" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="200" x2="480" y2="200" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="200" x2="300" y2="360" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="200" x2="100" y2="200" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="200" x2="100" y2="50" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
</svg>