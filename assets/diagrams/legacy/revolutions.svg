<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <style>
    .title { font: bold 24px Arial, sans-serif; fill: #333; }
    .label { font: 14px Arial, sans-serif; fill: #333; }
    .legend { font: 12px Arial, sans-serif; fill: #333; }
    .line { stroke: #555; stroke-width: 2; }
  </style>
  <!-- Title -->
  <text x="300" y="40" class="title" text-anchor="middle">Major Historical Revolutions</text>
  <!-- Timeline line -->
  <line x1="50" y1="200" x2="550" y2="200" class="line"/>
  <!-- Revolutions -->
  <!-- American Revolution -->
  <circle cx="120" cy="200" r="15" fill="#4CAF50"/>
  <text x="120" y="170" class="label" text-anchor="middle">American Revolution (1776)</text>
  <!-- French Revolution -->
  <circle cx="150" cy="200" r="15" fill="#2196F3"/>
  <text x="150" y="170" class="label" text-anchor="middle">French Revolution (1789)</text>
  <!-- Industrial Revolution -->
  <circle cx="250" cy="200" r="15" fill="#FF9800"/>
  <text x="250" y="235" class="label" text-anchor="middle">Industrial Revolution (1760‑1840)</text>
  <!-- Russian Revolution -->
  <circle cx="350" cy="200" r="15" fill="#9C27B0"/>
  <text x="350" y="235" class="label" text-anchor="middle">Russian Revolution (1917)</text>
  <!-- Digital Revolution -->
  <circle cx="470" cy="200" r="15" fill="#F44336"/>
  <text x="470" y="235" class="label" text-anchor="middle">Digital Revolution (1970s‑present)</text>
  <!-- Legend -->
  <rect x="50" y="320" width="12" height="12" fill="#4CAF50"/>
  <text x="70" y="331" class="legend">American</text>
  <rect x="150" y="320" width="12" height="12" fill="#2196F3"/>
  <text x="170" y="331" class="legend">French</text>
  <rect x="250" y="320" width="12" height="12" fill="#FF9800"/>
  <text x="270" y="331" class="legend">Industrial</text>
  <rect x="350" y="320" width="12" height="12" fill="#9C27B0"/>
  <text x="370" y="331" class="legend">Russian</text>
  <rect x="470" y="320" width="12" height="12" fill="#F44336"/>
  <text x="490" y="331" class="legend">Digital</text>
</svg>