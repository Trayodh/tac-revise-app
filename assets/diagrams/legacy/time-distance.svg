<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#333"/>
    </marker>
  </defs>
  <!-- Time -->
  <circle cx="100" cy="100" r="50" fill="#4A90E2"/>
  <text x="100" y="105" text-anchor="middle" fill="#fff" font-size="14" font-family="sans-serif">Time (t)</text>
  <!-- Speed -->
  <circle cx="500" cy="100" r="50" fill="#7ED321"/>
  <text x="500" y="105" text-anchor="middle" fill="#fff" font-size="14" font-family="sans-serif">Speed (v)</text>
  <!-- Distance -->
  <rect x="250" y="260" width="100" height="60" rx="10" fill="#F5A623"/>
  <text x="300" y="295" text-anchor="middle" fill="#fff" font-size="14" font-family="sans-serif">Distance (d)</text>
  <!-- Work -->
  <circle cx="300" cy="50" r="40" fill="#BD10E0"/>
  <text x="300" y="55" text-anchor="middle" fill="#fff" font-size="14" font-family="sans-serif">Work (W)</text>
  <!-- Force -->
  <circle cx="500" cy="300" r="40" fill="#FF5A5F"/>
  <text x="500" y="305" text-anchor="middle" fill="#fff" font-size="14" font-family="sans-serif">Force (F)</text>
  <!-- Arrows -->
  <path d="M150,100 L250,260" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M450,100 L350,260" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M300,260 L300,90" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M460,300 L340,90" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
</svg>