<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <style>
    .title { font: bold 24px sans-serif; fill: #222; }
    .label { font: 14px sans-serif; fill: #333; }
    .circle { stroke: none; }
    .line { stroke: #777; stroke-width: 2; }
  </style>
  <!-- Title -->
  <text x="300" y="40" text-anchor="middle" class="title">Citizenship (Art 5‑11)</text>
  <!-- Central circle -->
  <circle cx="300" cy="200" r="80" fill="#2E86AB" class="circle"/>
  <text x="300" y="205" text-anchor="middle" font-size="18px" fill="#fff" font-family="sans-serif">Citizenship</text>
  <!-- Surrounding circles -->
  <circle cx="300" cy="80" r="50" fill="#6EB5C0" class="circle"/>
  <circle cx="460" cy="200" r="50" fill="#6EB5C0" class="circle"/>
  <circle cx="300" cy="320" r="50" fill="#6EB5C0" class="circle"/>
  <circle cx="140" cy="200" r="50" fill="#6EB5C0" class="circle"/>
  <!-- Connecting lines -->
  <line x1="300" y1="120" x2="300" y2="150" class="line"/>
  <line x1="350" y1="200" x2="380" y2="200" class="line"/>
  <line x1="300" y1="250" x2="300" y2="270" class="line"/>
  <line x1="190" y1="200" x2="220" y2="200" class="line"/>
  <!-- Labels -->
  <text x="300" y="45" text-anchor="middle" class="label">Birthright (Art 5)</text>
  <text x="520" y="205" text-anchor="start" class="label">Naturalization (Art 6)</text>
  <text x="300" y="385" text-anchor="middle" class="label">Loss of Citizenship (Art 7)</text>
  <text x="20" y="205" text-anchor="end" class="label">Dual Citizenship (Art 8‑11)</text>
</svg>