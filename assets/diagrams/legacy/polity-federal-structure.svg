<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" font-family="Arial,Helvetica,sans-serif">
  <!-- Definitions for arrowheads -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Union (Centre) -->
  <rect x="225" y="30" width="150" height="80" fill="#4A90E2" rx="8"/>
  <text x="300" y="70" fill="#fff" font-size="16" text-anchor="middle" dominant-baseline="middle">Union Government</text>

  <!-- States -->
  <rect x="50"  y="200" width="100" height="80" fill="#CCCCCC" rx="8"/>
  <text x="100" y="240" fill="#000" font-size="14" text-anchor="middle" dominant-baseline="middle">State 1</text>

  <rect x="200" y="200" width="100" height="80" fill="#CCCCCC" rx="8"/>
  <text x="250" y="240" fill="#000" font-size="14" text-anchor="middle" dominant-baseline="middle">State 2</text>

  <rect x="350" y="200" width="100" height="80" fill="#CCCCCC" rx="8"/>
  <text x="400" y="240" fill="#000" font-size="14" text-anchor="middle" dominant-baseline="middle">State 3</text>

  <rect x="500" y="200" width="100" height="80" fill="#CCCCCC" rx="8"/>
  <text x="550" y="240" fill="#000" font-size="14" text-anchor="middle" dominant-baseline="middle">State 4</text>

  <!-- Arrows from Union to States (Legislative) -->
  <path d="M300,110 C300,150 100,150 100,200" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="180" y="140" fill="#555" font-size="12" text-anchor="middle">Legislative</text>

  <path d="M300,110 C300,150 250,150 250,200" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="275" y="140" fill="#555" font-size="12" text-anchor="middle">Legislative</text>

  <path d="M300,110 C300,150 400,150 400,200" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="350" y="140" fill="#555" font-size="12" text-anchor="middle">Legislative</text>

  <path d="M300,110 C300,150 550,150 550,200" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="425" y="140" fill="#555" font-size="12" text-anchor="middle">Legislative</text>

  <!-- Arrows from States to Union (Executive) -->
  <path d="M100,280 C100,320 300,320 300,310" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="200" y="340" fill="#555" font-size="12" text-anchor="middle">Executive</text>

  <path d="M250,280 C250,320 300,320 300,310" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="275" y="340" fill="#555" font-size="12" text-anchor="middle">Executive</text>

  <path d="M400,280 C400,320 300,320 300,310" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="350" y="340" fill="#555" font-size="12" text-anchor="middle">Executive</text>

  <path d="M550,280 C550,320 300,320 300,310" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="425" y="340" fill="#555" font-size="12" text-anchor="middle">Executive</text>

  <!-- Financial Relations (Vertical double-headed arrow) -->
  <line x1="300" y1="110" x2="300" y2="200" stroke="#555" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="315" y="155" fill="#555" font-size="12">Financial Powers</text>
</svg>