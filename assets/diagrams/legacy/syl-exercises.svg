<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for arrowheads -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#000"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="#FAFAFA"/>

  <!-- Work Section -->
  <g id="work" transform="translate(50,50)">
    <!-- Inclined plane -->
    <line x1="0" y1="150" x2="200" y2="0" stroke="#4A90E2" stroke-width="4"/>
    <!-- Block -->
    <rect x="80" y="70" width="40" height="40" fill="#4A90E2"/>
    <!-- Force arrow -->
    <line x1="100" y1="110" x2="150" y2="60" stroke="#D0021B" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="155" y="55" font-family="sans-serif" font-size="14" fill="#D0021B">F</text>
    <!-- Displacement arrow -->
    <line x1="80" y1="150" x2="180" y2="50" stroke="#7ED321" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="185" y="45" font-family="sans-serif" font-size="14" fill="#7ED321">d</text>
    <!-- Label -->
    <text x="0" y="-10" font-family="sans-serif" font-size="18" fill="#000">Work (W = F·d)</text>
  </g>

  <!-- Power Section -->
  <g id="power" transform="translate(350,30)">
    <!-- Clock face -->
    <circle cx="100" cy="100" r="80" fill="#50E3C2" stroke="#000" stroke-width="2"/>
    <!-- Clock hand (representing rate) -->
    <line x1="100" y1="100" x2="100" y2="30" stroke="#000" stroke-width="4"/>
    <!-- Power label -->
    <text x="20" y="190" font-family="sans-serif" font-size="18" fill="#000">Power (P = W/t)</text>
  </g>

  <!-- Energy Section -->
  <g id="energy" transform="translate(50,250)">
    <!-- Spring -->
    <path d="M0,20 q10,-15 20,0 t20,0 t20,0 t20,0 t20,0" fill="none" stroke="#F5A623" stroke-width="4"/>
    <!-- Mass block -->
    <rect x="120" y="0" width="40" height="40" fill="#F5A623"/>
    <!-- Energy label -->
    <text x="0" y="-10" font-family="sans-serif" font-size="18" fill="#000">Potential Energy (U)</text>
  </g>

  <!-- Gravitation Section -->
  <g id="gravitation" transform="translate(350,250)">
    <!-- Planet -->
    <circle cx="100" cy="100" r="60" fill="#7ED321"/>
    <!-- Gravitational arrows -->
    <line x1="100" y1="40" x2="100" y2="0" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="140" y1="60" x2="170" y2="30" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="60" y1="60" x2="30" y2="30" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="140" y1="140" x2="170" y2="170" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="60" y1="140" x2="30" y2="170" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Label -->
    <text x="20" y="190" font-family="sans-serif" font-size="18" fill="#000">Gravitation (F = G·m₁m₂/r²)</text>
  </g>
</svg>