<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#f5f5f5"/>
  <!-- Title -->
  <text x="300" y="40" font-family="sans-serif" font-size="24" fill="#333" text-anchor="middle">World War II Timeline</text>
  <!-- Timeline line -->
  <line x1="100" y1="200" x2="500" y2="200" stroke="#333" stroke-width="4"/>
  <!-- Event markers -->
  <circle cx="130" cy="200" r="8" fill="#1e90ff"/>
  <circle cx="190" cy="200" r="8" fill="#1e90ff"/>
  <circle cx="260" cy="200" r="8" fill="#1e90ff"/>
  <circle cx="340" cy="200" r="8" fill="#1e90ff"/>
  <circle cx="440" cy="200" r="8" fill="#1e90ff"/>
  <circle cx="500" cy="200" r="8" fill="#1e90ff"/>
  <!-- Connecting lines and labels (above) -->
  <line x1="130" y1="192" x2="130" y2="155" stroke="#555" stroke-width="1"/>
  <text x="130" y="150" font-family="sans-serif" font-size="12" fill="#000" text-anchor="middle">1939: Invasion of Poland</text>
  <line x1="190" y1="192" x2="190" y2="155" stroke="#555" stroke-width="1"/>
  <text x="190" y="150" font-family="sans-serif" font-size="12" fill="#000" text-anchor="middle">1940: Battle of Britain</text>
  <line x1="260" y1="192" x2="260" y2="155" stroke="#555" stroke-width="1"/>
  <text x="260" y="150" font-family="sans-serif" font-size="12" fill="#000" text-anchor="middle">1941: Pearl Harbor</text>
  <!-- Connecting lines and labels (below) -->
  <line x1="340" y1="208" x2="340" y2="250" stroke="#555" stroke-width="1"/>
  <text x="340" y="260" font-family="sans-serif" font-size="12" fill="#000" text-anchor="middle">1942: Battle of Stalingrad</text>
  <line x1="440" y1="208" x2="440" y2="250" stroke="#555" stroke-width="1"/>
  <text x="440" y="260" font-family="sans-serif" font-size="12" fill="#000" text-anchor="middle">1944: D‑Day (Normandy)</text>
  <line x1="500" y1="208" x2="500" y2="250" stroke="#555" stroke-width="1"/>
  <text x="500" y="260" font-family="sans-serif" font-size="12" fill="#000" text-anchor="middle">1945: Hiroshima</text>
</svg>