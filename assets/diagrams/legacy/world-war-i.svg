<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="300" y="40" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#333333">World War I</text>
  
  <!-- Allied Powers block -->
  <rect x="50" y="80" width="200" height="250" fill="#e0f7ff" stroke="#333333" stroke-width="2"/>
  <text x="150" y="105" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#333333">Allied Powers</text>
  <!-- France -->
  <circle cx="150" cy="130" r="20" fill="#0055A4"/>
  <text x="180" y="135" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333333">France</text>
  <!-- United Kingdom -->
  <circle cx="150" cy="180" r="20" fill="#00247D"/>
  <text x="180" y="185" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333333">United Kingdom</text>
  <!-- Russia -->
  <circle cx="150" cy="230" r="20" fill="#0039A6"/>
  <text x="180" y="235" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333333">Russia</text>
  <!-- United States -->
  <circle cx="150" cy="280" r="20" fill="#3C3B6E"/>
  <text x="180" y="285" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333333">United States</text>
  
  <!-- Central Powers block -->
  <rect x="350" y="80" width="200" height="250" fill="#ffe0e0" stroke="#333333" stroke-width="2"/>
  <text x="450" y="105" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#333333">Central Powers</text>
  <!-- Germany -->
  <circle cx="450" cy="130" r="20" fill="#000000"/>
  <text x="420" y="135" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333333" text-anchor="end">Germany</text>
  <!-- Austria‑Hungary -->
  <circle cx="450" cy="190" r="20" fill="#FF0000"/>
  <text x="420" y="195" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333333" text-anchor="end">Austria‑Hungary</text>
  <!-- Ottoman Empire -->
  <circle cx="450" cy="250" r="20" fill="#008000"/>
  <text x="420" y="255" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333333" text-anchor="end">Ottoman Empire</text>
  
  <!-- Trench warfare representation -->
  <path d="M250 200 q20 -30 40 0 t40 0 t40 0 t40 0" stroke="#555555" stroke-width="4" fill="none"/>
  <text x="300" y="190" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#555555">Trench Warfare</text>
  
  <!-- Timeline -->
  <rect x="100" y="340" width="400" height="30" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
  <text x="120" y="360" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#333333">1914</text>
  <text x="200" y="360" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#333333">1915</text>
  <text x="280" y="360" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#333333">1916</text>
  <text x="360" y="360" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#333333">1917</text>
  <text x="440" y="360" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#333333">1918</text>
</svg>