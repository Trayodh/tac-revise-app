<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="black"/>
    </marker>
    <style>
      .label {font-family:Arial,sans-serif;font-size:14px;fill:#333;}
      .connector {stroke:#666;stroke-width:1;fill:none;}
    </style>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="white"/>

  <!-- Speaker (Source) -->
  <rect x="50" y="150" width="60" height="100" fill="#4A90E2"/>
  <circle cx="80" cy="200" r="20" fill="#F5A623"/>
  <text class="label" x="80" y="130" text-anchor="middle">Speaker (Source)</text>
  <line class="connector" x1="80" y1="150" x2="80" y2="120"/>

  <!-- Air (Medium) -->
  <rect x="120" y="100" width="440" height="200" fill="#D0E8FF" opacity="0.5"/>
  <text class="label" x="340" y="120" text-anchor="middle">Air (Medium)</text>

  <!-- Sound Wave -->
  <path d="M110,200 
           C130,150 170,250 190,200 
           S250,150 270,200 
           S330,250 350,200 
           S410,150 430,200 
           S470,250 490,200" 
        stroke="#2C3E50" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Compression label -->
  <text class="label" x="190" y="180" text-anchor="middle">Compression</text>
  <line class="connector" x1="190" y1="190" x2="190" y2="200"/>

  <!-- Rarefaction label -->
  <text class="label" x="250" y="225" text-anchor="middle">Rarefaction</text>
  <line class="connector" x1="250" y1="215" x2="250" y2="200"/>

  <!-- Microphone (Detector) -->
  <rect x="500" y="150" width="60" height="100" fill="#7ED321"/>
  <circle cx="530" cy="200" r="20" fill="#F8E71C"/>
  <text class="label" x="530" y="130" text-anchor="middle">Microphone (Detector)</text>
  <line class="connector" x1="530" y1="150" x2="530" y2="120"/>
</svg>