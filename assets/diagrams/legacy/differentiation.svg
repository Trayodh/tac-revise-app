<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 Z" fill="#333"/>
    </marker>
    <style>
      .title {font-family:Arial,sans-serif;font-size:20px;fill:#fff;}
      .rule {font-family:Arial,sans-serif;font-size:14px;fill:#fff;}
    </style>
  </defs>

  <!-- Central box -->
  <rect x="200" y="20" width="200" height="60" fill="#4A90E2" stroke="#333" stroke-width="2" rx="8" ry="8"/>
  <text x="300" y="55" text-anchor="middle" class="title">Differentiation Rules</text>

  <!-- Power Rule -->
  <rect x="80" y="130" width="150" height="50" fill="#7ED321" stroke="#333" stroke-width="2" rx="6" ry="6"/>
  <text x="155" y="155" text-anchor="middle" class="rule">Power Rule</text>
  <text x="155" y="170" text-anchor="middle" class="rule" font-size="12">d/dx xⁿ = n xⁿ⁻¹</text>

  <!-- Product Rule -->
  <rect x="370" y="130" width="150" height="50" fill="#7ED321" stroke="#333" stroke-width="2" rx="6" ry="6"/>
  <text x="445" y="155" text-anchor="middle" class="rule">Product Rule</text>
  <text x="445" y="170" text-anchor="middle" class="rule" font-size="12">d/dx (uv) = u'v + uv'</text>

  <!-- Quotient Rule -->
  <rect x="80" y="210" width="150" height="50" fill="#7ED321" stroke="#333" stroke-width="2" rx="6" ry="6"/>
  <text x="155" y="235" text-anchor="middle" class="rule">Quotient Rule</text>
  <text x="155" y="250" text-anchor="middle" class="rule" font-size="12">d/dx (u/v) = (u'v‑uv')/v²</text>

  <!-- Chain Rule -->
  <rect x="370" y="210" width="150" height="50" fill="#7ED321" stroke="#333" stroke-width="2" rx="6" ry="6"/>
  <text x="445" y="235" text-anchor="middle" class="rule">Chain Rule</text>
  <text x="445" y="250" text-anchor="middle" class="rule" font-size="12">d/dx f(g(x)) = f'(g(x))·g'(x)</text>

  <!-- Sum/Difference Rule -->
  <rect x="225" y="290" width="150" height="50" fill="#7ED321" stroke="#333" stroke-width="2" rx="6" ry="6"/>
  <text x="300" y="315" text-anchor="middle" class="rule">Sum/Difference Rule</text>
  <text x="300" y="330" text-anchor="middle" class="rule" font-size="12">d/dx (u±v) = u' ± v'</text>

  <!-- Arrows from central box to each rule -->
  <line x1="300" y1="80" x2="155" y2="130" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="80" x2="445" y2="130" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="80" x2="155" y2="210" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="80" x2="445" y2="210" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="80" x2="300" y2="290" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
</svg>