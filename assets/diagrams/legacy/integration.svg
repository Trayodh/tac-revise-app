<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#000"/>
    </marker>
    <style>
      .box { stroke:#000; stroke-width:1; }
      .label { font-family:sans-serif; font-size:14px; fill:#000; dominant-baseline:middle; text-anchor:middle; }
      .title { font-family:sans-serif; font-size:16px; fill:#fff; dominant-baseline:middle; text-anchor:middle; }
    </style>
  </defs>

  <!-- Central node -->
  <rect x="200" y="150" width="200" height="60" fill="#4A90E2" class="box"/>
  <text x="300" y="180" class="title">Standard Integration Methods</text>

  <!-- Substitution -->
  <rect x="50" y="80" width="150" height="50" fill="#7ED321" class="box"/>
  <text x="125" y="105" class="label">Substitution</text>

  <!-- Integration by Parts -->
  <rect x="400" y="80" width="150" height="50" fill="#F5A623" class="box"/>
  <text x="475" y="105" class="label">Integration by Parts</text>

  <!-- Partial Fractions -->
  <rect x="50" y="300" width="150" height="50" fill="#BD10E0" class="box"/>
  <text x="125" y="325" class="label">Partial Fractions</text>

  <!-- Numerical Integration -->
  <rect x="400" y="300" width="150" height="50" fill="#D0021B" class="box"/>
  <text x="475" y="325" class="label">Numerical Integration</text>

  <!-- Trigonometric Substitution -->
  <rect x="50" y="190" width="150" height="50" fill="#50E3C2" class="box"/>
  <text x="125" y="215" class="label">Trigonometric Substitution</text>

  <!-- Arrows -->
  <path d="M300,180 L125,105" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M300,180 L475,105" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M300,180 L125,325" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M300,180 L475,325" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M300,180 L125,215" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
</svg>