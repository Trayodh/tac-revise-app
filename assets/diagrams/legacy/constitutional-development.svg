<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="300" y="40" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#333333" text-anchor="middle">Constitutional Development</text>
  
  <!-- Timeline line -->
  <line x1="50" y1="200" x2="550" y2="200" stroke="#555555" stroke-width="4"/>
  
  <!-- Event markers -->
  <circle cx="100" cy="200" r="12" fill="#4a90e2"/>
  <circle cx="200" cy="200" r="12" fill="#4a90e2"/>
  <circle cx="300" cy="200" r="12" fill="#4a90e2"/>
  <circle cx="400" cy="200" r="12" fill="#4a90e2"/>
  <circle cx="500" cy="200" r="12" fill="#4a90e2"/>
  
  <!-- Connecting lines for labels -->
  <line x1="100" y1="200" x2="100" y2="150" stroke="#555555" stroke-width="2"/>
  <line x1="200" y1="200" x2="200" y2="150" stroke="#555555" stroke-width="2"/>
  <line x1="300" y1="200" x2="300" y2="150" stroke="#555555" stroke-width="2"/>
  <line x1="400" y1="200" x2="400" y2="250" stroke="#555555" stroke-width="2"/>
  <line x1="500" y1="200" x2="500" y2="250" stroke="#555555" stroke-width="2"/>
  
  <!-- Labels -->
  <text x="100" y="130" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#222222" text-anchor="middle">Magna Carta (1215)</text>
  <text x="200" y="130" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#222222" text-anchor="middle">English Bill of Rights (1689)</text>
  <text x="300" y="130" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#222222" text-anchor="middle">U.S. Constitution (1787)</text>
  <text x="400" y="280" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#222222" text-anchor="middle">French Constitution (1791)</text>
  <text x="500" y="280" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#222222" text-anchor="middle">Indian Constitution (1950)</text>
  
  <!-- Optional subtle background grid -->
  <g opacity="0.1">
    <line x1="50" y1="0" x2="50" y2="400" stroke="#000000"/>
    <line x1="150" y1="0" x2="150" y2="400" stroke="#000000"/>
    <line x1="250" y1="0" x2="250" y2="400" stroke="#000000"/>
    <line x1="350" y1="0" x2="350" y2="400" stroke="#000000"/>
    <line x1="450" y1="0" x2="450" y2="400" stroke="#000000"/>
    <line x1="550" y1="0" x2="550" y2="400" stroke="#000000"/>
  </g>
</svg>