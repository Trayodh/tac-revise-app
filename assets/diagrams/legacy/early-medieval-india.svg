<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#333333">Early Medieval India (c. 6th–12th Century)</text>
  
  <!-- Timeline -->
  <line x1="100" y1="60" x2="500" y2="60" stroke="#777777" stroke-width="2"/>
  <text x="100" y="78" font-family="sans-serif" font-size="12" fill="#555555">600 CE</text>
  <text x="300" y="78" font-family="sans-serif" font-size="12" fill="#555555">800 CE</text>
  <text x="500" y="78" font-family="sans-serif" font-size="12" fill="#555555">1000 CE</text>
  
  <!-- Simplified map outline of India -->
  <path d="M150,50 L250,30 L350,50 L380,120 L350,200 L300,250 L250,260 L200,250 L150,200 L120,120 Z"
        fill="#f0f0f0" stroke="#555555" stroke-width="1"/>
  
  <!-- Dynastic circles -->
  <circle cx="250" cy="100" r="12" fill="#ff6666"/>
  <circle cx="300" cy="180" r="12" fill="#66ccff"/>
  <circle cx="200" cy="180" r="12" fill="#ffcc66"/>
  <circle cx="150" cy="130" r="12" fill="#99ff99"/>
  <circle cx="350" cy="260" r="12" fill="#ff99ff"/>
  <circle cx="320" cy="230" r="12" fill="#cccc66"/>
  
  <!-- Labels with leader lines -->
  <g font-family="sans-serif" font-size="12" fill="#333333">
    <!-- Harsha -->
    <line x1="250" y1="100" x2="380" y2="40" stroke="#555555" stroke-width="1"/>
    <text x="390" y="45" text-anchor="start">Harsha Empire (c. 606–647)</text>
    
    <!-- Pala -->
    <line x1="300" y1="180" x2="460" y2="150" stroke="#555555" stroke-width="1"/>
    <text x="470" y="155" text-anchor="start">Pala Dynasty (8th–12th c.)</text>
    
    <!-- Rashtrakuta -->
    <line x1="200" y1="180" x2="40" y2="150" stroke="#555555" stroke-width="1"/>
    <text x="30" y="155" text-anchor="end">Rashtrakuta (8th–10th c.)</text>
    
    <!-- Pratihara -->
    <line x1="150" y1="130" x2="40" y2="80" stroke="#555555" stroke-width="1"/>
    <text x="30" y="85" text-anchor="end">Pratihara (8th–11th c.)</text>
    
    <!-- Chola -->
    <line x1="350" y1="260" x2="540" y2="300" stroke="#555555" stroke-width="1"/>
    <text x="550" y="305" text-anchor="start">Chola (9th–13th c.)</text>
    
    <!-- Pallava -->
    <line x1="320" y1="230" x2="540" y2="250" stroke="#555555" stroke-width="1"/>
    <text x="550" y="255" text-anchor="start">Pallava (6th–9th c.)</text>
  </g>
</svg>