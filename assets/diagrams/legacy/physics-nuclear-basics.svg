<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0,10 3.5,0 7" fill="#333"/>
    </marker>
    <style>
      .label {font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#333;}
    </style>
  </defs>

  <!-- Electron cloud -->
  <ellipse cx="300" cy="200" rx="200" ry="120" fill="#e0e0e0" opacity="0.5"/>

  <!-- Nucleus -->
  <circle cx="300" cy="200" r="80" fill="#555"/>

  <!-- Protons -->
  <g fill="#d32f2f">
    <circle cx="280" cy="190" r="12"/>
    <circle cx="320" cy="190" r="12"/>
    <circle cx="300" cy="215" r="12"/>
    <circle cx="285" cy="225" r="12"/>
    <circle cx="315" cy="225" r="12"/>
  </g>

  <!-- Neutrons -->
  <g fill="#1976d2">
    <circle cx="300" cy="170" r="12"/>
    <circle cx="260" cy="200" r="12"/>
    <circle cx="340" cy="200" r="12"/>
    <circle cx="280" cy="240" r="12"/>
    <circle cx="320" cy="240" r="12"/>
  </g>

  <!-- Alpha decay arrow -->
  <path d="M300,200 C250,150 180,120 130,80" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="120" y="70" class="label">α (He nucleus)</text>

  <!-- Beta decay arrow -->
  <path d="M300,200 C350,180 420,190 470,150" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="480" y="150" class="label">β (electron)</text>

  <!-- Gamma decay arrow -->
  <path d="M300,200 C300,260 300,340 300,380" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="310" y="380" class="label">γ (photon)</text>

  <!-- Labels for nucleus components -->
  <text x="300" y="120" text-anchor="middle" class="label">Nucleus</text>
  <text x="200" y="340" class="label">Electron Cloud</text>

  <!-- Legend -->
  <rect x="460" y="260" width="130" height="100" fill="#fafafa" stroke="#ccc"/>
  <circle cx="475" cy="285" r="8" fill="#d32f2f"/>
  <text x="490" y="290" class="label">Proton</text>
  <circle cx="475" cy="315" r="8" fill="#1976d2"/>
  <text x="490" y="320" class="label">Neutron</text>
  <circle cx="475" cy="345" r="8" fill="#555"/>
  <text x="490" y="350" class="label">Nucleus (overall)</text>
</svg>