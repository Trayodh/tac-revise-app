<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#ffffff"/>
  <!-- Unit circle -->
  <circle cx="200" cy="200" r="100" fill="none" stroke="#4A90E2" stroke-width="2"/>
  <!-- Point on circle (θ = 45°) -->
  <circle cx="270.71" cy="129.29" r="4" fill="#D0021B"/>
  <!-- Radius line -->
  <line x1="200" y1="200" x2="270.71" y2="129.29" stroke="#4A90E2" stroke-width="2"/>
  <!-- Horizontal projection (cosθ) -->
  <line x1="270.71" y1="129.29" x2="270.71" y2="200" stroke="#7ED321" stroke-width="2"/>
  <!-- Vertical projection (sinθ) -->
  <line x1="270.71" y1="200" x2="200" y2="200" stroke="#7ED321" stroke-width="2"/>
  <!-- Angle arc (θ) -->
  <path d="M200,200 L230,200 A30,30 0 0,1 230,170 L200,200 Z" fill="#F5A623" opacity="0.6"/>
  <!-- Labels for sides -->
  <text x="285" y="165" fill="#000000" font-family="Arial" font-size="14">sin θ = y</text>
  <text x="215" y="215" fill="#000000" font-family="Arial" font-size="14">cos θ = x</text>
  <text x="250" y="230" fill="#000000" font-family="Arial" font-size="14">tan θ = y/x</text>
  <!-- Angle label -->
  <text x="210" y="170" fill="#000000" font-family="Arial" font-size="16">θ = arcsin(y) = arccos(x) = arctan(y/x)</text>
  <!-- Arrow markers for clarity -->
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 Z" fill="#000000"/>
    </marker>
  </defs>
  <!-- Arrow from angle arc to label -->
  <line x1="230" y1="170" x2="210" y2="170" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
</svg>