<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Central President circle -->
  <circle cx="300" cy="200" r="50" fill="#2E86C1" stroke="#1B4F72" stroke-width="2"/>
  <text x="300" y="200" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14" fill="#FFFFFF">President of India</text>
  
  <!-- Boxes -->
  <rect x="100" y="50" width="150" height="60" fill="#E5E7E9" stroke="#555555" stroke-width="1"/>
  <text x="175" y="80" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333333">Election (Art 54)</text>
  
  <rect x="350" y="50" width="150" height="60" fill="#E5E7E9" stroke="#555555" stroke-width="1"/>
  <text x="425" y="80" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333333">Term (5 yrs) (Art 58)</text>
  
  <rect x="420" y="150" width="150" height="60" fill="#E5E7E9" stroke="#555555" stroke-width="1"/>
  <text x="495" y="180" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333333">Powers (Art 53)</text>
  
  <rect x="350" y="300" width="150" height="60" fill="#E5E7E9" stroke="#555555" stroke-width="1"/>
  <text x="425" y="330" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333333">Removal (Art 61)</text>
  
  <rect x="100" y="300" width="150" height="60" fill="#E5E7E9" stroke="#555555" stroke-width="1"/>
  <text x="175" y="330" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333333">Succession (Art 60)</text>
  
  <rect x="30" y="150" width="150" height="60" fill="#E5E7E9" stroke="#555555" stroke-width="1"/>
  <text x="105" y="180" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333333">Oath (Art 56)</text>
  
  <!-- Connecting lines -->
  <path d="M150,110 L300,150" stroke="#555555" stroke-width="1"/>
  <path d="M425,110 L300,150" stroke="#555555" stroke-width="1"/>
  <path d="M495,210 L350,210" stroke="#555555" stroke-width="1"/>
  <path d="M425,360 L300,250" stroke="#555555" stroke-width="1"/>
  <path d="M175,360 L300,250" stroke="#555555" stroke-width="1"/>
  <path d="M105,210 L250,150" stroke="#555555" stroke-width="1"/>
</svg>