<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#F5F5F5"/>
  
  <!-- Europe -->
  <rect x="50" y="150" width="120" height="80" fill="#4A90E2"/>
  <text x="110" y="140" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Europe</text>
  
  <!-- The Americas -->
  <rect x="430" y="130" width="120" height="140" fill="#7ED321"/>
  <text x="490" y="120" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">The Americas</text>
  
  <!-- Ship -->
  <g id="ship">
    <!-- Hull -->
    <rect x="140" y="185" width="20" height="10" fill="#8B4513"/>
    <!-- Sail -->
    <polygon points="150,185 150,165 165,185" fill="#FFFFFF"/>
  </g>
  <text x="150" y="210" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Ship</text>
  
  <!-- Arrow indicating voyage -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="red"/>
    </marker>
  </defs>
  <line x1="160" y1="190" x2="430" y2="200" stroke="red" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="300" y="180" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">1492</text>
  
  <!-- Simple compass rose -->
  <g id="compass" transform="translate(540,30)">
    <circle cx="0" cy="0" r="20" fill="#FFFFFF" stroke="#333" stroke-width="1"/>
    <text x="0" y="-5" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">N</text>
    <text x="0" y="15" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">S</text>
    <text x="-12" y="5" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">W</text>
    <text x="12" y="5" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">E</text>
  </g>
</svg>