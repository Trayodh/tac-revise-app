<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#FFFFFF"/>
  <!-- Timeline -->
  <line x1="50" y1="200" x2="550" y2="200" stroke="#333333" stroke-width="2"/>
  <!-- Ancient (Pyramid) -->
  <polygon points="80,180 70,220 90,220" fill="#C2B280"/>
  <text x="80" y="130" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#000000" text-anchor="middle">Ancient</text>
  <line x1="80" y1="140" x2="80" y2="180" stroke="#000000" stroke-width="1"/>
  <!-- Classical (Greek Column) -->
  <rect x="140" y="170" width="20" height="30" fill="#D3D3D3"/>
  <rect x="140" y="165" width="20" height="5" fill="#A9A9A9"/>
  <text x="150" y="130" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#000000" text-anchor="middle">Classical</text>
  <line x1="150" y1="140" x2="150" y2="165" stroke="#000000" stroke-width="1"/>
  <!-- Roman (Arch) -->
  <path d="M205,210 L205,190 A15,15 0 0 1 235,190 L235,210 Z" fill="#A9A9A9"/>
  <text x="220" y="130" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#000000" text-anchor="middle">Roman</text>
  <line x1="220" y1="140" x2="220" y2="190" stroke="#000000" stroke-width="1"/>
  <!-- Gothic (Pointed Arch) -->
  <path d="M275,210 L275,190 L290,170 L305,190 L305,210 Z" fill="#708090"/>
  <text x="290" y="130" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#000000" text-anchor="middle">Gothic</text>
  <line x1="290" y1="140" x2="290" y2="170" stroke="#000000" stroke-width="1"/>
  <!-- Renaissance (Dome) -->
  <path d="M345,210 L345,190 A15,15 0 0 1 375,190 L375,210 Z" fill="#5F9EA0"/>
  <text x="360" y="130" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#000000" text-anchor="middle">Renaissance</text>
  <line x1="360" y1="140" x2="360" y2="190" stroke="#000000" stroke-width="1"/>
  <!-- Baroque (Curved Façade) -->
  <path d="M415,210 C415,180 445,180 445,210 L445,210 L415,210 Z" fill="#FFB6C1"/>
  <text x="430" y="130" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#000000" text-anchor="middle">Baroque</text>
  <line x1="430" y1="140" x2="430" y2="180" stroke="#000000" stroke-width="1"/>
  <!-- Modern (Skyscraper) -->
  <rect x="490" y="150" width="20" height="60" fill="#4682B4"/>
  <rect x="495" y="160" width="5" height="5" fill="#FFFFFF"/>
  <rect x="495" y="170" width="5" height="5" fill="#FFFFFF"/>
  <rect x="495" y="180" width="5" height="5" fill="#FFFFFF"/>
  <rect x="495" y="190" width="5" height="5" fill="#FFFFFF"/>
  <text x="500" y="130" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#000000" text-anchor="middle">Modern</text>
  <line x1="500" y1="140" x2="500" y2="150" stroke="#000000" stroke-width="1"/>
</svg>