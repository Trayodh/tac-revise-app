<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Central rectangle representing Religion -->
  <rect x="200" y="160" width="200" height="80" fill="#4A90E2" rx="8"/>
  <text x="300" y="210" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">Religion</text>
  
  <!-- Connections -->
  <line x1="300" y1="160" x2="300" y2="130" stroke="#999999" stroke-width="2"/>
  <line x1="300" y1="240" x2="300" y2="270" stroke="#999999" stroke-width="2"/>
  <line x1="400" y1="200" x2="450" y2="200" stroke="#999999" stroke-width="2"/>
  <line x1="200" y1="200" x2="150" y2="200" stroke="#999999" stroke-width="2"/>
  
  <!-- Top circle: Candle -->
  <circle cx="300" cy="80" r="50" fill="#7ED321"/>
  <!-- Candle body -->
  <rect x="285" y="100" width="30" height="40" fill="#F5A623"/>
  <!-- Candle flame -->
  <path d="M300 95 C298 90, 302 90, 300 95 Z" fill="#FF6F61"/>
  <!-- Label -->
  <text x="300" y="30" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#333333" text-anchor="middle">Festival: Candle (Diwali)</text>
  
  <!-- Right circle: Lantern -->
  <circle cx="500" cy="200" r="50" fill="#7ED321"/>
  <!-- Lantern shape -->
  <ellipse cx="500" cy="200" rx="20" ry="30" fill="#FFCC00"/>
  <line x1="500" y1="170" x2="500" y2="230" stroke="#D0021B" stroke-width="4"/>
  <line x1="485" y1="185" x2="515" y2="215" stroke="#D0021B" stroke-width="4"/>
  <line x1="515" y1="185" x2="485" y2="215" stroke="#D0021B" stroke-width="4"/>
  <!-- Label -->
  <text x="560" y="200" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#333333" text-anchor="start" dominant-baseline="middle">Festival: Lantern (Mid‑Autumn)</text>
  
  <!-- Bottom circle: Drum -->
  <circle cx="300" cy="320" r="50" fill="#7ED321"/>
  <!-- Drum body -->
  <ellipse cx="300" cy="320" rx="25" ry="15" fill="#D0021B"/>
  <line x1="275" y1="320" x2="325" y2="320" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="285" y1="310" x2="315" y2="330" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="315" y1="310" x2="285" y2="330" stroke="#FFFFFF" stroke-width="2"/>
  <!-- Label -->
  <text x="300" y="380" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#333333" text-anchor="middle">Festival: Drum (Eid)</text>
  
  <!-- Left circle: Flower -->
  <circle cx="100" cy="200" r="50" fill="#7ED321"/>
  <!-- Simple flower petals -->
  <path d="M100 150 L110 170 L130 170 L115 185 L120 205 L100 195 L80 205 L85 185 L70 170 L90 170 Z" fill="#FF6F61"/>
  <!-- Center of flower -->
  <circle cx="100" cy="200" r="10" fill="#F8E71C"/>
  <!-- Label -->
  <text x="40" y="200" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#333333" text-anchor="end" dominant-baseline="middle">Festival: Flower (Holi)</text>
</svg>