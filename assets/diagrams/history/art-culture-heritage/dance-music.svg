<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#f9f9f9"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#777"/>
    </marker>
  </defs>
  <!-- Title -->
  <text x="300" y="40" font-family="Arial,Helvetica,sans-serif" font-size="24" text-anchor="middle" fill="#333">Dance &amp; Music</text>
  <!-- Timeline -->
  <line x1="100" y1="200" x2="500" y2="200" stroke="#777" stroke-width="2"/>
  <!-- Music note -->
  <g id="music-note">
    <circle cx="200" cy="200" r="12" fill="#4A90E2"/>
    <line x1="200" y1="200" x2="200" y2="150" stroke="#4A90E2" stroke-width="4"/>
    <path d="M200,150 q5,-10 15,-5" fill="none" stroke="#4A90E2" stroke-width="4"/>
  </g>
  <!-- Dancer -->
  <g id="dancer">
    <circle cx="400" cy="200" r="12" fill="#F5A623"/>
    <line x1="400" y1="212" x2="400" y2="250" stroke="#F5A623" stroke-width="4"/>
    <line x1="400" y1="230" x2="380" y2="230" stroke="#F5A623" stroke-width="4"/>
    <line x1="400" y1="230" x2="420" y2="230" stroke="#F5A623" stroke-width="4"/>
    <line x1="400" y1="250" x2="380" y2="280" stroke="#F5A623" stroke-width="4"/>
    <line x1="400" y1="250" x2="420" y2="280" stroke="#F5A623" stroke-width="4"/>
  </g>
  <!-- Arrows showing exchange -->
  <path d="M220,180 C260,120 340,120 380,180" fill="none" stroke="#777" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M380,220 C340,280 260,280 220,220" fill="none" stroke="#777" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Labels -->
  <text x="200" y="130" font-family="Arial,Helvetica,sans-serif" font-size="16" text-anchor="middle" fill="#333">Music</text>
  <text x="400" y="130" font-family="Arial,Helvetica,sans-serif" font-size="16" text-anchor="middle" fill="#333">Dance</text>
  <text x="300" y="250" font-family="Arial,Helvetica,sans-serif" font-size="14" text-anchor="middle" fill="#555">Cultural exchange</text>
</svg>