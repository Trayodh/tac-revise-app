<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#f9f9f9"/>
  <text x="300" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#333">History of Paintings</text>
  <line x1="50" y1="200" x2="550" y2="200" stroke="#666" stroke-width="2"/>
  <!-- Prehistoric -->
  <circle cx="100" cy="200" r="8" fill="#ff6f61"/>
  <rect x="85" y="130" width="30" height="20" fill="#fff" stroke="#999" stroke-width="1"/>
  <line x1="100" y1="200" x2="100" y2="150" stroke="#666" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="100" y1="150" x2="100" y2="130" stroke="#666" stroke-width="1"/>
  <line x1="85" y1="140" x2="115" y2="140" stroke="#666" stroke-width="1"/>
  <text x="100" y="110" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">
    <tspan x="100" dy="0">Prehistoric</tspan>
    <tspan x="100" dy="16">Cave Paintings</tspan>
  </text>
  <!-- Ancient Egypt -->
  <circle cx="170" cy="200" r="8" fill="#ffb400"/>
  <rect x="155" y="130" width="30" height="20" fill="#fff" stroke="#999" stroke-width="1"/>
  <line x1="170" y1="200" x2="170" y2="150" stroke="#666" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="170" y1="150" x2="170" y2="130" stroke="#666" stroke-width="1"/>
  <line x1="155" y1="140" x2="185" y2="140" stroke="#666" stroke-width="1"/>
  <text x="170" y="110" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">
    <tspan x="170" dy="0">Ancient Egypt</tspan>
    <tspan x="170" dy="16">Murals</tspan>
  </text>
  <!-- Classical Greece -->
  <circle cx="240" cy="200" r="8" fill="#6b5b95"/>
  <rect x="225" y="130" width="30" height="20" fill="#fff" stroke="#999" stroke-width="1"/>
  <line x1="240" y1="200" x2="240" y2="150" stroke="#666" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="240" y1="150" x2="240" y2="130" stroke="#666" stroke-width="1"/>
  <line x1="225" y1="140" x2="255" y2="140" stroke="#666" stroke-width="1"/>
  <text x="240" y="110" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">
    <tspan x="240" dy="0">Classical Greece</tspan>
    <tspan x="240" dy="16">Vase Paintings</tspan>
  </text>
  <!-- Medieval -->
  <circle cx="310" cy="200" r="8" fill="#88b04b"/>
  <rect x="295" y="210" width="30" height="20" fill="#fff" stroke="#999" stroke-width="1"/>
  <line x1="310" y1="200" x2="310" y2="210" stroke="#666" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="295" y1="220" x2="325" y2="220" stroke="#666" stroke-width="1"/>
  <text x="310" y="260" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">
    <tspan x="310" dy="0">Medieval</tspan>
    <tspan x="310" dy="16">Illuminated</tspan>
    <tspan x="310" dy="16">Manuscripts</tspan>
  </text>
  <!-- Renaissance -->
  <circle cx="380" cy="200" r="8" fill="#00a9e0"/>
  <rect x="365" y="130" width="30" height="20" fill="#fff" stroke="#999" stroke-width="1"/>
  <line x1="380" y1="200" x2="380" y2="150" stroke="#666" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="380" y1="150" x2="380" y2="130" stroke="#666" stroke-width="1"/>
  <line x1="365" y1="140" x2="395" y2="140" stroke="#666" stroke-width="1"/>
  <text x="380" y="110" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">
    <tspan x="380" dy="0">Renaissance</tspan>
    <tspan x="380" dy="16">Oil Paintings</tspan>
  </text>
  <!-- Baroque -->
  <circle cx="450" cy="200" r="8" fill="#f7cac9"/>
  <rect x="435" y="210" width="30" height="20" fill="#fff" stroke="#999" stroke-width="1"/>
  <line x1="450" y1="200" x2="450" y2="210" stroke="#666" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="435" y1="220" x2="465" y2="220" stroke="#666" stroke-width="1"/>
  <text x="450" y="260" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">
    <tspan x="450" dy="0">Baroque</tspan>
    <tspan x="450" dy="16">Dramatic</tspan>
    <tspan x="450" dy="16">Scenes</tspan>
  </text>
  <!-- Modern -->
  <circle cx="520" cy="200" r="8" fill="#92a8d1"/>
  <rect x="505" y="130" width="30" height="20" fill="#fff" stroke="#999" stroke-width="1"/>
  <line x1="520" y1="200" x2="520" y2="150" stroke="#666" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="520" y1="150" x2="520" y2="130" stroke="#666" stroke-width="1"/>
  <line x1="505" y1="140" x2="535" y2="140" stroke="#666" stroke-width="1"/>
  <text x="520" y="110" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">
    <tspan x="520" dy="0">Modern</tspan>
    <tspan x="520" dy="16">Impressionism &amp; Beyond</tspan>
  </text>
</svg>