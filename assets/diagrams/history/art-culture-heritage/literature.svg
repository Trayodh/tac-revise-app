<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Timeline line -->
  <line x1="50" y1="200" x2="550" y2="200" stroke="#333" stroke-width="2"/>
  
  <!-- Oral Tradition -->
  <circle cx="100" cy="200" r="12" fill="#4A90E2" stroke="#000" stroke-width="1"/>
  <line x1="100" y1="200" x2="100" y2="170" stroke="#333" stroke-width="1"/>
  <text x="100" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#000">Oral Tradition<br/>c. 30,000 BCE</text>
  
  <!-- Cuneiform -->
  <circle cx="200" cy="200" r="12" fill="#50E3C2" stroke="#000" stroke-width="1"/>
  <line x1="200" y1="200" x2="200" y2="170" stroke="#333" stroke-width="1"/>
  <text x="200" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#000">Cuneiform<br/>c. 3200 BCE</text>
  
  <!-- Papyrus Scrolls -->
  <circle cx="300" cy="200" r="12" fill="#F5A623" stroke="#000" stroke-width="1"/>
  <line x1="300" y1="200" x2="300" y2="170" stroke="#333" stroke-width="1"/>
  <text x="300" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#000">Papyrus Scrolls<br/>c. 2500 BCE</text>
  
  <!-- Codex -->
  <circle cx="400" cy="200" r="12" fill="#D0021B" stroke="#000" stroke-width="1"/>
  <line x1="400" y1="200" x2="400" y2="170" stroke="#333" stroke-width="1"/>
  <text x="400" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#000">Codex<br/>c. 1st CE</text>
  
  <!-- Printing Press -->
  <circle cx="500" cy="200" r="12" fill="#9013FE" stroke="#000" stroke-width="1"/>
  <line x1="500" y1="200" x2="500" y2="170" stroke="#333" stroke-width="1"/>
  <text x="500" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#000">Printing Press<br/>1450 CE</text>
  
  <!-- Digital Era -->
  <circle cx="550" cy="200" r="12" fill="#8B572A" stroke="#000" stroke-width="1"/>
  <line x1="550" y1="200" x2="550" y2="170" stroke="#333" stroke-width="1"/>
  <text x="540" y="140" text-anchor="end" font-family="sans-serif" font-size="12" fill="#000">Digital Era<br/>1990s</text>
</svg>