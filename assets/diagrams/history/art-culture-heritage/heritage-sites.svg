<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#f5f5f5"/>
  
  <!-- Title -->
  <text x="300" y="40" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#333" text-anchor="middle">Heritage Sites</text>
  
  <!-- Earth (simplified) -->
  <circle cx="300" cy="200" r="120" fill="#4a90e2"/>
  
  <!-- Site markers -->
  <circle cx="180" cy="200" r="6" fill="#fff" stroke="#333" stroke-width="1"/>
  <circle cx="300" cy="80" r="6" fill="#fff" stroke="#333" stroke-width="1"/>
  <circle cx="420" cy="200" r="6" fill="#fff" stroke="#333" stroke-width="1"/>
  
  <!-- Column (Cultural – Historic) -->
  <rect x="150" y="200" width="30" height="80" fill="#d4a017"/>
  <rect x="150" y="190" width="30" height="10" fill="#b8860b"/>
  <!-- Leader line -->
  <line x1="180" y1="200" x2="165" y2="200" stroke="#333" stroke-width="1"/>
  <!-- Label -->
  <text x="130" y="210" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333">Cultural – Historic</text>
  
  <!-- Pagoda (Cultural – Architectural) -->
  <polygon points="280,20 300,0 320,20 315,20 315,60 285,60 285,20" fill="#c0392b"/>
  <!-- Leader line -->
  <line x1="300" y1="80" x2="300" y2="60" stroke="#333" stroke-width="1"/>
  <!-- Label -->
  <text x="300" y="95" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333" text-anchor="middle">Cultural – Architectural</text>
  
  <!-- Tree (Natural – Landscape) -->
  <rect x="440" y="230" width="10" height="30" fill="#8b5a2b"/>
  <circle cx="445" cy="220" r="20" fill="#27ae60"/>
  <!-- Leader line -->
  <line x1="420" y1="200" x2="440" y2="230" stroke="#333" stroke-width="1"/>
  <!-- Label -->
  <text x="460" y="250" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333">Natural – Landscape</text>
  
  <!-- Legend background -->
  <rect x="10" y="350" width="580" height="40" fill="#e0e0e0"/>
  <!-- Legend items -->
  <circle cx="30" cy="370" r="6" fill="#fff" stroke="#333" stroke-width="1"/>
  <text x="50" y="375" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#333">World Heritage Site</text>
  <rect x="250" y="360" width="20" height="20" fill="#4a90e2"/>
  <text x="280" y="375" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#333">Earth (global context)</text>
</svg>