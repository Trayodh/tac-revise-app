<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="300" y="40" font-family="sans-serif" font-size="24" fill="#333333" text-anchor="middle">Bhakti Movement</text>
  
  <!-- Timeline -->
  <rect x="80" y="198" width="440" height="4" fill="#555555"/>
  
  <!-- Century markers -->
  <g stroke="#555555" stroke-width="1">
    <line x1="120" y1="190" x2="120" y2="206"/>
    <line x1="180" y1="190" x2="180" y2="206"/>
    <line x1="240" y1="190" x2="240" y2="206"/>
    <line x1="300" y1="190" x2="300" y2="206"/>
    <line x1="360" y1="190" x2="360" y2="206"/>
    <line x1="420" y1="190" x2="420" y2="206"/>
    <line x1="480" y1="190" x2="480" y2="206"/>
  </g>
  <g font-family="sans-serif" font-size="12" fill="#333333" text-anchor="middle">
    <text x="120" y="225">8th C</text>
    <text x="180" y="225">9th C</text>
    <text x="240" y="225">10th C</text>
    <text x="300" y="225">11th C</text>
    <text x="360" y="225">12th C</text>
    <text x="420" y="225">13th C</text>
    <text x="480" y="225">14th C</text>
  </g>
  
  <!-- Saints and connections -->
  <!-- Alvars (South India) -->
  <circle cx="120" cy="150" r="20" fill="#ff6f61"/>
  <line x1="120" y1="170" x2="120" y2="198" stroke="#555555" stroke-width="1"/>
  <text x="120" y="130" font-family="sans-serif" font-size="14" fill="#333333" text-anchor="middle">Alvars</text>
  
  <!-- Nayanars (South India) -->
  <circle cx="180" cy="150" r="20" fill="#6a5acd"/>
  <line x1="180" y1="170" x2="180" y2="198" stroke="#555555" stroke-width="1"/>
  <text x="180" y="130" font-family="sans-serif" font-size="14" fill="#333333" text-anchor="middle">Nayanars</text>
  
  <!-- Ramanuja (Philosopher) -->
  <circle cx="240" cy="150" r="20" fill="#2ca02c"/>
  <line x1="240" y1="170" x2="240" y2="198" stroke="#555555" stroke-width="1"/>
  <text x="240" y="130" font-family="sans-serif" font-size="14" fill="#333333" text-anchor="middle">Ramanuja</text>
  
  <!-- Kabir (North India) -->
  <circle cx="340" cy="250" r="20" fill="#ffb400"/>
  <line x1="340" y1="230" x2="340" y2="202" stroke="#555555" stroke-width="1"/>
  <text x="340" y="280" font-family="sans-serif" font-size="14" fill="#333333" text-anchor="middle">Kabir</text>
  
  <!-- Mirabai (North India) -->
  <circle cx="400" cy="250" r="20" fill="#1f77b4"/>
  <line x1="400" y1="230" x2="400" y2="202" stroke="#555555" stroke-width="1"/>
  <text x="400" y="280" font-family="sans-serif" font-size="14" fill="#333333" text-anchor="middle">Mirabai</text>
  
  <!-- Guru Nanak (Later influence) -->
  <circle cx="460" cy="250" r="20" fill="#d62728"/>
  <line x1="460" y1="230" x2="460" y2="202" stroke="#555555" stroke-width="1"/>
  <text x="460" y="280" font-family="sans-serif" font-size="14" fill="#333333" text-anchor="middle">Guru Nanak</text>
  
  <!-- Legend -->
  <rect x="460" y="10" width="130" height="80" fill="#f0f0f0" stroke="#cccccc"/>
  <text x="525" y="30" font-family="sans-serif" font-size="12" fill="#333333" text-anchor="middle">Key Figures</text>
  <g font-family="sans-serif" font-size="12" fill="#333333">
    <circle cx="470" cy="50" r="6" fill="#ff6f61"/>
    <text x="485" y="55">Alvars</text>
    <circle cx="470" cy="70" r="6" fill="#6a5acd"/>
    <text x="485" y="75">Nayanars</text>
    <circle cx="470" cy="90" r="6" fill="#2ca02c"/>
    <text x="485" y="95">Ramanuja</text>
    <circle cx="470" cy="110" r="6" fill="#ffb400"/>
    <text x="485" y="115">Kabir</text>
    <circle cx="470" cy="130" r="6" fill="#1f77b4"/>
    <text x="485" y="135">Mirabai</text>
    <circle cx="470" cy="150" r="6" fill="#d62728"/>
    <text x="485" y="155">Guru Nanak</text>
  </g>
</svg>