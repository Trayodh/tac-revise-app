<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#f5f5f5"/>
  <!-- Title -->
  <text x="300" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#333">Delhi Sultanate Timeline</text>
  <!-- Central timeline line -->
  <line x1="300" y1="80" x2="300" y2="340" stroke="#555" stroke-width="2"/>
  <!-- Mamluk Dynasty -->
  <circle cx="300" cy="100" r="5" fill="#555"/>
  <line x1="300" y1="100" x2="320" y2="100" stroke="#555" stroke-width="1"/>
  <rect x="320" y="80" width="200" height="40" fill="#ff9999" rx="5"/>
  <text x="330" y="105" font-family="sans-serif" font-size="14" fill="#000">Mamluk (Slave) Dynasty (1206–1290)</text>
  <!-- Khilji Dynasty -->
  <circle cx="300" cy="160" r="5" fill="#555"/>
  <line x1="300" y1="160" x2="320" y2="160" stroke="#555" stroke-width="1"/>
  <rect x="320" y="140" width="200" height="40" fill="#ffcc66" rx="5"/>
  <text x="330" y="165" font-family="sans-serif" font-size="14" fill="#000">Khilji Dynasty (1290–1320)</text>
  <!-- Tughlaq Dynasty -->
  <circle cx="300" cy="220" r="5" fill="#555"/>
  <line x1="300" y1="220" x2="320" y2="220" stroke="#555" stroke-width="1"/>
  <rect x="320" y="200" width="200" height="40" fill="#99ccff" rx="5"/>
  <text x="330" y="225" font-family="sans-serif" font-size="14" fill="#000">Tughlaq Dynasty (1320–1414)</text>
  <!-- Sayyid Dynasty -->
  <circle cx="300" cy="280" r="5" fill="#555"/>
  <line x1="300" y1="280" x2="320" y2="280" stroke="#555" stroke-width="1"/>
  <rect x="320" y="260" width="200" height="40" fill="#99ff99" rx="5"/>
  <text x="330" y="285" font-family="sans-serif" font-size="14" fill="#000">Sayyid Dynasty (1414–1451)</text>
  <!-- Lodi Dynasty -->
  <circle cx="300" cy="340" r="5" fill="#555"/>
  <line x1="300" y1="340" x2="320" y2="340" stroke="#555" stroke-width="1"/>
  <rect x="320" y="320" width="200" height="40" fill="#cc99ff" rx="5"/>
  <text x="330" y="345" font-family="sans-serif" font-size="14" fill="#000">Lodi Dynasty (1451–1526)</text>
</svg>