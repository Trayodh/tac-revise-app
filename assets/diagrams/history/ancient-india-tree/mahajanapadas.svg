<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f9f9f9"/>
  <!-- Title -->
  <text x="300" y="40" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#333">Mahajanapadas (c. 6th–4th century BCE)</text>
  <!-- Grid of Mahajanapadas -->
  <g font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#fff">
    <!-- Row 1 -->
    <rect x="50" y="80" width="130" height="80" fill="#4a90e2"/>
    <text x="115" y="115" text-anchor="middle" fill="#fff">Anga</text>
    <rect x="200" y="80" width="130" height="80" fill="#50e3c2"/>
    <text x="265" y="115" text-anchor="middle" fill="#fff">Magadha</text>
    <rect x="350" y="80" width="130" height="80" fill="#f5a623"/>
    <text x="415" y="115" text-anchor="middle" fill="#fff">Vatsa</text>
    <rect x="500" y="80" width="80" height="80" fill="#d0021b"/>
    <text x="540" y="115" text-anchor="middle" fill="#fff">Kashi</text>
    <!-- Row 2 -->
    <rect x="50" y="180" width="130" height="80" fill="#7ed321"/>
    <text x="115" y="215" text-anchor="middle" fill="#fff">Kosala</text>
    <rect x="200" y="180" width="130" height="80" fill="#bd10e0"/>
    <text x="265" y="215" text-anchor="middle" fill="#fff">Vajji</text>
    <rect x="350" y="180" width="130" height="80" fill="#ff5c5c"/>
    <text x="415" y="215" text-anchor="middle" fill="#fff">Malla</text>
    <rect x="500" y="180" width="80" height="80" fill="#8b572a"/>
    <text x="540" y="215" text-anchor="middle" fill="#fff">Kuru</text>
    <!-- Row 3 -->
    <rect x="50" y="280" width="130" height="80" fill="#417505"/>
    <text x="115" y="315" text-anchor="middle" fill="#fff">Panchala</text>
    <rect x="200" y="280" width="130" height="80" fill="#c4c4c4"/>
    <text x="265" y="315" text-anchor="middle" fill="#333">Matsya</text>
    <rect x="350" y="280" width="130" height="80" fill="#ffb400"/>
    <text x="415" y="315" text-anchor="middle" fill="#333">Surasena</text>
    <rect x="500" y="280" width="80" height="80" fill="#00a8e1"/>
    <text x="540" y="315" text-anchor="middle" fill="#fff">Assaka</text>
    <!-- Row 4 -->
    <rect x="50" y="380" width="130" height="80" fill="#9b59b6"/>
    <text x="115" y="415" text-anchor="middle" fill="#fff">Avanti</text>
    <rect x="200" y="380" width="130" height="80" fill="#e67e22"/>
    <text x="265" y="415" text-anchor="middle" fill="#fff">Gandhara</text>
    <rect x="350" y="380" width="130" height="80" fill="#2ecc71"/>
    <text x="415" y="415" text-anchor="middle" fill="#fff">Kamboja</text>
    <rect x="500" y="380" width="80" height="80" fill="#34495e"/>
    <text x="540" y="415" text-anchor="middle" fill="#fff">Chedi</text>
  </g>
</svg>