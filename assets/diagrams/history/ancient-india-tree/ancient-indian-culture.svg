<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f9f9f9"/>
  
  <!-- Timeline -->
  <line x1="80" y1="200" x2="520" y2="200" stroke="#555" stroke-width="2"/>
  
  <!-- Indus Valley Civilization -->
  <g id="indus">
    <rect x="110" y="150" width="80" height="40" fill="#c4a69f"/>
    <circle cx="150" cy="170" r="12" fill="#8fb9a8"/>
    <text x="150" y="140" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Indus Valley</text>
    <text x="150" y="230" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">Harappa, Mohenjo‑Daro</text>
  </g>
  
  <!-- Vedic Period -->
  <g id="vedic">
    <circle cx="260" cy="200" r="30" fill="#ffcc66"/>
    <path d="M260,190 L255,210 L265,210 Z" fill="#555"/>
    <text x="260" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Vedic Age</text>
    <text x="260" y="260" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">Rig‑Veda, Sacrificial Fire</text>
  </g>
  
  <!-- Maurya Empire -->
  <g id="mauryan">
    <rect x="340" y="130" width="40" height="80" fill="#8fb9a8"/>
    <circle cx="360" cy="120" r="10" fill="#c4a69f"/>
    <text x="360" y="110" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Maurya</text>
    <text x="360" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">Ashoka Pillar, Buddhism</text>
  </g>
  
  <!-- Gupta Empire -->
  <g id="gupta">
    <polygon points="470,190 500,150 530,190" fill="#d9b3e6"/>
    <circle cx="500" cy="140" r="8" fill="#ffcc66"/>
    <text x="500" y="120" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Gupta</text>
    <text x="500" y="260" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">Golden Age, Art & Science</text>
  </g>
  
  <!-- Labels for cultural themes -->
  <text x="80" y="300" font-family="sans-serif" font-size="12" fill="#555">Urban Planning</text>
  <text x="260" y="300" font-family="sans-serif" font-size="12" fill="#555">Vedic Hymns</text>
  <text x="360" y="300" font-family="sans-serif" font-size="12" fill="#555">Political Unity</text>
  <text x="500" y="300" font-family="sans-serif" font-size="12" fill="#555">Literature & Science</text>
</svg>