<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#f5f5f5"/>
  <text x="300" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#333">South Indian Kingdoms</text>
  <!-- Chola -->
  <circle cx="300" cy="180" r="60" fill="#4a90e2"/>
  <text x="300" y="180" dy="-8" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">Chola</text>
  <text x="300" y="180" dy="12" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fff">c. 9th‑13th CE</text>
  <!-- Chera -->
  <circle cx="150" cy="200" r="50" fill="#7ed321"/>
  <text x="150" y="200" dy="-6" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fff">Chera</text>
  <text x="150" y="200" dy="10" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#fff">c. 3rd‑12th CE</text>
  <!-- Pandya -->
  <circle cx="450" cy="260" r="55" fill="#d0021b"/>
  <text x="450" y="260" dy="-6" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fff">Pandya</text>
  <text x="450" y="260" dy="10" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#fff">c. 6th‑14th CE</text>
  <!-- Vijayanagara -->
  <rect x="380" y="80" width="120" height="70" fill="#f5a623"/>
  <text x="440" y="115" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fff">Vijayanagara</text>
  <text x="440" y="130" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#fff">c. 1336‑1646 CE</text>
  <!-- Connecting lines -->
  <line x1="300" y1="240" x2="300" y2="260" stroke="#333" stroke-width="1"/>
  <line x1="300" y1="260" x2="450" y2="260" stroke="#333" stroke-width="1"/>
  <line x1="300" y1="240" x2="150" y2="200" stroke="#333" stroke-width="1"/>
  <line x1="300" y1="240" x2="440" y2="115" stroke="#333" stroke-width="1"/>
  <!-- Border -->
  <rect x="0.5" y="0.5" width="599" height="399" fill="none" stroke="#ccc"/>
</svg>