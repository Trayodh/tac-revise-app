<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <!-- Background -->
  <rect width="600" height="400" fill="#f9f9f9"/>
  
  <!-- Title -->
  <text x="300" y="40" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#333" text-anchor="middle">Post‑Mauryan India</text>
  
  <!-- Timeline line -->
  <line x1="50" y1="200" x2="550" y2="200" stroke="#777" stroke-width="2"/>
  
  <!-- Shunga Dynasty -->
  <circle cx="120" cy="200" r="30" fill="#ff6f61"/>
  <text x="120" y="170" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#000" text-anchor="middle">Shunga<br/>185‑73 BCE</text>
  
  <!-- Indo‑Greek Kingdom -->
  <circle cx="200" cy="200" r="30" fill="#6b5b95"/>
  <text x="200" y="230" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#000" text-anchor="middle">Indo‑Greek<br/>180‑10 BCE</text>
  
  <!-- Satavahana Dynasty -->
  <circle cx="300" cy="200" r="30" fill="#88b04b"/>
  <text x="300" y="170" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#000" text-anchor="middle">Satavahana<br/>1st c BCE‑3rd c CE</text>
  
  <!-- Kushan Empire -->
  <circle cx="400" cy="200" r="30" fill="#f7cac9"/>
  <text x="400" y="230" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#000" text-anchor="middle">Kushan<br/>30‑375 CE</text>
  
  <!-- Gupta Empire -->
  <circle cx="500" cy="200" r="30" fill="#92a8d1"/>
  <text x="500" y="170" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#000" text-anchor="middle">Gupta<br/>320‑550 CE</text>
  
  <!-- Legend background -->
  <rect x="420" y="260" width="160" height="120" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="440" y="280" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#333">Key Dynasties</text>
  <circle cx="440" cy="300" r="6" fill="#ff6f61"/>
  <text x="460" y="304" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#333">Shunga</text>
  <circle cx="440" cy="320" r="6" fill="#6b5b95"/>
  <text x="460" y="324" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#333">Indo‑Greek</text>
  <circle cx="440" cy="340" r="6" fill="#88b04b"/>
  <text x="460" y="344" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#333">Satavahana</text>
  <circle cx="440" cy="360" r="6" fill="#f7cac9"/>
  <text x="460" y="364" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#333">Kushan</text>
  <circle cx="440" cy="380" r="6" fill="#92a8d1"/>
  <text x="460" y="384" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#333">Gupta</text>
</svg>