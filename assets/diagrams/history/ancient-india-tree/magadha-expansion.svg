<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>
  <!-- Title -->
  <text x="300" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#333">Magadha Expansion</text>
  <!-- Original Magadha -->
  <rect x="200" y="150" width="200" height="100" fill="#8B4513"/>
  <text x="300" y="210" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fff">Original Magadha (c. 6th century BCE)</text>
  <!-- Expansion arrows -->
  <!-- East expansion -->
  <path d="M400,200 C460,140 540,140 540,120" stroke="#555" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="540" y="100" text-anchor="end" font-family="sans-serif" font-size="12" fill="#555">East (under Bimbisara)</text>
  <!-- West expansion -->
  <path d="M200,200 C140,140 60,140 60,120" stroke="#555" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="60" y="100" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555">West (under Bimbisara)</text>
  <!-- South expansion -->
  <path d="M300,250 L300,340" stroke="#555" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="310" y="340" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555">South (under Ajatashatru)</text>
  <!-- Peak region -->
  <rect x="260" y="80" width="80" height="40" fill="#DAA520"/>
  <text x="300" y="105" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#000">Peak under Chandragupta Maurya</text>
</svg>