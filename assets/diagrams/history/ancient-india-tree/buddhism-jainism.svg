<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial,Helvetica,sans-serif" font-size="24" text-anchor="middle" fill="#333333">Buddhism &amp; Jainism</text>
  
  <!-- Central timeline -->
  <line x1="300" y1="80" x2="300" y2="350" stroke="#777777" stroke-width="2"/>
  <text x="300" y="70" font-family="Arial,Helvetica,sans-serif" font-size="14" text-anchor="middle" fill="#555555">6th century BCE</text>
  
  <!-- Buddhism side -->
  <!-- Buddha circle -->
  <circle cx="150" cy="120" r="30" fill="#4CAF50"/>
  <!-- Dharma wheel (spokes) -->
  <g stroke="#ffffff" stroke-width="2">
    <line x1="150" y1="95" x2="150" y2="145"/>
    <line x1="125" y1="120" x2="175" y2="120"/>
    <line x1="132" y1="103" x2="168" y2="137"/>
    <line x1="132" y1="137" x2="168" y2="103"/>
  </g>
  <!-- Buddha label -->
  <text x="150" y="170" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" fill="#000000">Siddhartha Gautama</text>
  <text x="150" y="185" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" fill="#000000">(c. 563–483 BCE)</text>
  <!-- Buddhism teachings box -->
  <rect x="100" y="200" width="100" height="80" fill="#A5D6A7" rx="5" ry="5"/>
  <text x="150" y="225" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" fill="#000000">Four Noble Truths</text>
  <text x="150" y="245" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" fill="#000000">Eightfold Path</text>
  <!-- Connection line -->
  <line x1="150" y1="150" x2="150" y2="200" stroke="#777777" stroke-width="1" stroke-dasharray="4,2"/>
  
  <!-- Jainism side -->
  <!-- Mahavira circle -->
  <circle cx="450" cy="120" r="30" fill="#FF9800"/>
  <!-- Simple hand symbol (stylized) -->
  <g fill="#ffffff">
    <path d="M440,115 h5 v-10 h5 v10 h5 v-15 h5 v15 h5 v-5 h5 v5 h-30z"/>
  </g>
  <!-- Mahavira label -->
  <text x="450" y="170" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" fill="#000000">Mahavira</text>
  <text x="450" y="185" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" fill="#000000">(c. 599–527 BCE)</text>
  <!-- Jainism teachings box -->
  <rect x="400" y="200" width="100" height="80" fill="#FFCC80" rx="5" ry="5"/>
  <text x="450" y="225" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" fill="#000000">Five Vows</text>
  <text x="450" y="245" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" fill="#000000">Arihant</text>
  <!-- Connection line -->
  <line x1="450" y1="150" x2="450" y2="200" stroke="#777777" stroke-width="1" stroke-dasharray="4,2"/>
  
  <!-- Timeline markers -->
  <g stroke="#777777" stroke-width="1">
    <line x1="295" y1="120" x2="305" y2="120"/>
    <line x1="295" y1="200" x2="305" y2="200"/>
    <line x1="295" y1="280" x2="305" y2="280"/>
  </g>
  <text x="315" y="124" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#555555">c. 560 BCE</text>
  <text x="315" y="204" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#555555">c. 500 BCE</text>
  <text x="315" y="284" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#555555">c. 440 BCE</text>
</svg>