<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#f9f9f9"/>
  <style>
    .title { font: bold 24px sans-serif; fill:#333; text-anchor:middle; }
    .label { font: 14px sans-serif; fill:#333; }
    .small { font: 12px sans-serif; fill:#555; }
    .timeline { stroke:#666; stroke-width:2; }
    .tick { stroke:#666; stroke-width:1; }
    .city-grid { stroke:#999; stroke-width:0.5; }
  </style>
  
  <!-- Title -->
  <text x="300" y="30" class="title">Indus Valley Civilization</text>
  
  <!-- Simplified map of Indus region -->
  <path d="M100,150 L150,120 L250,130 L350,100 L450,150 L400,250 L300,300 L200,260 L120,200 Z"
        fill="#c2e0ff" stroke="#336699" stroke-width="2"/>
  
  <!-- Harappa -->
  <circle cx="180" cy="200" r="6" fill="#ff6666"/>
  <text x="190" y="205" class="label">Harappa (c.2600–1900 BCE)</text>
  
  <!-- Mohenjo-daro -->
  <circle cx="380" cy="180" r="6" fill="#ff6666"/>
  <text x="360" y="175" class="label" text-anchor="end">Mohenjo‑daro (c.2600–1900 BCE)</text>
  
  <!-- Typical city layout -->
  <rect x="100" y="320" width="120" height="80" fill="#e0e0e0" stroke="#999" stroke-width="1"/>
  <!-- grid lines -->
  <line x1="130" y1="320" x2="130" y2="400" class="city-grid"/>
  <line x1="160" y1="320" x2="160" y2="400" class="city-grid"/>
  <line x1="100" y1="350" x2="220" y2="350" class="city-grid"/>
  <line x1="100" y1="380" x2="220" y2="380" class="city-grid"/>
  <text x="160" y="315" class="label" text-anchor="middle">Typical City Layout</text>
  
  <!-- Timeline -->
  <line x1="50" y1="350" x2="550" y2="350" class="timeline"/>
  <!-- ticks and labels -->
  <g class="small">
    <line x1="50" y1="345" x2="50" y2="355" class="tick"/>
    <text x="50" y="340" text-anchor="middle">3300 BCE</text>
    
    <line x1="150" y1="345" x2="150" y2="355" class="tick"/>
    <text x="150" y="340" text-anchor="middle">2600 BCE</text>
    
    <line x1="300" y1="345" x2="300" y2="355" class="tick"/>
    <text x="300" y="340" text-anchor="middle">1900 BCE</text>
    
    <line x1="500" y1="345" x2="500" y2="355" class="tick"/>
    <text x="500" y="340" text-anchor="middle">1300 BCE</text>
  </g>
</svg>