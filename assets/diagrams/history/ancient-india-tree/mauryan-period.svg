<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#f5f5f5"/>
  
  <!-- Title -->
  <text x="300" y="40" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#333" text-anchor="middle">Mauryan Period (c. 322–185 BCE)</text>
  
  <!-- Timeline line -->
  <path d="M100,200 H500" stroke="#333" stroke-width="2"/>
  
  <!-- Chandragupta Maurya -->
  <circle cx="150" cy="200" r="12" fill="#4a90e2"/>
  <path d="M150,188 V170" stroke="#333" stroke-width="1"/>
  <text x="150" y="155" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#000" text-anchor="middle">Chandragupta Maurya</text>
  <text x="150" y="170" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#555" text-anchor="middle">(c. 322–298 BCE)</text>
  
  <!-- Bindusara -->
  <circle cx="300" cy="200" r="12" fill="#4a90e2"/>
  <path d="M300,188 V170" stroke="#333" stroke-width="1"/>
  <text x="300" y="155" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#000" text-anchor="middle">Bindusara</text>
  <text x="300" y="170" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#555" text-anchor="middle">(c. 298–272 BCE)</text>
  
  <!-- Ashoka -->
  <circle cx="450" cy="200" r="12" fill="#4a90e2"/>
  <path d="M450,188 V170" stroke="#333" stroke-width="1"/>
  <text x="450" y="155" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#000" text-anchor="middle">Ashoka</text>
  <text x="450" y="170" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#555" text-anchor="middle">(c. 272–232 BCE)</text>
  
  <!-- Legend box -->
  <rect x="420" y="260" width="160" height="80" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="500" y="285" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#000" text-anchor="middle">Key Rulers</text>
  <circle cx="440" cy="310" r="6" fill="#4a90e2"/>
  <text x="460" y="315" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#000">Ruler</text>
</svg>