<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#F0F0F0"/>
  
  <!-- Central node -->
  <rect x="200" y="160" width="200" height="80" rx="8" fill="#4A90E2"/>
  <text x="300" y="205" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">Sources of Indian History</text>
  
  <!-- Source boxes -->
  <rect x="50" y="50" width="150" height="60" rx="6" fill="#F5A623"/>
  <text x="125" y="80" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">Archaeological Sources</text>
  
  <rect x="400" y="50" width="150" height="60" rx="6" fill="#7ED321"/>
  <text x="475" y="80" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">Literary Sources</text>
  
  <rect x="50" y="170" width="150" height="60" rx="6" fill="#D0021B"/>
  <text x="125" y="200" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">Epigraphic Sources</text>
  
  <rect x="400" y="170" width="150" height="60" rx="6" fill="#9013FE"/>
  <text x="475" y="200" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">Numismatic Sources</text>
  
  <rect x="50" y="290" width="150" height="60" rx="6" fill="#50E3C2"/>
  <text x="125" y="320" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">Oral Traditions</text>
  
  <rect x="400" y="290" width="150" height="60" rx="6" fill="#8B572A"/>
  <text x="475" y="320" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">Foreign Accounts</text>
  
  <!-- Connecting lines -->
  <g stroke="#333333" stroke-width="2">
    <line x1="300" y1="200" x2="125" y2="80"/>
    <line x1="300" y1="200" x2="475" y2="80"/>
    <line x1="300" y1="200" x2="125" y2="200"/>
    <line x1="300" y1="200" x2="475" y2="200"/>
    <line x1="300" y1="200" x2="125" y2="320"/>
    <line x1="300" y1="200" x2="475" y2="320"/>
  </g>
</svg>