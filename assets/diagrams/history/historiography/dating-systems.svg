<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#f5f5f5"/>
  
  <!-- Title -->
  <text x="300" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#333">Dating Systems</text>
  
  <!-- Horizontal timeline -->
  <line x1="80" y1="200" x2="520" y2="200" stroke="#333" stroke-width="2"/>
  
  <!-- System markers -->
  <!-- 1. BC/AD -->
  <line x1="100" y1="200" x2="100" y2="260" stroke="#333" stroke-width="2"/>
  <circle cx="100" cy="260" r="12" fill="#4a90e2"/>
  <text x="100" y="285" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">BC/AD</text>
  
  <!-- 2. BCE/CE -->
  <line x1="180" y1="200" x2="180" y2="260" stroke="#333" stroke-width="2"/>
  <circle cx="180" cy="260" r="12" fill="#4a90e2"/>
  <text x="180" y="285" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">BCE/CE</text>
  
  <!-- 3. Julian Calendar -->
  <line x1="260" y1="200" x2="260" y2="260" stroke="#333" stroke-width="2"/>
  <circle cx="260" cy="260" r="12" fill="#4a90e2"/>
  <text x="260" y="285" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Julian</text>
  
  <!-- 4. Gregorian Calendar -->
  <line x1="340" y1="200" x2="340" y2="260" stroke="#333" stroke-width="2"/>
  <circle cx="340" cy="260" r="12" fill="#4a90e2"/>
  <text x="340" y="285" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Gregorian</text>
  
  <!-- 5. Islamic Hijri -->
  <line x1="420" y1="200" x2="420" y2="260" stroke="#333" stroke-width="2"/>
  <circle cx="420" cy="260" r="12" fill="#4a90e2"/>
  <text x="420" y="285" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Hijri</text>
  
  <!-- 6. Chinese Lunar -->
  <line x1="500" y1="200" x2="500" y2="260" stroke="#333" stroke-width="2"/>
  <circle cx="500" cy="260" r="12" fill="#4a90e2"/>
  <text x="500" y="285" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Chinese</text>
  
  <!-- Optional legend -->
  <rect x="420" y="20" width="160" height="70" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="430" y="40" font-family="sans-serif" font-size="12" fill="#333">Legend:</text>
  <circle cx="440" cy="55" r="6" fill="#4a90e2"/>
  <text x="455" y="60" font-family="sans-serif" font-size="12" fill="#333">Dating system</text>
</svg>