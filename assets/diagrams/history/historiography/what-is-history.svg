<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#000"/>
    </marker>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="#fff"/>
  
  <!-- Sources (stack of documents) -->
  <rect x="80" y="80" width="80" height="30" fill="#F5A623" stroke="#000" stroke-width="1"/>
  <rect x="80" y="110" width="80" height="30" fill="#F5A623" stroke="#000" stroke-width="1"/>
  <rect x="80" y="140" width="80" height="30" fill="#F5A623" stroke="#000" stroke-width="1"/>
  <text x="80" y="70" font-family="sans-serif" font-size="16" fill="#000">Sources</text>
  
  <!-- History (book) -->
  <rect x="250" y="120" width="100" height="140" fill="#4A90E2" stroke="#000" stroke-width="1"/>
  <!-- Open pages line -->
  <path d="M250,120 L350,260" stroke="#fff" stroke-width="2"/>
  <text x="300" y="200" font-family="sans-serif" font-size="18" fill="#fff" text-anchor="middle">History</text>
  
  <!-- Interpretation (gear simplified as circle) -->
  <circle cx="460" cy="150" r="50" fill="#50E3C2" stroke="#000" stroke-width="1"/>
  <text x="460" y="155" font-family="sans-serif" font-size="16" fill="#fff" text-anchor="middle">Interpretation</text>
  
  <!-- Arrows -->
  <path d="M160,115 L250,150" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M350,190 L410,170" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Timeline -->
  <line x1="100" y1="340" x2="500" y2="340" stroke="#000" stroke-width="2"/>
  <text x="300" y="320" font-family="sans-serif" font-size="16" fill="#000" text-anchor="middle">Timeline</text>
  <!-- Markers -->
  <circle cx="100" cy="340" r="5" fill="#D0021B"/>
  <circle cx="300" cy="340" r="5" fill="#D0021B"/>
  <circle cx="500" cy="340" r="5" fill="#D0021B"/>
  <text x="100" y="360" font-family="sans-serif" font-size="14" fill="#000" text-anchor="middle">Past</text>
  <text x="300" y="360" font-family="sans-serif" font-size="14" fill="#000" text-anchor="middle">Present</text>
  <text x="500" y="360" font-family="sans-serif" font-size="14" fill="#000" text-anchor="middle">Future</text>
</svg>