<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="#333"/>
    </marker>
    <style>
      .label {font-family:Arial,sans-serif;font-size:14px;fill:#333;}
    </style>
  </defs>
  <!-- Atmosphere -->
  <rect x="0" y="0" width="600" height="120" fill="#a0c8f0"/>
  <text x="300" y="30" text-anchor="middle" class="label">Air (Atmosphere)</text>
  <!-- Water -->
  <rect x="0" y="120" width="600" height="140" fill="#70b8ff"/>
  <text x="300" y="190" text-anchor="middle" class="label">Water (Rivers &amp; Oceans)</text>
  <!-- Soil -->
  <rect x="0" y="260" width="600" height="140" fill="#c2a35f"/>
  <text x="300" y="340" text-anchor="middle" class="label">Soil</text>
  <!-- Industrial Factory -->
  <rect x="50" y="30" width="80" height="60" fill="#777"/>
  <rect x="80" y="10" width="20" height="30" fill="#555"/>
  <text x="90" y="105" text-anchor="middle" class="label">Industrial Emissions</text>
  <line x1="130" y1="60" x2="200" y2="60" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Vehicle -->
  <rect x="50" y="150" width="80" height="40" fill="#d33"/>
  <circle cx="70" cy="200" r="8" fill="#222"/>
  <circle cx="110" cy="200" r="8" fill="#222"/>
  <text x="90" y="225" text-anchor="middle" class="label">Vehicle Exhaust</text>
  <line x1="130" y1="170" x2="200" y2="170" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Plastic Waste in Water -->
  <circle cx="300" cy="210" r="12" fill="#5c9"/>
  <circle cx="340" cy="250" r="12" fill="#5c9"/>
  <circle cx="380" cy="230" r="12" fill="#5c9"/>
  <text x="460" y="240" class="label">Plastic Waste</text>
  <line x1="380" y1="230" x2="460" y2="240" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Acid Rain -->
  <path d="M500,40 C505,55 495,55 500,70 C505,85 495,85 500,100" fill="none" stroke="#66c" stroke-width="3"/>
  <text x="520" y="70" class="label">Acid Rain</text>
  <line x1="500" y1="100" x2="500" y2="260" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Soil Contamination -->
  <circle cx="420" cy="300" r="8" fill="#8b4513"/>
  <circle cx="460" cy="320" r="8" fill="#8b4513"/>
  <circle cx="500" cy="310" r="8" fill="#8b4513"/>
  <text x="540" y="320" class="label">Soil Contamination</text>
  <line x1="500" y1="260" x2="540" y2="300" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Air Pollution Arrow -->
  <line x1="200" y1="60" x2="300" y2="60" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="45" class="label">Air Pollution</text>
</svg>