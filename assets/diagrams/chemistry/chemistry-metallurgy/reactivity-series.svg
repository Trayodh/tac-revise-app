<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Reactivity series list -->
  <g font-family="Arial,Helvetica,sans-serif" font-size="12">
    <rect x="50" y="50" width="120" height="20" fill="#ff6666"/>
    <text x="60" y="65" fill="white">Potassium</text>

    <rect x="50" y="75" width="120" height="20" fill="#ff9966"/>
    <text x="60" y="90" fill="white">Sodium</text>

    <rect x="50" y="100" width="120" height="20" fill="#ffcc66"/>
    <text x="60" y="115" fill="black">Calcium</text>

    <rect x="50" y="125" width="120" height="20" fill="#ffff66"/>
    <text x="60" y="140" fill="black">Magnesium</text>

    <rect x="50" y="150" width="120" height="20" fill="#ccff66"/>
    <text x="60" y="165" fill="black">Aluminum</text>

    <rect x="50" y="175" width="120" height="20" fill="#99ff66"/>
    <text x="60" y="190" fill="black">Zinc</text>

    <rect x="50" y="200" width="120" height="20" fill="#66ff99"/>
    <text x="60" y="215" fill="black">Iron</text>

    <rect x="50" y="225" width="120" height="20" fill="#66ffcc"/>
    <text x="60" y="240" fill="black">Lead</text>

    <rect x="50" y="250" width="120" height="20" fill="#66ccff"/>
    <text x="60" y="265" fill="black">Copper</text>

    <rect x="50" y="275" width="120" height="20" fill="#6699ff"/>
    <text x="60" y="290" fill="black">Silver</text>

    <rect x="50" y="300" width="120" height="20" fill="#6666ff"/>
    <text x="60" y="315" fill="white">Gold</text>
  </g>

  <!-- Arrow indicating direction of reactivity (top to bottom) -->
  <path d="M110 45 L110 340" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Displacement reaction illustration -->
  <g font-family="Arial,Helvetica,sans-serif" font-size="12">
    <!-- Metal A (higher) -->
    <rect x="340" y="80" width="70" height="30" fill="#ff6666"/>
    <text x="350" y="100" fill="white">Metal A</text>

    <!-- Beaker -->
    <rect x="300" y="150" width="150" height="120" fill="#e0f7ff" stroke="#333" stroke-width="2"/>
    <text x="340" y="210" fill="#333">Metal B²⁺ (aq)</text>

    <!-- Metal B (lower) precipitate -->
    <rect x="340" y="280" width="70" height="30" fill="#6666ff"/>
    <text x="350" y="300" fill="white">Metal B</text>

    <!-- Arrow from Metal A to solution -->
    <path d="M375 110 L375 150" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Arrow from solution to precipitate -->
    <path d="M375 270 L375 280" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Overall displacement arrow -->
    <path d="M375 115 L375 275" stroke="#333" stroke-width="1" stroke-dasharray="4 2"/>
  </g>

  <!-- Title -->
  <text x="300" y="30" font-size="18" text-anchor="middle" fill="#333">Reactivity Series &amp; Displacement</text>
</svg>