<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#ffffff"/>
  
  <!-- Mole representation -->
  <g id="mole-concept">
    <!-- Group of particles -->
    <circle cx="120" cy="120" r="8" fill="#4CAF50"/>
    <circle cx="140" cy="130" r="8" fill="#4CAF50"/>
    <circle cx="100" cy="140" r="8" fill="#4CAF50"/>
    <circle cx="130" cy="100" r="8" fill="#4CAF50"/>
    <circle cx="110" cy="110" r="8" fill="#4CAF50"/>
    <circle cx="150" cy="115" r="8" fill="#4CAF50"/>
    <circle cx="115" cy="150" r="8" fill="#4CAF50"/>
    <circle cx="135" cy="95"  r="8" fill="#4CAF50"/>
    <circle cx="125" cy="80"  r="8" fill="#4CAF50"/>
    <circle cx="95"  cy="105" r="8" fill="#4CAF50"/>
    
    <!-- Mole label -->
    <text x="80" y="190" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#212121">1 mole = 6.022×10²³ particles</text>
    
    <!-- Arrow to mass -->
    <defs>
      <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#FF9800"/>
      </marker>
    </defs>
    <line x1="120" y1="150" x2="250" y2="250" stroke="#FF9800" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="260" y="260" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#212121">Mass (g) = moles × molar mass (g·mol⁻¹)</text>
  </g>
  
  <!-- Solution beaker -->
  <g id="solution">
    <!-- Beaker outline -->
    <rect x="350" y="150" width="120" height="180" fill="#2196F3" stroke="#1565C0" stroke-width="2"/>
    <!-- Liquid level -->
    <rect x="352" y="260" width="116" height="68" fill="#90CAF9"/>
    
    <!-- Molarity label -->
    <text x="380" y="140" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#212121">Molarity (M)</text>
    <text x="380" y="340" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#212121">M = mol solute / L solution</text>
    
    <!-- Arrow from beaker to molality -->
    <line x1="470" y1="240" x2="540" y2="240" stroke="#FF9800" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Molality label -->
    <text x="540" y="235" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#212121">Molality (m)</text>
    <text x="540" y="255" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#212121">m = mol solute / kg solvent</text>
  </g>
  
  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#212121">Mole Concept &amp; Concentration Terms</text>
</svg>