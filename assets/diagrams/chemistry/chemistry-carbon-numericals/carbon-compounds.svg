<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#f9f9f9"/>
  
  <!-- Methane (CH₄) -->
  <g id="methane">
    <!-- Carbon atom -->
    <circle cx="150" cy="200" r="20" fill="#222222"/>
    <!-- Hydrogen atoms -->
    <circle cx="110" cy="160" r="12" fill="#dddddd"/>
    <circle cx="190" cy="160" r="12" fill="#dddddd"/>
    <circle cx="110" cy="240" r="12" fill="#dddddd"/>
    <circle cx="190" cy="240" r="12" fill="#dddddd"/>
    <!-- Bonds -->
    <line x1="150" y1="200" x2="110" y2="160" stroke="#777777" stroke-width="2"/>
    <line x1="150" y1="200" x2="190" y2="160" stroke="#777777" stroke-width="2"/>
    <line x1="150" y1="200" x2="110" y2="240" stroke="#777777" stroke-width="2"/>
    <line x1="150" y1="200" x2="190" y2="240" stroke="#777777" stroke-width="2"/>
    <!-- Labels -->
    <text x="150" y="190" text-anchor="middle" font-family="Arial" font-size="14" fill="#000000">C</text>
    <text x="110" y="155" text-anchor="middle" font-family="Arial" font-size="12" fill="#000000">H</text>
    <text x="190" y="155" text-anchor="middle" font-family="Arial" font-size="12" fill="#000000">H</text>
    <text x="110" y="255" text-anchor="middle" font-family="Arial" font-size="12" fill="#000000">H</text>
    <text x="190" y="255" text-anchor="middle" font-family="Arial" font-size="12" fill="#000000">H</text>
    <text x="150" y="280" text-anchor="middle" font-family="Arial" font-size="16" fill="#333333">Methane (CH₄)</text>
  </g>
  
  <!-- Carbon Dioxide (CO₂) -->
  <g id="co2">
    <!-- Carbon atom -->
    <circle cx="300" cy="200" r="20" fill="#222222"/>
    <!-- Oxygen atoms -->
    <circle cx="240" cy="200" r="18" fill="#ff6666"/>
    <circle cx="360" cy="200" r="18" fill="#ff6666"/>
    <!-- Double bonds (two parallel lines) -->
    <line x1="260" y1="190" x2="240" y2="190" stroke="#777777" stroke-width="2"/>
    <line x1="260" y1="210" x2="240" y2="210" stroke="#777777" stroke-width="2"/>
    <line x1="340" y1="190" x2="360" y2="190" stroke="#777777" stroke-width="2"/>
    <line x1="340" y1="210" x2="360" y2="210" stroke="#777777" stroke-width="2"/>
    <!-- Labels -->
    <text x="300" y="190" text-anchor="middle" font-family="Arial" font-size="14" fill="#000000">C</text>
    <text x="240" y="195" text-anchor="middle" font-family="Arial" font-size="12" fill="#000000">O</text>
    <text x="360" y="195" text-anchor="middle" font-family="Arial" font-size="12" fill="#000000">O</text>
    <text x="300" y="280" text-anchor="middle" font-family="Arial" font-size="16" fill="#333333">Carbon Dioxide (CO₂)</text>
  </g>
  
  <!-- Graphite -->
  <g id="graphite">
    <!-- Hexagonal lattice (3 hexagons) -->
    <g stroke="#555555" stroke-width="2" fill="none">
      <polygon points="460,150 480,160 480,180 460,190 440,180 440,160"/>
      <polygon points="480,160 500,170 500,190 480,200 460,190 460,170"/>
      <polygon points="440,160 460,170 460,190 440,200 420,190 420,170"/>
    </g>
    <!-- Carbon atoms at vertices -->
    <circle cx="460" cy="150" r="8" fill="#222222"/>
    <circle cx="480" cy="160" r="8" fill="#222222"/>
    <circle cx="480" cy="180" r="8" fill="#222222"/>
    <circle cx="460" cy="190" r="8" fill="#222222"/>
    <circle cx="440" cy="180" r="8" fill="#222222"/>
    <circle cx="440" cy="160" r="8" fill="#222222"/>
    <circle cx="500" cy="170" r="8" fill="#222222"/>
    <circle cx="500" cy="190" r="8" fill="#222222"/>
    <circle cx="480" cy="200" r="8" fill="#222222"/>
    <circle cx="460" cy="210" r="8" fill="#222222"/>
    <circle cx="440" cy="200" r="8" fill="#222222"/>
    <circle cx="420" cy="190" r="8" fill="#222222"/>
    <circle cx="420" cy="170" r="8" fill="#222222"/>
    <circle cx="440" cy="150" r="8" fill="#222222"/>
    <circle cx="460" cy="140" r="8" fill="#222222"/>
    <circle cx="480" cy="130" r="8" fill="#222222"/>
    <!-- Label -->
    <text x="460" y="260" text-anchor="middle" font-family="Arial" font-size="16" fill="#333333">Graphite (C)</text>
  </g>
  
  <!-- Diamond -->
  <g id="diamond">
    <!-- 3D tetrahedral representation using two overlapping triangles -->
    <polygon points="540,150 560,170 540,190 520,170" fill="#bbbbbb" stroke="#777777" stroke-width="2"/>
    <polygon points="540,150 560,130 560,170 540,150" fill="#dddddd" stroke="#777777" stroke-width="2"/>
    <polygon points="540,190 560,170 560,210 540,190" fill="#dddddd" stroke="#777777" stroke-width="2"/>
    <!-- Carbon atoms at vertices -->
    <circle cx="540" cy="150" r="8" fill="#222222"/>
    <circle cx="560" cy="170" r="8" fill="#222222"/>
    <circle cx="540" cy="190" r="8" fill="#222222"/>
    <circle cx="520" cy="170" r="8" fill="#222222"/>
    <!-- Label -->
    <text x="540" y="260" text-anchor="middle" font-family="Arial" font-size="16" fill="#333333">Diamond (C)</text>
  </g>
</svg>