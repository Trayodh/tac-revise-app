<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 250\"><rect width=\"400\" height=\"250\" fill=\"white\"/><text x=\"200\" y=\"30\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\">Piecewise Journey Speed Problem</text><!-- Top three‑segment line --><line x1=\"50\" y1=\"80\" x2=\"350\" y2=\"80\" stroke=\"black\" stroke-width=\"2\"/><line x1=\"150\" y1=\"80\" x2=\"150\" y2=\"100\" stroke=\"black\" stroke-width=\"2\"/><line x1=\"250\" y1=\"80\" x2=\"250\" y2=\"100\" stroke=\"black\" stroke-width=\"2\"/><!-- Segment distance labels --><text x=\"100\" y=\"115\" text-anchor=\"middle\" font-size=\"12\">80 km</text><text x=\"200\" y=\"115\" text-anchor=\"middle\" font-size=\"12\">80 km</text><text x=\"300\" y=\"115\" text-anchor=\"middle\" font-size=\"12\">80 km</text><!-- Speed labels --><text x=\"100\" y=\"65\" text-anchor=\"middle\" font-size=\"12\">60 km/h</text><text x=\"200\" y=\"65\" text-anchor=\"middle\" font-size=\"12\">50 km/h</text><text x=\"300\" y=\"65\" text-anchor=\"middle\" font-size=\"12\">40 km/h</text><!-- Time for each segment --><text x=\"100\" y=\"135\" text-anchor=\"middle\" font-size=\"12\">t₁ = 80/60 h</text><text x=\"200\" y=\"135\" text-anchor=\"middle\" font-size=\"12\">t₂ = 80/50 h</text><text x=\"300\" y=\"135\" text-anchor=\"middle\" font-size=\"12\">t₃ = 80/40 h</text><!-- Bottom two‑segment line --><line x1=\"50\" y1=\"180\" x2=\"350\" y2=\"180\" stroke=\"black\" stroke-width=\"2\"/><line x1=\"200\" y1=\"180\" x2=\"200\" y2=\"200\" stroke=\"black\" stroke-width=\"2\"/><!-- Segment distance labels bottom --><text x=\"125\" y=\"215\" text-anchor=\"middle\" font-size=\"12\">120 km</text><text x=\"275\" y=\"215\" text-anchor=\"middle\" font-size=\"12\">120 km</text><!-- Speed labels bottom --><text x=\"125\" y=\"165\" text-anchor=\"middle\" font-size=\"12\">60 km/h</text><text x=\"275\" y=\"165\" text-anchor=\"middle\" font-size=\"12\">40 km/h</text><!-- Time for each bottom segment --><text x=\"125\" y=\"235\" text-anchor=\"middle\" font-size=\"12\">t₁' = 120/60 h</text><text x=\"275\" y=\"235\" text-anchor=\"middle\" font-size=\"12\">t₂' = 120/40 h</text><!-- Arrow showing difference --><defs><marker id=\"arrow\" markerWidth=\"6\" markerHeight=\"6\" refX=\"3\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L6,3 Z\" fill=\"black\"/></marker></defs><line x1=\"350\" y1=\"80\" x2=\"350\" y2=\"180\" stroke=\"black\" stroke-width=\"1\" marker-end=\"url(#arrow)\"/><text x=\"360\" y=\"130\" font-size=\"12\" transform=\"rotate(90,360,130)\" text-anchor=\"middle\">4 min</text><!-- Equation result --><text x=\"200\" y=\"250\" text-anchor=\"middle\" font-size=\"14\">Total distance D = 240 km</text></svg>