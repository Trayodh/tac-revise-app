<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\"><rect width=\"400\" height=\"400\" fill=\"white\"/> <!-- Right triangle --> <line x1=\"80\" y1=\"320\" x2=\"80\" y2=\"120\" stroke=\"black\" stroke-width=\"2\"/> <line x1=\"80\" y1=\"320\" x2=\"280\" y2=\"320\" stroke=\"black\" stroke-width=\"2\"/> <line x1=\"280\" y1=\"320\" x2=\"80\" y2=\"120\" stroke=\"black\" stroke-width=\"2\"/> <text x=\"180\" y=\"340\" font-size=\"14\" fill=\"black\">AB = 8 cm</text> <text x=\"60\" y=\"220\" font-size=\"14\" fill=\"black\" transform=\"rotate(-90,60,220)\">BC = 6 cm</text> <text x=\"180\" y=\"210\" font-size=\"14\" fill=\"black\">AC = 10 cm</text> <!-- Cone formed by revolution --> <line x1=\"230\" y1=\"180\" x2=\"230\" y2=\"300\" stroke=\"black\" stroke-width=\"2\"/> <ellipse cx=\"230\" cy=\"300\" rx=\"160\" ry=\"40\" stroke=\"black\" fill=\"none\" stroke-width=\"2\"/> <line x1=\"230\" y1=\"180\" x2=\"70\" y2=\"300\" stroke=\"black\" stroke-width=\"2\"/> <line x1=\"230\" y1=\"180\" x2=\"390\" y2=\"300\" stroke=\"black\" stroke-width=\"2\"/> <text x=\"240\" y=\"170\" font-size=\"14\" fill=\"black\">h = 6 cm</text> <text x=\"400\" y=\"300\" font-size=\"14\" fill=\"black\">r = 8 cm</text> <text x=\"150\" y=\"240\" font-size=\"14\" fill=\"black\">l = 10 cm</text> <!-- Title and surface‑area note --> <text x=\"20\" y=\"30\" font-size=\"18\" font-weight=\"bold\" fill=\"black\">Cone from Right Triangle</text> <text x=\"20\" y=\"390\" font-size=\"12\" fill=\"black\">Surface Area: π r (r + l) = 144π cm²</text></svg>