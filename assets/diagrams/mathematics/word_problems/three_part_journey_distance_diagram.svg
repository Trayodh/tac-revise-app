<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect width="400" height="400" fill="white"/><text x="200" y="30" font-family="sans-serif" font-size="18" text-anchor="middle">Three-part journey distance diagram</text><line x1="50" y1="200" x2="350" y2="200" stroke="black" stroke-width="2"/><line x1="50" y1="190" x2="50" y2="210" stroke="black" stroke-width="2"/><line x1="150" y1="190" x2="150" y2="210" stroke="black" stroke-width="2"/><line x1="250" y1="190" x2="250" y2="210" stroke="black" stroke-width="2"/><line x1="350" y1="190" x2="350" y2="210" stroke="black" stroke-width="2"/><text x="100" y="170" font-family="sans-serif" font-size="14" text-anchor="middle">60 km/h</text><text x="200" y="170" font-family="sans-serif" font-size="14" text-anchor="middle">50 km/h</text><text x="300" y="170" font-family="sans-serif" font-size="14" text-anchor="middle">40 km/h</text><text x="100" y="230" font-family="sans-serif" font-size="14" text-anchor="middle">d₁</text><text x="200" y="230" font-family="sans-serif" font-size="14" text-anchor="middle">d₂</text><text x="300" y="230" font-family="sans-serif" font-size="14" text-anchor="middle">d₃</text><text x="50" y="250" font-family="sans-serif" font-size="12" text-anchor="middle">0 km</text><text x="350" y="250" font-family="sans-serif" font-size="12" text-anchor="middle">240 km</text></svg>