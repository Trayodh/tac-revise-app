<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#ffffff"/>
  
  <!-- Brain -->
  <ellipse cx="100" cy="80" rx="60" ry="40" fill="#f5c6a5" stroke="#000" stroke-width="1"/>
  <text x="30" y="30" font-family="sans-serif" font-size="14" fill="#000">Brain</text>
  <line x1="70" y1="50" x2="100" y2="80" stroke="#000" stroke-width="1"/>
  
  <!-- Heart -->
  <path d="M300,200 
           C285,180 260,180 260,210 
           C260,240 300,260 300,280 
           C300,260 340,240 340,210 
           C340,180 315,180 300,200 Z"
        fill="#e53935" stroke="#000" stroke-width="1"/>
  <text x="260" y="150" font-family="sans-serif" font-size="14" fill="#000">Heart</text>
  <line x1="280" y1="170" x2="300" y2="200" stroke="#000" stroke-width="1"/>
  
  <!-- Lungs -->
  <ellipse cx="240" cy="200" rx="45" ry="60" fill="#90caf9" stroke="#000" stroke-width="1"/>
  <ellipse cx="360" cy="200" rx="45" ry="60" fill="#90caf9" stroke="#000" stroke-width="1"/>
  <text x="180" y="150" font-family="sans-serif" font-size="14" fill="#000">Lungs</text>
  <line x1="210" y1="170" x2="240" y2="200" stroke="#000" stroke-width="1"/>
  
  <!-- Liver -->
  <ellipse cx="300" cy="300" rx="80" ry="40" fill="#ffcc80" stroke="#000" stroke-width="1"/>
  <text x="250" y="350" font-family="sans-serif" font-size="14" fill="#000">Liver</text>
  <line x1="300" y1="340" x2="260" y2="350" stroke="#000" stroke-width="1"/>
  
  <!-- Kidneys -->
  <ellipse cx="240" cy="340" rx="30" ry="20" fill="#a5d6a7" stroke="#000" stroke-width="1"/>
  <ellipse cx="360" cy="340" rx="30" ry="20" fill="#a5d6a7" stroke="#000" stroke-width="1"/>
  <text x="190" y="380" font-family="sans-serif" font-size="14" fill="#000">Kidneys</text>
  <line x1="240" y1="360" x2="210" y2="380" stroke="#000" stroke-width="1"/>
  
  <!-- Stomach -->
  <path d="M140,250 
           C130,260 130,280 140,290 
           C150,300 170,300 180,290 
           C190,280 190,260 180,250 
           C170,240 150,240 140,250 Z"
        fill="#ffab91" stroke="#000" stroke-width="1"/>
  <text x="80" y="260" font-family="sans-serif" font-size="14" fill="#000">Stomach</text>
  <line x1="120" y1="260" x2="140" y2="260" stroke="#000" stroke-width="1"/>
  
  <!-- Intestines -->
  <path d="M120,340 
           q30,20 60,0 
           q30,-20 60,0 
           q30,20 60,0 
           q30,-20 60,0"
        fill="none" stroke="#8d6e63" stroke-width="4"/>
  <text x="50" y="380" font-family="sans-serif" font-size="14" fill="#000">Intestines</text>
  <line x1="110" y1="360" x2="120" y2="340" stroke="#000" stroke-width="1"/>
</svg>