<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#000"/>
    </marker>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="#F5F5F5"/>
  <!-- Flower -->
  <!-- Pistil -->
  <circle cx="300" cy="150" r="30" fill="#FF5722"/>
  <text x="300" y="155" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fff">Pistil</text>
  <!-- Stamens -->
  <g fill="#FFEB3B">
    <circle cx="300" cy="80" r="10"/>
    <circle cx="350" cy="100" r="10"/>
    <circle cx="380" cy="150" r="10"/>
    <circle cx="350" cy="200" r="10"/>
    <circle cx="250" cy="200" r="10"/>
    <circle cx="220" cy="150" r="10"/>
  </g>
  <text x="300" y="70" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#000">Stamen</text>
  <!-- Pollination arrow -->
  <line x1="300" y1="110" x2="300" y2="120" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="310" y="115" font-family="sans-serif" font-size="12" fill="#000">Pollination</text>
  <!-- Seed -->
  <circle cx="300" cy="260" r="12" fill="#795548"/>
  <text x="300" y="265" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fff">Seed</text>
  <!-- Fruit -->
  <ellipse cx="300" cy="300" rx="50" ry="30" fill="#FF9800" opacity="0.6"/>
  <text x="300" y="305" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fff">Fruit</text>
  <!-- Arrow from pistil to seed -->
  <line x1="300" y1="180" x2="300" y2="240" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="310" y="210" font-family="sans-serif" font-size="12" fill="#000">Fertilization</text>
  <!-- Hormones -->
  <!-- Auxin -->
  <circle cx="80" cy="80" r="15" fill="#8BC34A"/>
  <text x="80" y="85" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fff">Auxin</text>
  <!-- Gibberellin -->
  <circle cx="80" cy="150" r="15" fill="#2196F3"/>
  <text x="80" y="155" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fff">Gibberellin</text>
  <!-- Cytokinin -->
  <circle cx="80" cy="220" r="15" fill="#9C27B0"/>
  <text x="80" y="225" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fff">Cytokinin</text>
  <!-- Ethylene -->
  <circle cx="520" cy="80" r="15" fill="#FF9800"/>
  <text x="520" y="85" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fff">Ethylene</text>
  <!-- Abscisic Acid -->
  <circle cx="520" cy="150" r="15" fill="#607D8B"/>
  <text x="520" y="155" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fff">Abscisic Acid</text>
  <!-- Hormone arrows -->
  <line x1="95" y1="80" x2="260" y2="150" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="95" y1="150" x2="260" y2="150" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="95" y1="220" x2="260" y2="150" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="505" y1="80" x2="340" y2="150" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="505" y1="150" x2="340" y2="150" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Labels for hormone effects -->
  <text x="270" y="140" font-family="sans-serif" font-size="12" fill="#000">Growth</text>
  <text x="270" y="160" font-family="sans-serif" font-size="12" fill="#000">Cell division</text>
  <text x="270" y="180" font-family="sans-serif" font-size="12" fill="#000">Fruit ripening</text>
  <text x="340" y="130" font-family="sans-serif" font-size="12" fill="#000">Senescence</text>
  <text x="340" y="170" font-family="sans-serif" font-size="12" fill="#000">Dormancy</text>
</svg>