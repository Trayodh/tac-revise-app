<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#000"/>
    </marker>
    <style>
      .label {font-family:sans-serif;font-size:14px;fill:#000;}
    </style>
  </defs>

  <!-- Body -->
  <rect x="50" y="150" width="120" height="200" fill="#e0f7ff" stroke="#000" stroke-width="1"/>
  <text x="80" y="370" class="label">Body</text>

  <!-- Vaccine syringe -->
  <g>
    <rect x="30" y="110" width="10" height="40" fill="#ff9800" stroke="#000" stroke-width="1"/>
    <line x1="35" y1="110" x2="35" y2="100" stroke="#ff9800" stroke-width="4"/>
    <line x1="35" y1="100" x2="35" y2="90" stroke="#ff9800" stroke-width="2"/>
  </g>
  <text x="10" y="95" class="label">Vaccine (antigen)</text>

  <!-- Arrow from vaccine to body -->
  <line x1="45" y1="120" x2="150" y2="200" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Pathogen -->
  <g>
    <circle cx="500" cy="200" r="50" fill="#ff5252" stroke="#000" stroke-width="1"/>
    <!-- spikes -->
    <line x1="500" y1="150" x2="500" y2="130" stroke="#ff5252" stroke-width="4"/>
    <line x1="540" y1="170" x2="560" y2="155" stroke="#ff5252" stroke-width="4"/>
    <line x1="540" y1="230" x2="560" y2="245" stroke="#ff5252" stroke-width="4"/>
    <line x1="500" y1="250" x2="500" y2="270" stroke="#ff5252" stroke-width="4"/>
    <line x1="460" y1="230" x2="440" y2="245" stroke="#ff5252" stroke-width="4"/>
    <line x1="460" y1="170" x2="440" y2="155" stroke="#ff5252" stroke-width="4"/>
  </g>
  <text x="460" y="260" class="label">Pathogen</text>

  <!-- Arrow from pathogen to body -->
  <line x1="470" y1="200" x2="170" y2="250" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- B cell -->
  <circle cx="250" cy="250" r="30" fill="#8bc34a" stroke="#000" stroke-width="1"/>
  <text x="210" y="260" class="label">B cell</text>

  <!-- T cell -->
  <circle cx="350" cy="250" r="30" fill="#9c27b0" stroke="#000" stroke-width="1"/>
  <text x="380" y="260" class="label">T cell</text>

  <!-- Antibody (Y shape) -->
  <path d="M260,230 L260,210 M260,210 L240,190 M260,210 L280,190" stroke="#00bcd4" stroke-width="4" fill="none"/>
  <text x="260" y="180" class="label">Antibody</text>

  <!-- Arrow from B cell to pathogen (antibody) -->
  <line x1="280" y1="250" x2="440" y2="200" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
</svg>