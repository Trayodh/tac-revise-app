<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="black"/>
    </marker>
    <style>
      .label {font-family:sans-serif;font-size:14px;fill:#000;}
    </style>
  </defs>

  <!-- Human figure -->
  <circle cx="100" cy="150" r="30" fill="#6c9"/>
  <rect x="85" y="180" width="30" height="100" fill="#6c9"/>
  <text x="100" y="300" text-anchor="middle" class="label">Human Host</text>

  <!-- Bacteria -->
  <rect x="380" y="100" width="60" height="30" rx="10" fill="#ff7043"/>
  <text x="410" y="90" text-anchor="middle" class="label">Bacteria</text>

  <!-- Virus -->
  <circle cx="500" cy="200" r="30" fill="#42a5f5"/>
  <!-- virus spikes -->
  <g stroke="#42a5f5" stroke-width="4">
    <line x1="500" y1="165" x2="500" y2="135"/>
    <line x1="500" y1="235" x2="500" y2="265"/>
    <line x1="465" y1="200" x2="435" y2="200"/>
    <line x1="535" y1="200" x2="565" y2="200"/>
    <line x1="475" y1="170" x2="452" y2="147"/>
    <line x1="525" y1="170" x2="548" y2="147"/>
    <line x1="475" y1="230" x2="452" y2="253"/>
    <line x1="525" y1="230" x2="548" y2="253"/>
  </g>
  <text x="500" y="250" text-anchor="middle" class="label">Virus</text>

  <!-- Parasite -->
  <ellipse cx="420" cy="300" rx="30" ry="15" fill="#66bb6a"/>
  <path d="M420 285 q-10 -20 -30 -30" stroke="#66bb6a" stroke-width="4" fill="none"/>
  <text x="420" y="340" text-anchor="middle" class="label">Parasite</text>

  <!-- Arrows from pathogens to human -->
  <line x1="440" y1="115" x2="130" y2="180" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="170" x2="130" y2="210" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="285" x2="130" y2="260" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Optional label for infection pathway -->
  <text x="300" y="50" text-anchor="middle" class="label">Pathogen → Human Host</text>
</svg>