<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#333"/>
    </marker>
  </defs>
  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#333">
    Ecology Basics &amp; Trophic Pyramid
  </text>
  <!-- Decomposers -->
  <rect x="20" y="250" width="80" height="60" fill="#7f8fa6" stroke="#333" stroke-width="1"/>
  <text x="20" y="340" font-family="sans-serif" font-size="14" fill="#333">Decomposers</text>
  <!-- Producers -->
  <rect x="100" y="250" width="400" height="60" fill="#6ab04c" stroke="#333" stroke-width="1"/>
  <text x="520" y="285" font-family="sans-serif" font-size="14" fill="#333">Producers (Plants)</text>
  <!-- Primary Consumers -->
  <rect x="150" y="180" width="300" height="60" fill="#badc58" stroke="#333" stroke-width="1"/>
  <text x="520" y="215" font-family="sans-serif" font-size="14" fill="#333">Primary Consumers (Herbivores)</text>
  <!-- Secondary Consumers -->
  <rect x="200" y="110" width="200" height="60" fill="#f9ca24" stroke="#333" stroke-width="1"/>
  <text x="520" y="145" font-family="sans-serif" font-size="14" fill="#333">Secondary Consumers (Carnivores)</text>
  <!-- Tertiary Consumers -->
  <rect x="250" y="40" width="100" height="60" fill="#e84118" stroke="#333" stroke-width="1"/>
  <text x="520" y="75" font-family="sans-serif" font-size="14" fill="#333">Tertiary Consumers (Apex Predators)</text>
  <!-- Energy flow arrows -->
  <line x1="300" y1="310" x2="300" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="240" x2="300" y2="110" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="170" x2="300" y2="40" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="60" y1="310" x2="300" y2="310" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
</svg>