<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Title -->
  <text x="300" y="30" font-family="Arial,Helvetica,sans-serif" font-size="24" text-anchor="middle" fill="#333">Cell Structure &amp; Cell Division</text>
  
  <!-- Cell Structure (left side) -->
  <!-- Cell membrane -->
  <circle cx="150" cy="200" r="120" fill="#a0c4ff" stroke="#5a9bd5" stroke-width="2"/>
  <!-- Nucleus -->
  <circle cx="150" cy="200" r="50" fill="#6a4c93" stroke="#4b386b" stroke-width="2"/>
  <!-- Nucleolus -->
  <circle cx="150" cy="200" r="20" fill="#c77dff"/>
  <!-- Mitochondria -->
  <ellipse cx="100" cy="130" rx="20" ry="10" fill="#ff9f80" stroke="#d96b5c" stroke-width="1"/>
  <ellipse cx="200" cy="260" rx="20" ry="10" fill="#ff9f80" stroke="#d96b5c" stroke-width="1"/>
  <!-- Endoplasmic Reticulum -->
  <path d="M120,150 C130,130 170,130 180,150" stroke="#ffb347" stroke-width="4" fill="none"/>
  <!-- Golgi Apparatus -->
  <rect x="190" y="120" width="30" height="10" fill="#ff6f69"/>
  <rect x="190" y="135" width="30" height="10" fill="#ff6f69"/>
  <rect x="190" y="150" width="30" height="10" fill="#ff6f69"/>
  <!-- Ribosomes -->
  <circle cx="130" cy="180" r="4" fill="#b0b0b0"/>
  <circle cx="170" cy="220" r="4" fill="#b0b0b0"/>
  <circle cx="140" cy="250" r="4" fill="#b0b0b0"/>
  <circle cx="180" cy="180" r="4" fill="#b0b0b0"/>
  
  <!-- Labels for cell structure -->
  <polyline points="260,80 260,200 270,200" fill="none" stroke="#000" stroke-width="1"/>
  <text x="260" y="70" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#000">Cell Membrane</text>
  
  <line x1="260" y1="200" x2="200" y2="200" stroke="#000" stroke-width="1"/>
  <text x="260" y="215" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#000">Nucleus</text>
  
  <line x1="260" y1="230" x2="200" y2="200" stroke="#000" stroke-width="1"/>
  <text x="260" y="245" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#000">Nucleolus</text>
  
  <line x1="80" y1="100" x2="100" y2="130" stroke="#000" stroke-width="1"/>
  <text x="80" y="95" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#000">Mitochondrion</text>
  
  <line x1="80" y1="260" x2="120" y2="150" stroke="#000" stroke-width="1"/>
  <text x="80" y="255" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#000">Endoplasmic Reticulum</text>
  
  <line x1="250" y1="130" x2="190" y2="130" stroke="#000" stroke-width="1"/>
  <text x="250" y="125" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#000">Golgi Apparatus</text>
  
  <line x1="80" y1="300" x2="130" y2="180" stroke="#000" stroke-width="1"/>
  <text x="80" y="295" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#000">Ribosome</text>
  
  <!-- Cell Division (right side) -->
  <!-- Prophase -->
  <g id="prophase">
    <circle cx="380" cy="80" r="30" fill="#e0f7fa" stroke="#0097a7" stroke-width="2"/>
    <!-- Chromosomes as X shapes -->
    <path d="M370,70 L390,90 M390,70 L370,90" stroke="#006064" stroke-width="2"/>
    <path d="M380,60 L380,100" stroke="#006064" stroke-width="2"/>
    <path d="M360,80 L400,80" stroke="#006064" stroke-width="2"/>
  </g>
  <line x1="410" y1="80" x2="440" y2="80" stroke="#000" stroke-width="1"/>
  <text x="445" y="85" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#000">Prophase</text>
  
  <!-- Metaphase -->
  <g id="metaphase">
    <circle cx="380" cy="160" r="30" fill="#e0f7fa" stroke="#0097a7" stroke-width="2"/>
    <!-- Chromosomes aligned -->
    <line x1="380" y1="140" x2="380" y2="180" stroke="#006064" stroke-width="2"/>
    <line x1="370" y1="150" x2="390" y2="150" stroke="#006064" stroke-width="2"/>
    <line x1="360" y1="160" x2="400" y2="160" stroke="#006064" stroke-width="2"/>
  </g>
  <line x1="410" y1="160" x2="440" y2="160" stroke="#000" stroke-width="1"/>
  <text x="445" y="165" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#000">Metaphase</text>
  
  <!-- Anaphase -->
  <g id="anaphase">
    <circle cx="380" cy="240" r="30" fill="#e0f7fa" stroke="#0097a7" stroke-width="2"/>
    <!-- Chromosomes separating -->
    <path d="M360,230 L340,210 M340,230 L360,210" stroke="#006064" stroke-width="2"/>
    <path d="M400,250 L420,270 M420,250 L400,270" stroke="#006064" stroke-width="2"/>
  </g>
  <line x1="410" y1="240" x2="440" y2="240" stroke="#000" stroke-width="1"/>
  <text x="445" y="245" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#000">Anaphase</text>
  
  <!-- Telophase -->
  <g id="telophase">
    <circle cx="380" cy="320" r="30" fill="#e0f7fa" stroke="#0097a7" stroke-width="2"/>
    <!-- Decondensed chromosomes as small circles -->
    <circle cx="370" cy="310" r="4" fill="#006064"/>
    <circle cx="390" cy="310" r="4" fill="#006064"/>
    <circle cx="370" cy="330" r="4" fill="#006064"/>
    <circle cx="390" cy="330" r="4" fill="#006064"/>
  </g>
  <line x1="410" y1="320" x2="440" y2="320" stroke="#000" stroke-width="1"/>
  <text x="445" y="325" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#000">Telophase</text>
</svg>