<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <style>
    .node { stroke:#333; stroke-width:1; }
    .label { font-family:sans-serif; font-size:14px; fill:#fff; text-anchor:middle; dominant-baseline:middle; }
    .connector { fill:none; stroke:#555; stroke-width:2; }
  </style>
  <!-- Top level -->
  <rect class="node" x="240" y="20" width="120" height="40" fill="#4CAF50"/>
  <text class="label" x="300" y="40">Animalia</text>
  <!-- Second level -->
  <rect class="node" x="80" y="100" width="120" height="40" fill="#2196F3"/>
  <text class="label" x="140" y="120">Chordata</text>
  <rect class="node" x="240" y="100" width="120" height="40" fill="#FF9800"/>
  <text class="label" x="300" y="120">Arthropoda</text>
  <rect class="node" x="400" y="100" width="120" height="40" fill="#9C27B0"/>
  <text class="label" x="460" y="120">Mollusca</text>
  <!-- Connectors from Animalia to second level -->
  <path class="connector" d="M300,60 L140,100"/>
  <path class="connector" d="M300,60 L300,100"/>
  <path class="connector" d="M300,60 L460,100"/>
  <!-- Third level: Chordata children -->
  <rect class="node" x="80" y="180" width="120" height="40" fill="#81C784"/>
  <text class="label" x="140" y="200">Mammals</text>
  <rect class="node" x="80" y="240" width="120" height="40" fill="#66BB6A"/>
  <text class="label" x="140" y="260">Birds</text>
  <!-- Connectors from Chordata -->
  <path class="connector" d="M140,140 L140,180"/>
  <path class="connector" d="M140,140 L140,240"/>
  <!-- Third level: Arthropoda children -->
  <rect class="node" x="240" y="180" width="120" height="40" fill="#64B5F6"/>
  <text class="label" x="300" y="200">Insects</text>
  <rect class="node" x="240" y="240" width="120" height="40" fill="#42A5F5"/>
  <text class="label" x="300" y="260">Crustaceans</text>
  <!-- Connectors from Arthropoda -->
  <path class="connector" d="M300,140 L300,180"/>
  <path class="connector" d="M300,140 L300,240"/>
  <!-- Third level: Mollusca children -->
  <rect class="node" x="400" y="180" width="120" height="40" fill="#BA68C8"/>
  <text class="label" x="460" y="200">Cephalopods</text>
  <rect class="node" x="400" y="240" width="120" height="40" fill="#AB47BC"/>
  <text class="label" x="460" y="260">Bivalves</text>
  <!-- Connectors from Mollusca -->
  <path class="connector" d="M460,140 L460,180"/>
  <path class="connector" d="M460,140 L460,240"/>
</svg>