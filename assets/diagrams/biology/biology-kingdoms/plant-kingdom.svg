<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Styles -->
  <style>
    .node { fill:#4CAF50; stroke:#2E7D32; stroke-width:2; }
    .subnode { fill:#8BC34A; stroke:#558B2F; stroke-width:2; }
    .line { fill:none; stroke:#555; stroke-width:2; }
    .label { font-family:Arial,Helvetica,sans-serif; font-size:14px; fill:#000; }
  </style>

  <!-- Top Kingdom -->
  <rect class="node" x="200" y="20" width="200" height="40" rx="5"/>
  <text class="label" x="300" y="45" text-anchor="middle">Plantae (Kingdom)</text>

  <!-- Branch lines from Kingdom -->
  <path class="line" d="M300,60 V80 H130 V120"/>
  <path class="line" d="M300,60 V80 H470 V120"/>

  <!-- Bryophytes -->
  <rect class="subnode" x="80" y="120" width="150" height="40" rx="5"/>
  <text class="label" x="155" y="145" text-anchor="middle">Bryophytes (Non‑vascular)</text>

  <!-- Pteridophytes -->
  <rect class="subnode" x="80" y="200" width="150" height="40" rx="5"/>
  <text class="label" x="155" y="225" text-anchor="middle">Pteridophytes (Seedless Vascular)</text>

  <!-- Gymnosperms -->
  <rect class="subnode" x="370" y="120" width="150" height="40" rx="5"/>
  <text class="label" x="445" y="145" text-anchor="middle">Gymnosperms (Conifers, etc.)</text>

  <!-- Angiosperms -->
  <rect class="subnode" x="370" y="200" width="150" height="40" rx="5"/>
  <text class="label" x="445" y="225" text-anchor="middle">Angiosperms (Flowering)</text>

  <!-- Branch lines from Angiosperms -->
  <path class="line" d="M445,240 V260 H445 V280"/>

  <!-- Monocots -->
  <rect class="subnode" x="370" y="280" width="150" height="40" rx="5"/>
  <text class="label" x="445" y="305" text-anchor="middle">Monocots</text>

  <!-- Dicots -->
  <rect class="subnode" x="370" y="340" width="150" height="40" rx="5"/>
  <text class="label" x="445" y="365" text-anchor="middle">Dicots</text>
</svg>