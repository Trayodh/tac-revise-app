<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="#000"/>
    </marker>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="#e0f7e0"/>
  <!-- Waterway (river) -->
  <path d="M50,300 C150,350 250,250 350,300 S550,250 550,250"
        fill="none" stroke="#4a90e2" stroke-width="12" stroke-linecap="round"/>
  <!-- Highway base -->
  <path d="M100,50 C200,150 300,100 400,200 S500,350 500,350"
        fill="none" stroke="#777777" stroke-width="20" stroke-linecap="round"/>
  <!-- Highway lane markings -->
  <path d="M100,50 C200,150 300,100 400,200 S500,350 500,350"
        fill="none" stroke="#ffffff" stroke-width="6" stroke-dasharray="12 12" stroke-linecap="round"/>
  <!-- Car icon near highway -->
  <g transform="translate(80,70)">
    <rect width="30" height="15" fill="#ff5722" rx="3"/>
    <circle cx="8" cy="15" r="4" fill="#333"/>
    <circle cx="22" cy="15" r="4" fill="#333"/>
  </g>
  <!-- Boat icon near waterway -->
  <g transform="translate(380,260)">
    <polygon points="0,0 30,0 20,15 10,15" fill="#ff9800"/>
    <rect x="12" y="-5" width="6" height="5" fill="#555"/>
  </g>
  <!-- Highway label -->
  <text x="120" y="30" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#000">Highway</text>
  <line x1="120" y1="30" x2="130" y2="60" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Waterway label -->
  <text x="500" y="200" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#000">Waterway</text>
  <line x1="500" y1="200" x2="540" y2="260" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>