<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#f5f5f5"/>
  
  <!-- Mineral Resources Section -->
  <g id="minerals">
    <!-- Mountain -->
    <polygon points="50,300 150,150 250,300" fill="#a9a9a9"/>
    <!-- Mine entrance -->
    <rect x="130" y="250" width="30" height="30" fill="#8b4513"/>
    <!-- Pickaxe -->
    <path d="M145 250 L145 230 M145 230 L155 240 M145 230 L135 240" stroke="#555555" stroke-width="2" fill="none"/>
    <!-- Label line -->
    <line x1="160" y1="200" x2="250" y2="200" stroke="#333333" stroke-width="1"/>
    <text x="260" y="205" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333333">Mineral Resources</text>
  </g>
  
  <!-- Farming Section -->
  <g id="farming">
    <!-- Arable Farming -->
    <rect x="350" y="250" width="80" height="80" fill="#6b8e23"/>
    <!-- Rows -->
    <line x1="350" y1="270" x2="430" y2="270" stroke="#fff" stroke-width="2"/>
    <line x1="350" y1="290" x2="430" y2="290" stroke="#fff" stroke-width="2"/>
    <line x1="350" y1="310" x2="430" y2="310" stroke="#fff" stroke-width="2"/>
    <line x1="350" y1="330" x2="430" y2="330" stroke="#fff" stroke-width="2"/>
    <!-- Label line -->
    <line x1="430" y1="290" x2="500" y2="260" stroke="#333333" stroke-width="1"/>
    <text x="505" y="265" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333333">Arable Farming</text>
    
    <!-- Pastoral Farming -->
    <rect x="460" y="250" width="80" height="80" fill="#6b8e23"/>
    <!-- Simple cow -->
    <ellipse cx="500" cy="290" rx="12" ry="8" fill="#ffffff"/>
    <circle cx="496" cy="286" r="2" fill="#000000"/>
    <circle cx="504" cy="286" r="2" fill="#000000"/>
    <path d="M500 298 Q508 304 516 298" stroke="#000000" stroke-width="2" fill="none"/>
    <!-- Label line -->
    <line x1="540" y1="290" x2="580" y2="260" stroke="#333333" stroke-width="1"/>
    <text x="585" y="265" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333333">Pastoral Farming</text>
    
    <!-- Mixed Farming -->
    <rect x="350" y="150" width="190" height="80" fill="#6b8e23"/>
    <!-- Crop icon -->
    <path d="M380 180 L380 170 L382 170 L382 180 Z" fill="#fff"/>
    <path d="M384 180 L384 170 L386 170 L386 180 Z" fill="#fff"/>
    <!-- Animal icon -->
    <ellipse cx="460" cy="180" rx="8" ry="5" fill="#fff"/>
    <circle cx="456" cy="176" r="1.5" fill="#000"/>
    <circle cx="464" cy="176" r="1.5" fill="#000"/>
    <!-- Label line -->
    <line x1="540" y1="190" x2="580" y2="210" stroke="#333333" stroke-width="1"/>
    <text x="585" y="215" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333333">Mixed Farming</text>
  </g>
</svg>