<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background Ocean -->
  <rect width="600" height="400" fill="#e0f7ff"/>
  
  <!-- Simplified Asia landmass -->
  <polygon points="150,50 250,30 350,80 380,150 340,250 260,300 180,280 130,200 120,120"
           fill="#a8d08d" stroke="#6b8e23" stroke-width="1"/>
  
  <!-- Flashpoint markers -->
  <circle cx="380" cy="120" r="8" fill="#d32f2f"/>
  <circle cx="380" cy="180" r="8" fill="#d32f2f"/>
  <circle cx="300" cy="220" r="8" fill="#d32f2f"/>
  <circle cx="420" cy="150" r="8" fill="#d32f2f"/>
  <circle cx="200" cy="340" r="8" fill="#d32f2f"/>
  
  <!-- Labels and leader lines -->
  <line x1="380" y1="120" x2="420" y2="100" stroke="#333" stroke-width="1"/>
  <text x="425" y="95" font-family="sans-serif" font-size="14" fill="#333">Korean Peninsula</text>
  
  <line x1="380" y1="180" x2="420" y2="180" stroke="#333" stroke-width="1"/>
  <text x="425" y="185" font-family="sans-serif" font-size="14" fill="#333">Taiwan Strait</text>
  
  <line x1="300" y1="220" x2="340" y2="260" stroke="#333" stroke-width="1"/>
  <text x="345" y="265" font-family="sans-serif" font-size="14" fill="#333">South China Sea</text>
  
  <line x1="420" y1="150" x2="460" y2="150" stroke="#333" stroke-width="1"/>
  <text x="465" y="155" font-family="sans-serif" font-size="14" fill="#333">East China Sea</text>
  
  <line x1="200" y1="340" x2="240" y2="360" stroke="#333" stroke-width="1"/>
  <text x="245" y="365" font-family="sans-serif" font-size="14" fill="#333">Indian Ocean</text>
  
  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#222">Geopolitical Flashpoints &amp; Indo‑Pacific</text>
</svg>