<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <!-- Background -->
  <rect width="600" height="400" fill="#f5f5f5"/>
  
  <!-- Mountains -->
  <g id="mountains">
    <polygon points="80,300 130,180 180,300" fill="#8B4513"/>
    <polygon points="150,300 200,170 250,300" fill="#8B4513"/>
    <polygon points="220,300 270,150 320,300" fill="#8B4513"/>
    <polygon points="300,300 350,190 400,300" fill="#8B4513"/>
  </g>
  
  <!-- Forest -->
  <g id="forest">
    <!-- Tree trunks -->
    <rect x="460" y="260" width="10" height="40" fill="#8B4513"/>
    <rect x="490" y="260" width="10" height="40" fill="#8B4513"/>
    <rect x="520" y="260" width="10" height="40" fill="#8B4513"/>
    <!-- Tree canopies -->
    <polygon points="465,260 470,230 475,260" fill="#228B22"/>
    <polygon points="495,260 500,225 505,260" fill="#228B22"/>
    <polygon points="525,260 530,235 535,260" fill="#228B22"/>
    <polygon points="470,250 475,215 480,250" fill="#228B22"/>
    <polygon points="500,250 505,210 510,250" fill="#228B22"/>
    <polygon points="530,250 535,220 540,250" fill="#228B22"/>
  </g>
  
  <!-- River -->
  <path d="M 100 350 C 150 300, 250 300, 300 250 S 450 200, 550 150" 
        fill="none" stroke="#1E90FF" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Labels -->
  <text x="30" y="120" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#333">Mountains</text>
  <line x1="110" y1="130" x2="150" y2="200" stroke="#333" stroke-width="2"/>
  
  <text x="460" y="190" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#333">Forests</text>
  <line x1="470" y1="200" x2="470" y2="260" stroke="#333" stroke-width="2"/>
  
  <text x="380" y="340" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#333">Rivers</text>
  <line x1="400" y1="340" x2="350" y2="260" stroke="#333" stroke-width="2"/>
</svg>