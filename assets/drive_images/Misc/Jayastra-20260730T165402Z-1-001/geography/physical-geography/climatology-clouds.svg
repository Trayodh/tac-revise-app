<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#f5f5f5"/>
  
  <!-- Earth cross‑section -->
  <rect x="100" y="50" width="200" height="300" fill="#e0e0e0" stroke="#9e9e9e" stroke-width="2"/>
  
  <!-- Climatic zones -->
  <rect x="100" y="50" width="200" height="100" fill="#ff6f61"/>
  <rect x="100" y="150" width="200" height="100" fill="#4caf50"/>
  <rect x="100" y="250" width="200" height="100" fill="#2196f3"/>
  
  <!-- Zone labels with leader lines -->
  <line x1="300" y1="100" x2="340" y2="100" stroke="#555" stroke-width="1"/>
  <text x="345" y="105" font-family="sans-serif" font-size="14" fill="#333">Tropical Zone</text>
  
  <line x1="300" y1="200" x2="340" y2="200" stroke="#555" stroke-width="1"/>
  <text x="345" y="205" font-family="sans-serif" font-size="14" fill="#333">Temperate Zone</text>
  
  <line x1="300" y1="300" x2="340" y2="300" stroke="#555" stroke-width="1"/>
  <text x="345" y="305" font-family="sans-serif" font-size="14" fill="#333">Polar Zone</text>
  
  <!-- Sun -->
  <circle cx="80" cy="30" r="20" fill="#ffeb3b" stroke="#fbc02d" stroke-width="2"/>
  <text x="60" y="20" font-family="sans-serif" font-size="12" fill="#555">Sun</text>
  
  <!-- Cloud section -->
  <g id="clouds" transform="translate(380,50)">
    <!-- Cumulus -->
    <g id="cumulus">
      <circle cx="30" cy="30" r="20" fill="#bbbbbb"/>
      <circle cx="55" cy="30" r="20" fill="#bbbbbb"/>
      <circle cx="42.5" cy="15" r="20" fill="#bbbbbb"/>
      <text x="0" y="70" font-family="sans-serif" font-size="14" fill="#333">Cumulus</text>
    </g>
    <!-- Stratus -->
    <g id="stratus" transform="translate(0,110)">
      <rect x="15" y="20" width="70" height="20" fill="#bbbbbb"/>
      <text x="0" y="70" font-family="sans-serif" font-size="14" fill="#333">Stratus</text>
    </g>
    <!-- Cirrus -->
    <g id="cirrus" transform="translate(0,210)">
      <path d="M15 30 L25 20 L35 30 L45 20 L55 30 L65 20" stroke="#bbbbbb" stroke-width="4" fill="none" stroke-linecap="round"/>
      <text x="0" y="70" font-family="sans-serif" font-size="14" fill="#333">Cirrus</text>
    </g>
  </g>
  
  <!-- Title -->
  <text x="300" y="20" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#222">Climatology: Climatic Zones &amp; Clouds</text>
</svg>