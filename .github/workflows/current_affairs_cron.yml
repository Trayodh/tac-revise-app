name: Daily Current Affairs Updater

on:
  schedule:
    - cron: '30 0 * * *' # Runs every day at 00:30 UTC (06:00 IST)
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  update-ca:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Current Affairs Updater
        run: node scripts/daily_ca_updater.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add current_affairs_db.js
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No new current affairs to commit."
          else
            git commit -m "chore(data): auto-update current affairs [skip ci]"
            git push
          fi
