services:
  - type: web
    name: tac-revise-app
    env: node
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: npm run start
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: YOUTUBE_DL_SKIP_DOWNLOAD
        value: "true"
      - key: GEMINI_API_KEY
        sync: false # Requires manual entry in the Render dashboard
