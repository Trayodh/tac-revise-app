services:
  - type: web
    name: tac-revise-app
    env: node
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: npm run start
    healthCheckPath: /healthz
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: YOUTUBE_DL_SKIP_DOWNLOAD
        value: "true"
      - key: ENABLE_AUTO_CA_SCRAPE
        value: "false"
      - key: GEMINI_API_KEY
        sync: false # Requires manual entry in the Render dashboard
      - key: GROQ_API_KEY
        sync: false # Optional fallback LLM key in Render dashboard
      - key: OPENROUTER_API_KEY
        sync: false # Optional fallback LLM key in Render dashboard
