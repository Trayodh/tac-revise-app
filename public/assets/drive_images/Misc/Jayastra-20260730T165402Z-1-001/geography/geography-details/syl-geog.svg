<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#f5f5f5"/>
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#333" text-anchor="middle">Indian Geography: Rivers, Passes &amp; Soils</text>
  
  <!-- Simplified outline of India -->
  <path d="M150,50 L250,20 L350,30 L450,80 L500,150 L520,250 L500,350 L400,380 L300,390 L200,380 L120,340 L80,260 L70,180 L80,100 Z"
        fill="#e0e0e0" stroke="#555" stroke-width="2"/>
  
  <!-- Rivers -->
  <path d="M200,120 L200,250" stroke="#1e90ff" stroke-width="4" stroke-linecap="round"/>
  <path d="M350,80 L380,200" stroke="#1e90ff" stroke-width="4" stroke-linecap="round"/>
  <path d="M150,80 L120,250" stroke="#1e90ff" stroke-width="4" stroke-linecap="round"/>
  <path d="M250,250 L260,340" stroke="#1e90ff" stroke-width="4" stroke-linecap="round"/>
  <path d="M300,260 L310,340" stroke="#1e90ff" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Passes (mountain passes) -->
  <polygon points="245,70 250,60 255,70" fill="#d32f2f"/>
  <polygon points="295,70 300,60 305,70" fill="#d32f2f"/>
  <polygon points="175,70 180,60 185,70" fill="#d32f2f"/>
  
  <!-- Soil regions -->
  <rect x="180" y="130" width="40" height="80" fill="#f9e79f" stroke="#b8860b" stroke-width="1"/>
  <rect x="260" y="260" width="60" height="60" fill="#8b4513" stroke="#5c3317" stroke-width="1"/>
  <rect x="340" y="300" width="60" height="60" fill="#c1440e" stroke="#7a2e0e" stroke-width="1"/>
  <rect x="120" y="300" width="60" height="60" fill="#ff7f50" stroke="#c44c1e" stroke-width="1"/>
  
  <!-- Label lines -->
  <line x1="210" y1="150" x2="200" y2="150" stroke="#333" stroke-width="1"/>
  <line x1="390" y1="120" x2="380" y2="120" stroke="#333" stroke-width="1"/>
  <line x1="130" y1="120" x2="150" y2="120" stroke="#333" stroke-width="1"/>
  <line x1="270" y1="300" x2="260" y2="300" stroke="#333" stroke-width="1"/>
  <line x1="320" y1="320" x2="310" y2="320" stroke="#333" stroke-width="1"/>
  <line x1="260" y1="50" x2="250" y2="70" stroke="#333" stroke-width="1"/>
  <line x1="340" y1="50" x2="300" y2="70" stroke="#333" stroke-width="1"/>
  <line x1="80" y1="50" x2="180" y2="70" stroke="#333" stroke-width="1"/>
  <line x1="230" y1="130" x2="200" y2="130" stroke="#333" stroke-width="1"/>
  <line x1="340" y1="260" x2="260" y2="260" stroke="#333" stroke-width="1"/>
  <line x1="410" y1="320" x2="340" y2="320" stroke="#333" stroke-width="1"/>
  <line x1="80" y1="320" x2="120" y2="320" stroke="#333" stroke-width="1"/>
  
  <!-- Labels -->
  <text x="210" y="145" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333">Ganga River</text>
  <text x="390" y="115" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333">Brahmaputra</text>
  <text x="130" y="115" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333">Indus River</text>
  <text x="270" y="295" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333">Godavari</text>
  <text x="320" y="315" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333">Krishna</text>
  <text x="260" y="45" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333">Zoji La</text>
  <text x="340" y="45" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333">Nathu La</text>
  <text x="80" y="45" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333">Khyber Pass</text>
  <text x="230" y="125" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333">Alluvial Soil</text>
  <text x="340" y="255" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333">Black Soil</text>
  <text x="410" y="315" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333">Red Soil</text>
  <text x="80" y="315" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333">Laterite Soil</text>
</svg>