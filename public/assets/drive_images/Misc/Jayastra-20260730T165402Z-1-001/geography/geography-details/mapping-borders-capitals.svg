<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#f9f9f9"/>
  
  <!-- Title -->
  <text x="300" y="40" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#333" text-anchor="middle">Borders, Capitals &amp; Mapping</text>
  
  <!-- Country shape -->
  <path d="M100,100 L200,80 L300,120 L350,200 L280,300 L150,250 Z"
        fill="#cce5ff" stroke="#3366cc" stroke-width="2"/>
  
  <!-- Capital city marker -->
  <circle cx="250" cy="180" r="6" fill="#ff3333" stroke="#990000" stroke-width="1"/>
  
  <!-- Capital label line -->
  <line x1="250" y1="180" x2="350" y2="180" stroke="#333" stroke-width="1"/>
  <text x="360" y="185" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333">Capital City</text>
  
  <!-- Border label line -->
  <line x1="300" y1="120" x2="460" y2="70" stroke="#333" stroke-width="1"/>
  <text x="470" y="75" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333">Country Border</text>
  
  <!-- Legend box -->
  <rect x="420" y="250" width="150" height="120" fill="#fff" stroke="#999" stroke-width="1"/>
  <text x="495" y="270" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#333" text-anchor="middle">Legend</text>
  
  <!-- Legend: border line -->
  <line x1="440" y1="300" x2="500" y2="300" stroke="#3366cc" stroke-width="2"/>
  <text x="510" y="305" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#333">Border</text>
  
  <!-- Legend: capital marker -->
  <circle cx="470" cy="340" r="6" fill="#ff3333" stroke="#990000" stroke-width="1"/>
  <text x="485" y="345" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#333">Capital</text>
</svg>