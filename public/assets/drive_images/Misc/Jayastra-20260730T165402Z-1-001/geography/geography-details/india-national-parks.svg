<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <style>
    .outline { fill:none; stroke:#333; stroke-width:2; }
    .park { fill:#d32f2f; stroke:#b71c1c; stroke-width:1; }
    .label-line { stroke:#555; stroke-width:1; }
    .label { font-family:Arial,Helvetica,sans-serif; font-size:12px; fill:#111; }
    .title { font-size:18px; font-weight:bold; text-anchor:middle; }
  </style>

  <!-- Title -->
  <text x="300" y="30" class="title">National Parks of India (Map Guide)</text>

  <!-- Simplified outline of India -->
  <path class="outline" d="
    M100,80 
    L150,50 L200,40 L250,30 L300,40 L350,30 L400,50 L450,80 
    L470,130 L480,180 L470,230 L460,260 L440,300 L420,340 
    L380,360 L340,370 L300,380 L260,370 L220,360 L180,340 
    L150,300 L130,260 L120,210 L110,150 Z"/>

  <!-- Park markers -->
  <circle class="park" cx="210" cy="80" r="6"/>   <!-- Valley of Flowers -->
  <circle class="park" cx="200" cy="120" r="6"/>  <!-- Jim Corbett -->
  <circle class="park" cx="300" cy="60" r="6"/>   <!-- Hemis -->
  <circle class="park" cx="420" cy="130" r="6"/>  <!-- Kaziranga -->
  <circle class="park" cx="460" cy="200" r="6"/>  <!-- Sundarbans -->
  <circle class="park" cx="150" cy="260" r="6"/>  <!-- Gir -->
  <circle class="park" cx="180" cy="200" r="6"/>  <!-- Ranthambore -->
  <circle class="park" cx="260" cy="300" r="6"/>  <!-- Bandipur -->
  <circle class="park" cx="190" cy="250" r="6"/>  <!-- Keoladeo -->
  <circle class="park" cx="260" cy="210" r="6"/>  <!-- Kanha -->

  <!-- Labels and connector lines -->
  <!-- Valley of Flowers -->
  <line class="label-line" x1="210" y1="80" x2="260" y2="50"/>
  <text class="label" x="265" y="55">Valley of Flowers</text>

  <!-- Jim Corbett -->
  <line class="label-line" x1="200" y1="120" x2="250" y2="110"/>
  <text class="label" x="255" y="115">Jim Corbett</text>

  <!-- Hemis -->
  <line class="label-line" x1="300" y1="60" x2="350" y2="40"/>
  <text class="label" x="355" y="45">Hemis</text>

  <!-- Kaziranga -->
  <line class="label-line" x1="420" y1="130" x2="470" y2="120"/>
  <text class="label" x="475" y="125">Kaziranga</text>

  <!-- Sundarbans -->
  <line class="label-line" x1="460" y1="200" x2="520" y2="210"/>
  <text class="label" x="525" y="215">Sundarbans</text>

  <!-- Gir -->
  <line class="label-line" x1="150" y1="260" x2="100" y2="260"/>
  <text class="label" x="105" y="265">Gir</text>

  <!-- Ranthambore -->
  <line class="label-line" x1="180" y1="200" x2="130" y2="190"/>
  <text class="label" x="135" y="195">Ranthambore</text>

  <!-- Bandipur -->
  <line class="label-line" x1="260" y1="300" x2="320" y2="320"/>
  <text class="label" x="325" y="325">Bandipur</text>

  <!-- Keoladeo -->
  <line class="label-line" x1="190" y1="250" x2="140" y2="270"/>
  <text class="label" x="145" y="275">Keoladeo</text>

  <!-- Kanha -->
  <line class="label-line" x1="260" y1="210" x2="310" y2="230"/>
  <text class="label" x="315" y="235">Kanha</text>
</svg>