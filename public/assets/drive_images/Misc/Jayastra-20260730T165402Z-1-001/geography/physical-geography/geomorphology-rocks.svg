<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for arrowheads -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#000"/>
    </marker>
  </defs>

  <!-- Earth layers -->
  <circle cx="300" cy="200" r="150" fill="#e0a060"/> <!-- Crust -->
  <circle cx="300" cy="200" r="130" fill="#ff9966"/> <!-- Mantle -->
  <circle cx="300" cy="200" r="80" fill="#ffcc66"/>  <!-- Outer Core -->
  <circle cx="300" cy="200" r="50" fill="#ff9999"/>  <!-- Inner Core -->

  <!-- Tectonic plates on crust -->
  <polygon points="150,200 250,200 260,210 150,210" fill="#66ccff"/> <!-- Plate A -->
  <polygon points="350,200 450,200 440,210 350,210" fill="#ff6666"/> <!-- Plate B -->

  <!-- Subduction zone (Plate A under Plate B) -->
  <polygon points="260,210 300,250 340,210 300,210" fill="#999999" opacity="0.6"/>

  <!-- Volcano -->
  <polygon points="340,210 350,190 360,210" fill="#333333"/>

  <!-- Labels for Earth layers -->
  <text x="300" y="190" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#000">Crust</text>
  <text x="300" y="150" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#000">Mantle</text>
  <text x="300" y="115" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#000">Outer Core</text>
  <text x="300" y="85" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#000">Inner Core</text>

  <!-- Labels for plates -->
  <text x="200" y="190" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#000">Plate A</text>
  <text x="400" y="190" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#000">Plate B</text>

  <!-- Boundary label -->
  <text x="300" y="230" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#000">Convergent Boundary (Subduction)</text>

  <!-- Volcano label -->
  <text x="350" y="180" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#000">Volcano (Igneous)</text>

  <!-- Rock cycle diagram -->
  <!-- Igneous -->
  <circle cx="80" cy="340" r="20" fill="#ff9999"/>
  <text x="80" y="345" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#000">Igneous</text>
  <!-- Arrow to Sedimentary -->
  <path d="M100,340 L140,340" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Sedimentary -->
  <circle cx="160" cy="340" r="20" fill="#99ff99"/>
  <text x="160" y="345" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#000">Sedimentary</text>
  <!-- Arrow to Metamorphic -->
  <path d="M180,340 L220,340" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Metamorphic -->
  <circle cx="240" cy="340" r="20" fill="#9999ff"/>
  <text x="240" y="345" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#000">Metamorphic</text>
  <!-- Arrow back to Igneous -->
  <path d="M260,340 L300,340" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M300,340 C320,340 320,300 260,300" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="300" y="285" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#000">Melting</text>
</svg>